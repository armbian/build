# Nexell S5P6818 octa core 1GB RAM GbE eMMC/SD WiFi/BT (NanoPi M3, NanoPC-T3)
# NanoPi M3 / NanoPC-T3 (1 GiB). Full-featured 1 GiB boards: they use the same
# "full" device tree as the NanoPC-T3+ (on-board eMMC + SDIO WiFi/BT + ES8316
# audio, see s5p6818-nanopi-m3.dtb) but the 1 GiB boot blob (DRAM init in BL1),
# like the Fire3. u-boot fills the real RAM size into the DT.
# NOTE: the peripheral set is modelled on the HW-verified NanoPC-T3+; pending
# validation on real M3/T3 hardware.
BOARD_NAME="NanoPi M3 / NanoPC-T3"
BOARDFAMILY="s5p6818"
BOARD_VENDOR="friendlyelec"
BOARD_MAINTAINER="igorpecovnik"
BOOTCONFIG="nanopim3_defconfig"
BOOT_FDT_FILE="nexell/s5p6818-nanopi-m3.dtb"
MODULES_CURRENT="g_serial"
SERIALCON="ttySAC0,ttyGS0"
KERNEL_TARGET="edge"
KERNEL_TEST_TARGET="edge"
INTRODUCED="2016"
