# Rockchip RK3568 SoC with HDMI LVDS Ethernet 4xAHD USB3 CAN RS485 2xSATA WiFi/BT M.2 etc.
BOARD_NAME="SBC3568"
BOARD_VENDOR="boardcon"
BOARDFAMILY="rk35xx"
BOARD_MAINTAINER="boardcon-arm"
INTRODUCED="2026"
BOOT_SOC="rk3568"
KERNEL_TARGET="vendor"
KERNEL_TEST_TARGET="vendor"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
IMAGE_PARTITION_TABLE="gpt"
BOOT_FDT_FILE="rockchip/rk3568-boardcon-sbc-v4.dtb"
BOOT_SCENARIO="spl-blobs"

declare -g ASOUND_STATE="asound.state.boardcon-sbc3568"

function post_family_config__boardcon_sbc3568_use_mainline_uboot()
{
	display_alert "$BOARD" "Using mainline U-Boot for $BOARD / $BRANCH" "info"

	declare -g BOOTCONFIG="boardcon-rk3568_defconfig"
	declare -g BOOTSOURCE="https://github.com/u-boot/u-boot.git"
	declare -g BOOTBRANCH="tag:v2026.07"
	declare -g BOOTPATCHDIR="v2026.07"

	declare -g UBOOT_TARGET_MAP="BL31=${RKBIN_DIR}/${BL31_BLOB} ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB};;u-boot-rockchip.bin"

	unset uboot_custom_postprocess write_uboot_platform write_uboot_platform_mtd

	function write_uboot_platform() {
		dd "if=$1/u-boot-rockchip.bin" "of=$2" bs=32k seek=1 conv=notrunc status=none
	}
}

# Fix Goodix GT928 touchscreen X-axis inversion
function post_family_tweaks__boardcon_sbc3568_touchscreen()
{
	display_alert "$BOARD" "Installing Goodix touchscreen orientation rule" "info"

	install -d -m 0755 "${SDCARD}/etc/udev/rules.d"

	cat > "${SDCARD}/etc/udev/rules.d/99-boardcon-touch.rules" <<-'EOF'
	ACTION=="add|change", SUBSYSTEM=="input", KERNEL=="event*", ATTRS{name}=="goodix-ts", ENV{LIBINPUT_CALIBRATION_MATRIX}="-1 0 1 0 1 0"
	EOF
}
