# Rockchip RK3588 SoC HDMI MIPI DSI Ethernet RS485 AHD SATA M.2 WiFi/BT 4G
BOARD_NAME="EM3588"
BOARD_VENDOR="boardcon"
BOARDFAMILY="rockchip-rk3588"
BOARD_MAINTAINER="boardcon-arm"
INTRODUCED="2026"
BOOT_SOC="rk3588"
KERNEL_TARGET="vendor"
KERNEL_TEST_TARGET="vendor"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
IMAGE_PARTITION_TABLE="gpt"
BOOTCONFIG="boardcon-em3588_defconfig"
BOOT_FDT_FILE="rockchip/rk3588-boardcon-em-v2.dtb"
BOOT_SCENARIO="spl-blobs"

declare -g ASOUND_STATE="asound.state.boardcon-em3588"

# Initialize RTL8852BS Bluetooth via UART8
function post_family_tweaks__boardcon_em3588_bluetooth()
{
    display_alert "$BOARD" "Installing RTL8852BS Bluetooth service" "info"

    # Build rtk_hciattach
    make -C "${SRC}/packages/bsp/boardcon-em3588/rtk_hciattach" clean || return 1
    make -C "${SRC}/packages/bsp/boardcon-em3588/rtk_hciattach" \
        CC=aarch64-linux-gnu-gcc || return 1

    # Install rtk_hciattach
    install -D -m 0755 \
        "${SRC}/packages/bsp/boardcon-em3588/rtk_hciattach/rtk_hciattach" \
        "${SDCARD}/usr/bin/rtk_hciattach"

    # Install systemd service
    install -D -m 0644 \
        "${SRC}/packages/bsp/boardcon-em3588/rtk-hciattach.service" \
        "${SDCARD}/etc/systemd/system/rtk-hciattach.service"

    # Enable Bluetooth service
    install -d -m 0755 \
        "${SDCARD}/etc/systemd/system/multi-user.target.wants"

    ln -sfn \
        /etc/systemd/system/rtk-hciattach.service \
        "${SDCARD}/etc/systemd/system/multi-user.target.wants/rtk-hciattach.service"
}


