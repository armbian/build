# x86_64 via UEFI/BIOS for a generic hardware board
declare -g BOARD_NAME="UEFI x86"
declare -g BOARD_VENDOR="generic"
declare -g BOARDFAMILY="uefi-x86"
declare -g BOARD_MAINTAINER="igorpecovnik rpardini"
declare -g INTRODUCED="2022"
declare -g KERNEL_TARGET="current,edge,legacy,cloud"
declare -g KERNEL_TEST_TARGET="current"
declare -g SERIALCON="tty1"
declare -g BOOT_LOGO=desktop

# Load the Intel GPU drivers from the initramfs. The display handover then happens
# before Plymouth starts, so the splash does not blink. Also on CLI images:
# a desktop installed later needs no initramfs change. Not for the cloud kernel.
function post_family_tweaks__uefi_x86_early_kms() {
	[[ "${BRANCH}" == "cloud" ]] && return 0
	display_alert "$BOARD" "Loading Intel GPU drivers from the initramfs" "info"
	printf '%s\n' xe i915 >> "${SDCARD}"/etc/initramfs-tools/modules
}

# libinput quirks for touchpads that libinput does not know yet.
# Only noble and trixie: libinput 1.30.1+ reads INPUT_PROP_PRESSUREPAD from the
# kernel, and libinput 1.22 and older drop all quirks on this key.
function post_family_tweaks_bsp__uefi_x86_libinput_quirks() {
	[[ "${RELEASE}" == noble || "${RELEASE}" == trixie ]] || return 0
	display_alert "$BOARD" "Installing libinput quirks" "info"
	install -Dm644 "$SRC/packages/bsp/uefi-x86/31-armbian-goodix.quirks" "${destination}/usr/share/libinput/31-armbian-goodix.quirks"
}
