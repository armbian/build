# x86_64 via UEFI/BIOS for a generic hardware board
declare -g BOARD_NAME="UEFI x86"
declare -g BOARD_VENDOR="generic"
declare -g BOARDFAMILY="uefi-x86"
declare -g BOARD_MAINTAINER="igorpecovnik rpardini"
declare -g INTRODUCED="2022"
declare -g KERNEL_TARGET="current,edge,legacy,cloud"
declare -g KERNEL_TEST_TARGET="current"
declare -g SERIALCON="tty1"
declare -g BOOT_LOGO=desktop

# Desktop: load the Intel GPU drivers from the initramfs. The display handover
# then happens before Plymouth starts, so the splash does not blink.
function post_family_tweaks__uefi_x86_early_kms() {
	[[ "${BUILD_DESKTOP}" == "yes" ]] || return 0
	display_alert "$BOARD" "Loading Intel GPU drivers from the initramfs" "info"
	printf '%s\n' xe i915 >> "${SDCARD}"/etc/initramfs-tools/modules
}
