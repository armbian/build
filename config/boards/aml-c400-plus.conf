# Amlogic S912 octa core 3Gb RAM SoC eMMC
BOARD_NAME="Magicsee C400 Plus"
BOARD_VENDOR="amlogic"
BOARDFAMILY="meson-gxl"
BOARD_MAINTAINER="jomadeto"
INTRODUCED="2022"
BOOTSIZE="512"
BOOTFS_TYPE="fat"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"
MODULES_BLACKLIST="simpledrm" # SimpleDRM conflicts with Panfrost
SERIALCON="ttyAML0"
FULL_DESKTOP="yes"
ASOUND_STATE="asound.state.mesongx"
BOOT_FDT_FILE="amlogic/meson-gxm-c400-plus.dtb"
BOOTCONFIG="meson-gxm-c400-plus_defconfig"
BOOT_LOGO="desktop"
SRC_EXTLINUX="yes"
SRC_CMDLINE="rootflags=data=writeback console=ttyAML0,115200n8 console=tty0"

# Newer u-boot configuration
BOOTBRANCH_BOARD="tag:v2026.07"
BOOTPATCHDIR="v2026.07"

# Blob repacking, based on retro98boy's gxlimg extension; blob comes via amlogic-fip-blobs, for this board, at least rev 4312e61a needed
enable_extension "gxlimg"
enable_extension "amlogic-fip-blobs"

# u-boot env storage in eMMC boot0/boot1 partitions
declare -g UBOOT_MMC_ENV_MODE="hwpart"  # use boot0/boot1 partitions for the environment
declare -g UBOOT_MMC_ENV_DEVICE_INDEX=2 # mmc2 is the eMMC on this board (mmc1 is SDCard, mmc0 the sdio wifi)
enable_extension "uboot-mainline-mmc-env-storage"

# Use this when booting from factory/vendor blobs on eMMC; stop boot via UART and: fatload mmc 0:1 0x01000000 u-boot.ext; go 0x01000000
# Once booted that way you can write full image to eMMC and then boot from it directly.
function pre_umount_final_image__export_uboot_rom() {
	: "${version:?version is not set}"
	local uboot_name="linux-u-boot-${BRANCH}-${BOARD}"
	display_alert "Exporting u-boot.bin" "${uboot_name} - ${version}.u-boot.bin" "debug"
	run_host_command_logged cp -pv "${MOUNT}/usr/lib/${uboot_name}/u-boot.bin" "${MOUNT}/boot/u-boot.ext"
}

function post_family_tweaks_bsp__config_aml-c400-plus_bsp() {
	: "${destination:?destination is not set}"

	# Important: this board has board-specific bsp-cli files in config/optional/boards/aml-c400-plus/_packages/bsp-cli
	#            that path is hashed by the bsp-cli hashing function automatically
	display_alert "${BOARD}" "Adjusting perms of bsp-cli files for ${BOARD} in /root" "info"
	run_host_command_logged chmod -v 744 "${destination}"/root/install-aml.sh
	run_host_command_logged chmod -v 644 "${destination}"/root/fstab.template

	display_alert "${BOARD}" "Removing armbian-install" "info"
	run_host_command_logged rm -v "${destination}"/usr/bin/armbian-install

	display_alert "${BOARD}" "Adding bsp-cli preinst logic" "info"
	# Inline function! So this function is automatically hashed when this hook is hashed.
	function aml-c400-plus-bsp-cli-preinst() {
		#update of the board bsp-cli package fails because the filesystem type is
		#fat and dpkg tries to create a hard link for the existing files as backup
		#so rm the files instead in a preinst step
		[ -f /boot/aml_autoscript ] && rm /boot/aml_autoscript
		[ -f /boot/emmc_autoscript ] && rm /boot/emmc_autoscript
		[ -f /boot/s905_autoscript ] && rm /boot/s905_autoscript
		return 0 # short-circuits above, avoid errors
	}

	preinst_functions+=('aml-c400-plus-bsp-cli-preinst')
	if false; then aml-c400-plus-bsp-cli-preinst; fi # so shellcheck stops complaining the function is unused. sorry

}

function post_uboot_custom_postprocess__repack_vendor_fip_with_mainline_uboot_c400plus() {
	# Check the size of bl33 (built-from-source u-boot.bin at this stage).
	# It seems the vendor blobs have a limit on how large bl33 can be, and if we exceed that limit, the board will not boot.
	# bl2 blobs log:
	#   Load bl30 from ... des: 0x01100000 ...
	#   Load bl33 from ... des: 0x01000000 ...
	# meaning, we must fit bl33 between 0x01000000 and 0x01100000, which is 0x00100000 bytes = 1048576 bytes = 1MiB.

	declare -i bl33_size
	bl33_size=$(stat -c %s u-boot.bin)
	display_alert "u-boot for ${BOARD}/${BRANCH}" "bl33 size: ${bl33_size} bytes" "info"
	if [ "${bl33_size}" -gt 1048576 ]; then
		display_alert "u-boot for ${BOARD}/${BRANCH}" "bl33 size exceeds 1MiB, board will not boot! (${bl33_size} bytes)" "error"
		return 1
	fi

	# do the repack. it extracts the FIP, encrypts our new u-boot into bl33.enc, and reassembles. result is in 'u-boot.bin'.
	gxlimg_repack_fip_with_new_uboot "${SRC}/cache/sources/amlogic-fip-blobs/aml-c400-plus/DDR3_version/bootloader.PARTITION" "gxm"
	return 0
}

function post_family_config__use_repacked_fip_c400plus() {
	declare -g UBOOT_TARGET_MAP="u-boot.bin"
	unset write_uboot_platform
	function write_uboot_platform() {
		dd if="$1/u-boot.bin" of="$2" bs=512 seek=1 conv=fsync,notrunc 2>&1
	}
}

# Enable extra u-boot .config options, this way we avoid patching defconfig
function post_config_uboot_target__extra_configs_for_c400plus() {
	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable preboot & flash user LED in preboot" "info"
	run_host_command_logged scripts/config --enable CONFIG_USE_PREBOOT
	run_host_command_logged scripts/config --set-str CONFIG_PREBOOT "'led red:status on; sleep 0.1; led red:status off; sleep 0.1; led red:status on; sleep 0.1; led red:status off;'" # double quotes required due to run_host_command_logged's quirks

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable I2C support" "info"
	run_host_command_logged scripts/config --enable CONFIG_DM_I2C
	run_host_command_logged scripts/config --enable CONFIG_SYS_I2C_MESON
	run_host_command_logged scripts/config --enable CONFIG_CMD_I2C

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable EFI debugging commands" "info"
	run_host_command_logged scripts/config --enable CMD_EFIDEBUG
	run_host_command_logged scripts/config --enable CMD_NVEDIT_EFI

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable more filesystems support" "info"
	run_host_command_logged scripts/config --enable CONFIG_CMD_BTRFS

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable more compression support" "info"
	run_host_command_logged scripts/config --enable CONFIG_LZO
	run_host_command_logged scripts/config --enable CONFIG_BZIP2
	run_host_command_logged scripts/config --enable CONFIG_ZSTD

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable gpio LED support" "info"
	run_host_command_logged scripts/config --enable CONFIG_LED
	run_host_command_logged scripts/config --enable CONFIG_LED_GPIO

	# DISABLED: causes u-boot.bin to go over 1MiB.
	#display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable some USB ethernet drivers" "info"
	#run_host_command_logged scripts/config --enable CONFIG_USB_HOST_ETHER
	#run_host_command_logged scripts/config --enable CONFIG_USB_ETHER_ASIX
	#run_host_command_logged scripts/config --enable CONFIG_USB_ETHER_ASIX88179
	#run_host_command_logged scripts/config --enable CONFIG_USB_ETHER_MCS7830
	#run_host_command_logged scripts/config --enable CONFIG_USB_ETHER_RTL8152
	#run_host_command_logged scripts/config --enable CONFIG_USB_ETHER_SMSC95XX

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable networking cmds" "info"
	run_host_command_logged scripts/config --enable CONFIG_CMD_NFS
	run_host_command_logged scripts/config --enable CONFIG_CMD_WGET
	run_host_command_logged scripts/config --enable CONFIG_CMD_DNS
	run_host_command_logged scripts/config --enable CONFIG_PROT_TCP
	run_host_command_logged scripts/config --enable CONFIG_PROT_TCP_SACK

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable LWIP (new networking stack)" "info"
	run_host_command_logged scripts/config --enable CONFIG_CMD_MII
	run_host_command_logged scripts/config --enable CONFIG_NET_LWIP

	# DISABLED: causes u-boot.bin to go over 1MiB.
	#display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable MBed TLS stuff" "info"
	#run_host_command_logged scripts/config --enable CONFIG_WGET_HTTPS
	#run_host_command_logged scripts/config --enable CONFIG_WGET_CACERT
	#run_host_command_logged scripts/config --enable CONFIG_WGET_BUILTIN_CACERT # not yet
	#run_host_command_logged scripts/config --enable CONFIG_MBEDTLS_LIB

	# UMS, gadget stuff
	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable UMS gadget" "info"
	declare -a enable_configs=("CONFIG_CMD_USB_MASS_STORAGE" "CONFIG_USB_GADGET" "USB_GADGET_DOWNLOAD" "CONFIG_USB_FUNCTION_ACM")
	for config in "${enable_configs[@]}"; do
		run_host_command_logged scripts/config --enable "${config}"
	done
	# Auto-enabled by the above, force off...
	run_host_command_logged scripts/config --disable USB_FUNCTION_FASTBOOT

	return 0
}
