# Nexell S5P6818 octa core SoC 1/2GB RAM GbE eMMC/SD (NanoPC-T3+, NanoPi M3/Fire3)
# One target for the FriendlyARM S5P6818 family: the NanoPC-T3+ is the reference
# test board; the same kernel and shared device tree also boot the NanoPi M3 and
# Fire3 (u-boot fills in each board's RAM size).
BOARD_NAME="NanoPC-T3+ / NanoPi M3 / Fire3"
BOARDFAMILY="s5p6818"
BOARD_MAINTAINER="igorpecovnik"
BOOTCONFIG="s5p6818_nanopim3_defconfig"
MODULES_CURRENT="g_serial"
SERIALCON="ttySAC0,ttyGS0"
KERNEL_TARGET="current"
FULL_DESKTOP="yes"
