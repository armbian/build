# Nexell S5P6818 octa core 2GB RAM GbE eMMC/SD WiFi/BT (NanoPC-T3+)
# NanoPC-T3+ (2 GiB). Shares the S5P6818 kernel + device tree with the 1 GiB
# NanoPi Fire3 / M3 / NanoPC-T3 (see nanopifire3); the only difference is the
# 2 GiB boot blob (DRAM init in BL1). u-boot fills the real RAM size into the DT.
BOARD_NAME="NanoPC-T3+"
BOARDFAMILY="s5p6818"
BOARD_VENDOR="friendlyelec"
BOARD_MAINTAINER="igorpecovnik"
BOOTCONFIG="nanopim3_defconfig"
MODULES_CURRENT="g_serial"
SERIALCON="ttySAC0,ttyGS0"
KERNEL_TARGET="current"
FULL_DESKTOP="yes"
