# Nexell S5P6818 octa core 2GB RAM GbE eMMC/SD WiFi/BT (NanoPC-T3+)
# NanoPC-T3+ (2 GiB). Full-featured board: shares the "full" device tree
# (eMMC + SDIO WiFi/BT + ES8316 audio) with the 1 GiB NanoPi M3 / NanoPC-T3
# (see nanopi-m3); the only difference is the 2 GiB boot blob (DRAM init in
# BL1). u-boot fills the real RAM size into the DT.
BOARD_NAME="NanoPC-T3+"
BOARDFAMILY="s5p6818"
BOARD_VENDOR="friendlyelec"
BOARD_MAINTAINER="igorpecovnik"
BOOTCONFIG="nanopim3_defconfig"
BOOT_FDT_FILE="nexell/s5p6818-nanopi-m3.dtb"
MODULES_CURRENT="g_serial"
SERIALCON="ttySAC0,ttyGS0"
KERNEL_TARGET="edge"
KERNEL_TEST_TARGET="edge"
INTRODUCED="2017"
