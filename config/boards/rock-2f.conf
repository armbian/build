# Rockchip RK3528 quad core 1-4GB SoC WIFI/BT 0-32GB eMMC
BOARD_NAME="ROCK 2F"
BOARD_VENDOR="radxa"
BOARDFAMILY="rk35xx"
BOOTCONFIG="rock-2-rk3528_defconfig"
BOARD_MAINTAINER="CodeChenL"
INTRODUCED="2024"
KERNEL_TARGET="vendor,edge,bleedingedge"
KERNEL_TEST_TARGET="vendor,edge"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3528-rock-2f.dtb"
BOOT_SCENARIO="spl-blobs"
IMAGE_PARTITION_TABLE="gpt"
enable_extension "radxa-aic8800"
AIC8800_TYPE="usb"

# Mainline kernels (edge/bleedingedge) get mainline u-boot and a ttyS0 console; vendor keeps Radxa's u-boot.
function post_family_config__rock2f_mainline() {
	[[ "${BRANCH}" == *"edge" ]] || return 0 # only for edge/bleedingedge

	display_alert "$BOARD" "Using mainline u-boot for $BOARD / $BRANCH" "info"

	declare -g BOOTDELAY=1
	declare -g BOOTSOURCE="https://github.com/u-boot/u-boot.git"
	declare -g BOOTBRANCH="tag:v2026.07"
	declare -g BOOTPATCHDIR="v2026.07"
	declare -g BOOTDIR="u-boot-${BOARD}"

	# rk3528 has no mainline TF-A platform support yet, so we use the vendor's TF-A blobs for now.
	declare -g UBOOT_TARGET_MAP="BL31=${RKBIN_DIR}/${BL31_BLOB} ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB};;u-boot-rockchip.bin"
	unset uboot_custom_postprocess write_uboot_platform write_uboot_platform_mtd

	function write_uboot_platform() {
		dd "if=$1/u-boot-rockchip.bin" "of=$2" bs=32k seek=1 conv=notrunc status=none
	}

	# The rk3528 debug UART is uart0; the mainline kernel exposes it as ttyS0, not the family default ttyS2.
	declare -g BOOTSCRIPT="boot-rockchip64-ttyS0.cmd:boot.cmd"
	declare -g SERIALCON="ttyS0"

	# Mainline rockchip64 overlays are named rockchip-<soc>-<feature>.dtso, not rk35xx-*.
	declare -g OVERLAY_PREFIX="rockchip"
}
