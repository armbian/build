# FriendlyElec RK3588S NanoPi R6S, R6C, M6/M6V2 and NanoPC T6 common image
BOARD_NAME="FriendlyElec RK3588 common"
BOARD_VENDOR="friendlyelec"
BOARDFAMILY="rockchip-rk3588"
BOARD_MAINTAINER="efectn SuperKali Tonymac32"
INTRODUCED="2026"
BOOTCONFIG="nanopi6-series-rk3588s_defconfig"
BOOT_SOC="rk3588"
KERNEL_TARGET="current,edge,vendor"
KERNEL_TEST_TARGET="vendor,current"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_SCENARIO="spl-blobs"
BOOT_SUPPORT_SPI="yes"
BOOT_SPI_RKSPI_LOADER="yes"
IMAGE_PARTITION_TABLE="gpt"

# U-Boot selects the matching kernel DTB at runtime from the SARADC HW-ID.
unset BOOT_FDT_FILE

# In case another u-boot is used, we provide a fallback DTB as R6S board to prevent boot failure.
BOOT_FDT_FILE_FALLBACK="rockchip/rk3588s-nanopi-r6s.dtb"

function post_family_tweaks__nanopi6_series_naming_udev() {
	display_alert "$BOARD" "Adding NanoPi 6-series audio and network names" "info"

	mkdir -p "$SDCARD/etc/udev/rules.d/"
	cat <<- 'EOF' > "$SDCARD/etc/udev/rules.d/90-nanopi6-audio.rules"
		IMPORT{cmdline}="nanopi6_model"

		SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmi0-sound", ENV{SOUND_DESCRIPTION}="HDMI0 Audio"
		SUBSYSTEM=="sound", ENV{nanopi6_model}=="t6*", ENV{ID_PATH}=="platform-hdmi1-sound", ENV{SOUND_DESCRIPTION}="HDMI1 Audio"
		SUBSYSTEM=="sound", ENV{nanopi6_model}=="t6*", ENV{ID_PATH}=="platform-hdmiin-sound", ENV{SOUND_DESCRIPTION}="HDMI-In Audio"
		SUBSYSTEM=="sound", ENV{nanopi6_model}=="t6*", ENV{ID_PATH}=="platform-dp0-sound", ENV{SOUND_DESCRIPTION}="DP0 Audio"
		SUBSYSTEM=="sound", ENV{nanopi6_model}=="t6*", ENV{ID_PATH}=="platform-rt5616-sound", ENV{SOUND_DESCRIPTION}="RT5616 Audio"
	EOF

	cat <<- 'EOF' > "$SDCARD/etc/udev/rules.d/70-nanopi6-network.rules"
		IMPORT{cmdline}="nanopi6_model"

		SUBSYSTEM=="net", ACTION=="add", DRIVERS=="?*", KERNELS=="fe1c0000.ethernet", ENV{nanopi6_model}=="r6s", NAME:="lan2"
		SUBSYSTEM=="net", ACTION=="add", DRIVERS=="r8169", KERNELS=="0003:31:00.0", ENV{nanopi6_model}=="r6s", NAME:="wan"
		SUBSYSTEM=="net", ACTION=="add", DRIVERS=="r8169", KERNELS=="0004:41:00.0", ENV{nanopi6_model}=="r6s", NAME:="lan1"

		SUBSYSTEM=="net", ACTION=="add", KERNELS=="fe1c0000.ethernet", ENV{nanopi6_model}=="r6c", NAME:="wan1"
		SUBSYSTEM=="net", ACTION=="add", KERNELS=="0003:31:00.0", ENV{nanopi6_model}=="r6c", NAME:="lan1"

		SUBSYSTEM=="net", ACTION=="add", DRIVERS=="?*", KERNELS=="fe1c0000.ethernet", ENV{nanopi6_model}=="m6", NAME:="lan"
		SUBSYSTEM=="net", ACTION=="add", DRIVERS=="?*", KERNELS=="fe1c0000.ethernet", ENV{nanopi6_model}=="m6v2", NAME:="lan"
	EOF
}

# ASOUND_STATE is normally copied at image-build time, but this image may boot
# on several boards.  Select a per-model profile at first boot from U-Boot's
# SARADC model detection; add future board profiles to the case below.
function post_family_tweaks__nanopi6_series_asound_state() {
	display_alert "$BOARD" "Installing NanoPi 6 runtime ALSA-state selector" "info"

	install -d "$SDCARD/usr/lib/armbian" "$SDCARD/etc/systemd/system/alsa-restore.service.d"
	install -m 0644 "$SRC/packages/blobs/asound.state/asound.state.nanopct6" "$SDCARD/usr/lib/armbian/asound.state.nanopct6"

	cat <<- 'EOF' > "$SDCARD/usr/lib/armbian/nanopi6-asound-state-init"
		#!/bin/sh
		set -eu

		model=""
		for argument in $(cat /proc/cmdline); do
			case "$argument" in
				nanopi6_model=*) model=${argument#nanopi6_model=} ; break ;;
			esac
		done

		case "$model" in
			t6|t6-lts|t6-lts-plus) profile=/usr/lib/armbian/asound.state.nanopct6 ;;
			*) exit 0 ;;
		esac

		state=/var/lib/alsa/asound.state
		marker=/var/lib/armbian/nanopi6-asound-state-initialized

		[ -e "$marker" ] && exit 0
		mkdir -p /var/lib/alsa /var/lib/armbian
		if [ -e "$state" ]; then
			touch "$marker"
			exit 0
		fi

		[ -r "$profile" ] || exit 0
		cp "$profile" "$state"
		touch "$marker"
	EOF
	chmod 0755 "$SDCARD/usr/lib/armbian/nanopi6-asound-state-init"

	cat <<- 'EOF' > "$SDCARD/etc/systemd/system/nanopi6-asound-state-init.service"
		[Unit]
		Description=Initialize model-specific NanoPi 6 ALSA state
		After=local-fs.target
		Before=alsa-restore.service

		[Service]
		Type=oneshot
		ExecStart=/usr/lib/armbian/nanopi6-asound-state-init
	EOF

	cat <<- 'EOF' > "$SDCARD/etc/systemd/system/alsa-restore.service.d/10-nanopi6-asound-state.conf"
		[Unit]
		Wants=nanopi6-asound-state-init.service
		After=nanopi6-asound-state-init.service
	EOF
}

function post_family_config__nanopi6_series_use_mainline_uboot() {
	display_alert "$BOARD" "Using unified NanoPi 6 series U-Boot for $BRANCH" "info"

	declare -g BOOTDELAY=1
	declare -g BOOTSOURCE="https://github.com/u-boot/u-boot.git"
	declare -g BOOTBRANCH="tag:v2026.07"
	# Keep board patches independent of the per-board BSP package name.  Each
	# consumer board sources this file but must receive the same unified U-Boot.
	declare -g BOOTPATCHDIR="v2026.07 v2026.07/board_friendlyelec-rk3588"
	declare -g BOOTDIR="u-boot-${BOARD}"
	declare -g UBOOT_TARGET_MAP="BL31=${RKBIN_DIR}/${BL31_BLOB} ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB};;u-boot-rockchip.bin u-boot-rockchip-spi.bin"
	unset uboot_custom_postprocess write_uboot_platform write_uboot_platform_mtd

	function write_uboot_platform() {
		dd "if=$1/u-boot-rockchip.bin" "of=$2" bs=32k seek=1 conv=notrunc status=none
	}

	function write_uboot_platform_mtd() {
		flashcp -v -p "$1/u-boot-rockchip-spi.bin" /dev/mtd0
	}
}

function pre_config_uboot_target__nanopi6_series_patch_ums_dtsi() {
	display_alert "u-boot for ${BOARD}" "enable UMS on the OTG port" "info"
	local -a ums_dtsis=(
		rk3588s-nanopi6-series-u-boot.dtsi
		rk3588-nanopc-t6-u-boot.dtsi
	)
	local ums_dtsi

	for ums_dtsi in "${ums_dtsis[@]}"; do
		cat <<- EOD >> "arch/arm/dts/${ums_dtsi}"
			&u2phy0 { status = "okay"; };
			&u2phy0_otg { status = "okay"; };
			&usbdp_phy0 { status = "okay"; };
			&usb_host0_xhci { dr_mode = "peripheral"; maximum-speed = "high-speed"; status = "okay"; };
		EOD
	done
}

function pre_config_uboot_target__nanopi6_series_patch_efi_bootmeth() {
	local efi_mgr_file="boot/bootmeth_efi_mgr.c"

	if [[ -f "${efi_mgr_file}" ]]; then
		display_alert "u-boot for ${BOARD}" "make EFI bootmeth board-local" "info"
		sed -i 's/plat->flags = BOOTMETHF_GLOBAL;/plat->flags = 0;/g' "${efi_mgr_file}"
	else
		display_alert "u-boot for ${BOARD}" "${efi_mgr_file} not found" "warning"
	fi
}

function post_config_uboot_target__nanopi6_series_extra_configs() {
	display_alert "u-boot for ${BOARD}/${BRANCH}" "enable common NanoPi 6 recovery features" "info"
	declare -a enable_configs=(
		CONFIG_DM_PMIC_FAN53555 CONFIG_CMD_MISC CMD_EFIDEBUG CMD_NVEDIT_EFI
		CONFIG_CMD_BTRFS CONFIG_LZO CONFIG_BZIP2 CONFIG_ZSTD CONFIG_CMD_NFS
		CONFIG_CMD_WGET CONFIG_CMD_DNS CONFIG_PROT_TCP CONFIG_PROT_TCP_SACK
		CONFIG_CMD_MII CONFIG_NET_LWIP CONFIG_CMD_USB_MASS_STORAGE
		CONFIG_USB_GADGET USB_GADGET_DOWNLOAD CONFIG_USB_FUNCTION_ROCKUSB
		CONFIG_USB_FUNCTION_ACM CONFIG_CMD_ROCKUSB
	)
	local config
	for config in "${enable_configs[@]}"; do
		run_host_command_logged scripts/config --enable "${config}"
	done
	run_host_command_logged scripts/config --disable USB_FUNCTION_FASTBOOT
}
