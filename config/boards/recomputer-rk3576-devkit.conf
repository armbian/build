# Seeed Studio Rockchip RK3576 octa core 8GB RAM eMMC GbE USB3 HDMI WiFi BT
BOARD_NAME="reComputer RK3576"
BOARDFAMILY="seeed-rk3576"
BOOT_SOC="rk3576"
BOARD_MAINTAINER="Pillar1989"
BOARD_VENDOR="seeed-studio"
INTRODUCED="2025"
BOOTCONFIG="recomputer-rk3576-devkit_defconfig"
KERNEL_TARGET="vendor,edge"
KERNEL_TEST_TARGET="vendor"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3576-recomputer-rk3576-devkit.dtb"
BOOT_SCENARIO="spl-blobs"
BOOT_SUPPORT_SPI="yes"
BOOT_SPI_RKSPI_LOADER="yes"
IMAGE_PARTITION_TABLE="gpt"
OTA_ENABLE="yes"
BT_UART="/dev/ttyS4"
AIC8800_TYPE="sdio"
# Use the open-source panfrost driver for Mali-G52 (Bifrost); userspace is
# Mesa. The closed libmali-bifrost blob is NOT a fallback here: this kernel
# enables CONFIG_DRM_PANFROST and disables MALI_BIFROST (kbase), and the two
# drivers cannot bind the same GPU, so the closed userspace has no kernel
# side to talk to.
RECOMPUTER_GPU_STACK="panfrost"
# Mainline U-Boot (non-vendor branches): this board's defconfig and u-boot
# dtsi base name; the shared machinery lives in the family conf
# (config/sources/families/seeed-rk3576.conf).
RECOMPUTER_MAINLINE_BOOTCONFIG="recomputer-rk3576_defconfig"
RECOMPUTER_UBOOT_DTSI_BASE="rk3576-recomputer-devkit"

# select case for BRANCH=vendor to source the Seeed Studio recomputer-rk35xx-common.inc
case "${BRANCH}" in
	vendor)
		[[ "${SEEED_AIC8800_ENABLE:-"${SEEED_DEFAULT_ENABLE:-"yes"}"}" == "yes" ]] &&
			enable_extension "radxa-aic8800"
		[[ "${SEEED_AIC_BLUEZ_ENABLE:-"${SEEED_DEFAULT_ENABLE:-"yes"}"}" == "yes" ]] &&
			declare -g PACKAGE_LIST_BOARD="net-tools rfkill pulseaudio-module-bluetooth fail2ban"

		declare -g SERIALCON="ttyFIQ0,ttyGS0"
		source "${SRC}/config/sources/vendors/seeed-studio/recomputer-rk35xx-common.inc"
		;;

	*)
		# @TODO: there is no aic8800 support for kernel > v7.0 yet
		# mainline DTB name is different
		declare -g BOOT_FDT_FILE="rockchip/rk3576-recomputer-devkit.dtb"
		# userspace for manipulating the u-boot env stored in SPI flash
		PACKAGE_LIST_BOARD="libubootenv-tool" # libubootenv-tool provides fw_printenv and fw_setenv, for talking to U-Boot environment
		;;
esac

# Install camera engine rkaiq for Rockchip ISP
function pre_install_distribution_specific__recomputer_rk3576_install_camera_engine() {
	[[ "${BRANCH}" == "vendor" ]] || return 0 # only for BRANCH=vendor
	display_alert "Installing camera engine from APT repo" "camera-engine-rkaiq" "info"

	seeed_recomputer_install_from_apt camera-engine-rkaiq-rk3576
}
