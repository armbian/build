# Amlogic A311D 4GB RAM eMMC GBE USB3
BOARD_NAME="Banana Pi CM4IO"
BOARD_VENDOR="sinovoip"
BOARDFAMILY="meson-g12b"
BOARD_MAINTAINER="pyavitz"
INTRODUCED="2021"
BOOTCONFIG="bananapi-cm4-cm4io_defconfig"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"
# simpledrm conflicts with Panfrost; 88x2cs is the out-of-tree RTL8822CS driver
# that fights mainline rtw88_8822cs for the onboard SDIO wifi (DISASSOC_LOW_ACK,
# h2c failures, 1 Mbit/s at full signal) -- keep only mainline rtw88.
MODULES_BLACKLIST="simpledrm 88x2cs"
FULL_DESKTOP="yes"
SERIALCON="ttyAML0"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="amlogic/meson-g12b-bananapi-cm4-cm4io.dtb"
BOOTBRANCH_BOARD="tag:v2026.01"
BOOTPATCHDIR="v2026.01"

# CPUFREQ (/etc/default/cpufrequtils)
CPUMIN=1000000
CPUMAX=2400000
GOVERNOR=performance

function post_family_tweaks_bsp__bananapi_rtl_bt() {
	if [[ -d "$SRC/packages/bsp/bananapi/rtl_bt" ]]; then
		mkdir -p "${destination}"/lib/firmware/updates/rtl_bt
		display_alert "$BOARD" "Installing upstream firmware" "info"
		cp -fr $SRC/packages/bsp/bananapi/rtl_bt/* "${destination}"/lib/firmware/updates/rtl_bt/
	fi
}
