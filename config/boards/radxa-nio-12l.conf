# MediaTek MT8395 octa core 4/8/16GB RAM UFS GBE WiFi6/BT HDMI HDMI-in 4x USB3 USB-C
BOARD_NAME="Nio 12L"
BOARD_VENDOR="radxa"
BOARDFAMILY="genio"
BOARD_MAINTAINER="HeyMeco"
INTRODUCED="2024"
KERNEL_TARGET="edge"
KERNEL_TEST_TARGET="edge"
BOOT_FDT_FILE="mediatek/mt8395-radxa-nio-12l.dtb" # automatically patched by u-boot with autodetected memory size
SERIALCON="ttyS0:921600"
SRC_CMDLINE="splash plymouth.ignore-serial-consoles console=ttyS0,921600 console=tty0" # for extlinux/EXT=u-boot-menu
HAS_VIDEO_OUTPUT="yes"
declare -g BOARD_FIRMWARE_INSTALL="-full"
declare -g BOOTCONFIG="genio_1200_radxa_nio_12l_d8_defconfig" # d4/d8/d16 are irrelevant, since we've patches to autodetect, for both u-boot and kernel
if [[ "${BRANCH}" == "edge" ]]; then                               # edge uses mainline u-boot by default; GENIO_MAINLINE_UBOOT=no for vendor
	declare -g GENIO_MAINLINE_UBOOT="${GENIO_MAINLINE_UBOOT:-"yes"}"
fi
if [[ "${GENIO_MAINLINE_UBOOT:-"no"}" == "yes" ]]; then             # mainline u-boot; see genio.conf
	declare -g BOOTCONFIG="mt8395_radxa_nio_12l_defconfig"         # from patch/u-boot/v2027.01/defconfig; also autodetects memory size
fi
declare -g BOOT_SOC="mt8395"                                  # the NIO-12L is a MT8395, but everything is named mt8195 in OPTEE/TF-A/Libbase/etc.
declare -g MEDIATEK_GENIO_SOC_PLATFORM="mt8195"               # The actual PLAT= for TF-A, libbase, etc.
declare -g MEDIATEK_GENIO_OPTEE_DRAM_SIZE="0x400000000"       # 16 GiB, the largest variant: OP-TEE accepts shared memory only inside this range
# blobs live at https://github.com/armbian/mtkbin/tree/main/radxa-nio-12l

# Important: we change u-boot's env offset to half-way through the UFS LUN, so we don't conflict or inherit env from
#            vendor or Collabora version of u-boot, in case the user had ran `saveenv` previously. It would conflict
#            with Armbian's version ("env default -f -a" to clean), which boots OS from SD cards first, Eth last, etc.
function post_config_uboot_target__nio_12l_armbian_specific_environment_location() {
	if [[ "${GENIO_MAINLINE_UBOOT}" == "yes" ]]; then
		display_alert "u-boot for ${BOARD}/${BRANCH}" "mainline u-boot: env location and commands are in the defconfig" "info"
		return 0
	fi

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: board-specific configs" "info"
	run_host_command_logged scripts/config --set-val CONFIG_ENV_OFFSET "0x200000"

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: extra cmdline commands" "info"
	run_host_command_logged scripts/config --enable CONFIG_CMD_ITEST   # itest expects integers on both sides, whereas regular test assumes strings
	run_host_command_logged scripts/config --enable CONFIG_CMD_BOOTZ   # bootz allows booting zImages
	run_host_command_logged scripts/config --enable CONFIG_CMD_MEMINFO # meminfo shows memory info in u-boot
	run_host_command_logged scripts/config --enable CONFIG_CMD_SETEXPR # setexpr allows arithmetic expressions in setenv
}

# Extra mainline u-boot features (vendor u-boot has no lwIP etc.)
function post_config_uboot_target__extra_configs_for_radxa_nio_12l() {
	[[ "${GENIO_MAINLINE_UBOOT}" == "yes" ]] || return 0

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable preboot & flash LEDs in preboot" "info"
	run_host_command_logged scripts/config --enable CONFIG_DM_GPIO
	run_host_command_logged scripts/config --enable CONFIG_LED
	run_host_command_logged scripts/config --enable CONFIG_LED_GPIO
	run_host_command_logged scripts/config --enable CONFIG_USE_PREBOOT
	run_host_command_logged scripts/config --set-str CONFIG_PREBOOT "'led blue:heartbeat on; led red:panic on; sleep 0.1; led blue:heartbeat off; led red:panic off'" # double quotes required due to run_host_command_logged's quirks

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable EFI debugging commands" "info"
	run_host_command_logged scripts/config --enable CONFIG_CMD_EFIDEBUG
	run_host_command_logged scripts/config --enable CONFIG_CMD_NVEDIT_EFI
	run_host_command_logged scripts/config --enable CONFIG_CMD_REGULATOR

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable more filesystems and compression" "info"
	run_host_command_logged scripts/config --enable CONFIG_CMD_BTRFS
	run_host_command_logged scripts/config --enable CONFIG_LZO
	run_host_command_logged scripts/config --enable CONFIG_ZSTD

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable networking cmds and lwIP" "info"
	run_host_command_logged scripts/config --enable CONFIG_CMD_NFS
	run_host_command_logged scripts/config --enable CONFIG_CMD_WGET
	run_host_command_logged scripts/config --enable CONFIG_CMD_DNS
	run_host_command_logged scripts/config --enable CONFIG_PROT_TCP
	run_host_command_logged scripts/config --enable CONFIG_PROT_TCP_SACK
	run_host_command_logged scripts/config --enable CONFIG_CMD_MII
	run_host_command_logged scripts/config --enable CONFIG_NET_LWIP

	# No wget HTTPS: it needs an RNG (DM_RNG); no MT8195 RNG driver, no SMCCC TRNG in vendor TF-A, no OP-TEE loaded.

	run_host_command_logged scripts/config --disable CONFIG_USB_FUNCTION_FASTBOOT # gadget is for UMS
	return 0
}

# Include fw_setenv, configured to point to the correct spot on the UFS LUN number
declare -g PACKAGE_LIST_BOARD="libubootenv-tool" # libubootenv-tool provides fw_printenv and fw_setenv, for talking to U-Boot environment
function post_family_tweaks__config_radxa_nio_12l_fwenv() {
	display_alert "Configuring fw_printenv and fw_setenv" "for ${BOARD}" "info"
	# Vendor u-boot: offset 0x200000, see post_config_uboot_target__nio_12l_armbian_specific_environment_location
	# Mainline u-boot: offset 0x0 (CONFIG_ENV_SCSI_HW_PARTITION="1:0"; mainline can't use an offset): same as Collabora/vendor builds
	declare fw_env_offset="0x200000"
	if [[ "${GENIO_MAINLINE_UBOOT}" == "yes" ]]; then
		fw_env_offset="0x0"
	fi
	# Addresses below come from CONFIG_ENV_OFFSET and CONFIG_ENV_SIZE in defconfig
	cat <<- FW_ENV_CONFIG > "${SDCARD}"/etc/fw_env.config
		# UFS LUN 2 (scsi 1 in u-boot) u-boot env for the ${BOARD_NAME}
		# The correct way to access the device would be /dev/disk/by-path/platform-11270000.ufshci-scsi-0:0:0:1
		#   but unfortunately libubootenv-tool can't handle the colons in that path; so use /dev/sdb instead
		# ATTENTION: Offset for Armbian's vendor u-boot is 0x200000 to avoid conflict with Collabora/vendor build u-boot env area
		#            Armbian's mainline u-boot uses 0x0, which is shared with Collabora/vendor builds ("env default -a" if needed)
		# Device name    Device offset Env. size Flash sector size Number of sectors
		/dev/sdb         ${fw_env_offset}      0x2000
	FW_ENV_CONFIG
}

# Trim firmware for hardware the NIO-12L cannot have, from the image only (apt upgrade restores it).
# The board has no PCIe/M.2 slot. It uses mediatek/ (mt8195, MT7961 wifi/BT) and regulatory.db.
# Keep firmware for USB dongles.
function post_family_tweaks__radxa_nio_12l_trim_firmware() {
	declare fw="${SDCARD}/usr/lib/firmware"
	[[ -d "${fw}" ]] || return 0

	declare -a trim=(
		# PC/server GPUs, NICs, storage and sensors; PCIe wifi
		intel nvidia netronome amdgpu amdnpu amd amd-ucode mellanox mrvl i915 xe radeon qed dpaa2 liquidio cxgb4 bnx2 bnx2x vxge slicoss aeonsemi
		"myri10ge*" "ql2*_fw.bin" phanfw.bin "cbfw-*" "ctfw-*" "ct2fw-*" ctefx.bin HP dell LENOVO
		ath12k ath11k ath10k "iwlwifi-*" updates/ath11k wil6210.fw mwl8k mwlwifi
		# Qualcomm SoCs
		qcom "adsp.*" "adsp_dtb.*"
		# SDIO/UART wifi and BT of other boards
		brcm cypress rkwifi ti ti-connectivity "ap6*" "uwe56*" xr819 "ssv6*" seekwave "fw_bcm*" "nvram_ap*" "BCM43*.hcd"
		nxp amlogic wfx morsemicro
		# codecs, DSPs, GPUs, bridges and touch of other SoCs
		cirrus vpu amphion imx sdma meson video "s5p-mfc*" "v4l-coda*" cnm rockchip arm powervr Lontium novatek
		# MediaTek: other SoCs, router and PCIe-only wifi
		mediatek/mt8173 mediatek/mt8183 mediatek/mt8186 mediatek/mt8188 mediatek/mt8189 mediatek/mt8192 mediatek/mt8196
		"mediatek/mt7615*" "mediatek/mt7915*" "mediatek/mt7916*" "mediatek/mt7981*" "mediatek/mt7986*" mediatek/mt7996 mediatek/mt7927
		mediatek/WIFI_RAM_CODE_7623
	)
	declare -a paths=()
	declare p m
	for p in "${trim[@]}"; do
		for m in "${fw}"/${p}; do # unquoted: glob
			[[ -e "${m}" ]] && paths+=("${m}")
		done
	done
	[[ ${#paths[@]} -gt 0 ]] || return 0

	display_alert "Trimming firmware unused by ${BOARD}" "before: $(du -sh "${fw}" | cut -f1)" "info"
	run_host_command_logged rm -r "${paths[@]}"
	display_alert "Trimmed firmware unused by ${BOARD}" "after: $(du -sh "${fw}" | cut -f1)" "info"
}
