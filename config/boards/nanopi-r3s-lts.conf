# Rockchip RK3566 quad core 2GB RAM eMMC 2x GbE USB3 HDMI
BOARD_NAME="NanoPi R3S LTS"
BOARD_VENDOR="friendlyelec"
BOARDFAMILY="rk35xx"
BOARD_MAINTAINER="pyavitz"
INTRODUCED="2025"
BOOTCONFIG="nanopi-r3s-lts-rk3566_defconfig"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current,edge"
BOOT_FDT_FILE="rockchip/rk3566-nanopi-r3s-lts.dtb"
IMAGE_PARTITION_TABLE="gpt"
BOOT_SCENARIO="spl-blobs"
MODULES="ledtrig_netdev"
enable_extension "uboot-btrfs"

function post_family_config__use_mainline_uboot() {
	BOOTCONFIG="nanopi-r3s-lts-rk3566_defconfig"
	BOOTSOURCE="https://github.com/u-boot/u-boot"
	BOOTBRANCH="tag:v2026.04"
	BOOTPATCHDIR="v2026.04"

	UBOOT_TARGET_MAP="BL31=$RKBIN_DIR/$BL31_BLOB ROCKCHIP_TPL=$RKBIN_DIR/$DDR_BLOB;;u-boot-rockchip.bin"

	unset uboot_custom_postprocess write_uboot_platform write_uboot_platform_mtd

	function write_uboot_platform() {
		dd if=$1/u-boot-rockchip.bin of=$2 seek=64 conv=notrunc status=none
	}
}

# end0 (GMAC) is WAN, the PCIe RTL8125 is LAN.
function post_family_tweaks__nanopir3slts_udev_network_interfaces() {
	display_alert "$BOARD" "Renaming interfaces WAN LAN" "info"

	mkdir -p "${SDCARD}"/etc/udev/rules.d/
	cat <<- EOF > "${SDCARD}/etc/udev/rules.d/70-persistent-net.rules"
		SUBSYSTEM=="net", ACTION=="add", KERNELS=="fe010000.ethernet", NAME:="wan"
		SUBSYSTEM=="net", ACTION=="add", KERNELS=="0000:01:00.0", NAME:="lan"
	EOF
}

# Port LEDs show link and blink on traffic. Needs ledtrig_netdev (MODULES above).
function post_family_tweaks_bsp__nanopir3slts_enable_leds() {
	display_alert "$BOARD" "Creating board support LEDs config" "info"
	cat <<- EOF > "${destination}"/etc/armbian-leds.conf
		[/sys/class/leds/green:wan]
		trigger=netdev
		interval=50
		link=1
		tx=1
		rx=1
		device_name=wan

		[/sys/class/leds/green:lan]
		trigger=netdev
		interval=50
		link=1
		tx=1
		rx=1
		device_name=lan

		[/sys/class/leds/red:power]
		trigger=heartbeat
	EOF
}
