# Seeed Studio reComputer Industrial RK3576 (SoM + carrier)
# Carrier: USB5744 hub, dual GbE (GMAC0 via SoM RTL8211F, GMAC1 MAE0621A),
# isolated CAN1, RS485x2/RS232 (CH344), DI/DO, Mini PCIe 4G/LoRa, M.2 NVMe,
# HDMI Type-A, ES8311, no fan, no TF slot, no SPI NOR (eMMC boot only).
BOARD_NAME="reComputer Industrial RK3576"
BOARDFAMILY="seeed-rk3576"
BOOT_SOC="rk3576"
BOARD_MAINTAINER="Pillar1989"
BOARD_VENDOR="seeed-studio"
INTRODUCED="2026"
BOOTCONFIG="recomputer-rk3576-industrial_defconfig"
KERNEL_TARGET="vendor,edge"
KERNEL_TEST_TARGET="vendor"
FULL_DESKTOP="yes"
BOOT_FDT_FILE="rockchip/rk3576-recomputer-industrial.dtb"
BOOT_SCENARIO="spl-blobs"
IMAGE_PARTITION_TABLE="gpt"
OTA_ENABLE="yes"
BT_UART="/dev/ttyS4"
# Mali-G52 GPU is enabled in the DTS (&gpu okay, mali-supply wired); use the
# open-source panfrost driver (CONFIG_DRM_PANFROST=y in the shared vendor
# kernel config) with Mesa userspace, same stack as the devkit. Switch back
# to "mali" for the closed libmali blob — then also set MALI_USE_SYSTEM_GBM=yes
# to keep the blob's bundled GBM stub from overriding the system libgbm.
RECOMPUTER_GPU_STACK="panfrost"
# Mainline U-Boot (non-vendor branches): this board's defconfig and u-boot
# dtsi base name; the shared machinery lives in the family conf
# (config/sources/families/seeed-rk3576.conf). No BOOT_SUPPORT_SPI here: this
# carrier is eMMC-only, which selects the eMMC env/block-writer path there.
RECOMPUTER_MAINLINE_BOOTCONFIG="recomputer-rk3576-industrial_defconfig"
RECOMPUTER_UBOOT_DTSI_BASE="rk3576-recomputer-industrial"

# select case for BRANCH=vendor to source the Seeed Studio recomputer-rk35xx-common.inc
case "${BRANCH}" in
	vendor)
		# WiFi/BT on this board's SoM: the FCS960KAAMD module carries WQ9201S
		# silicon (verified on hardware 2026-08-21). Note this is specific to
		# this SoM — the same module part number may carry different silicon;
		# always identify by probing, not by part number.
		# Uses the wq9201s-wifi-bt-dkms package from the Seeed APT repo: DKMS
		# driver (wq_wlan, SDIO) + firmware + wq9201s-bt.service (btattach H4
		# on the BT UART). The package's postinst sets up driver blacklists
		# and enables its own BT service.
		declare -g PACKAGE_LIST_BOARD="net-tools rfkill pulseaudio-module-bluetooth fail2ban"
		# No AIC8800 silicon on this SoM: keep common.inc's AIC BT stack out —
		# no fcs960k-aic-bluez replacing bluez, no aic8800 btlpm modules-load,
		# no aic-bluetooth.service. BT userspace is standard bluez plus the
		# wq9201s-bt.service shipped by the DKMS package above.
		declare -g SEEED_AIC_BLUEZ_ENABLE="no"
		# Console is plain UART0 (CH343P on Type-C1): the industrial DTS has no
		# fiq-debugger node, unlike the devkit which uses ttyFIQ0.
		declare -g SERIALCON="ttyS0"
		source "${SRC}/config/sources/vendors/seeed-studio/recomputer-rk35xx-common.inc"
		;;

	*)
		# @TODO: there is no WQ9201S WiFi/BT support for mainline kernels; the
		# DKMS package targets the vendor 6.1 kernel only. Same for CAN1, the
		# PCF85063 RTC and the MAE0621A PHY on GMAC1 (vendor-only for now).
		# The mainline DTB name happens to match the vendor one; it comes from
		# the overlay in patch/kernel/archive/rockchip64-7.x/dt/
		declare -g BOOT_FDT_FILE="rockchip/rk3576-recomputer-industrial.dtb"
		# userspace for manipulating the u-boot env stored in eMMC
		PACKAGE_LIST_BOARD="libubootenv-tool" # libubootenv-tool provides fw_printenv and fw_setenv, for talking to U-Boot environment
		;;
esac

# Serial console: the shared vendor bootscript hardcodes console=ttyFIQ0, but
# this board disables the fiq-debugger and uses the plain 16550 ttyS0 console
# (SERIALCON=ttyS0, CH343P on UART0). The last console= on the cmdline wins,
# so append ttyS0 via extraargs to make it the preferred console. Not needed
# for mainline branches: the generic bootscript there already uses ttyS0
# (rockchip64_common defaults SERIALCON=ttyS0 for rk3576 on non-vendor).
function pre_umount_final_image__recomputer_rk3576_industrial_serial_console() {
	[[ "${BRANCH}" == "vendor" ]] || return 0 # only for BRANCH=vendor
	local env_file="${MOUNT}/boot/armbianEnv.txt"

	if [[ -f "${env_file}" ]] && ! grep -q "^extraargs=.*console=ttyS0" "${env_file}"; then
		if grep -q "^extraargs=" "${env_file}"; then
			sed -i -e 's/^extraargs=/extraargs=console=ttyS0,1500000n8 /' "${env_file}"
		else
			echo "extraargs=console=ttyS0,1500000n8" >> "${env_file}"
		fi
		display_alert "$BOARD" "Serial console set to ttyS0 (extraargs)" "info"
	fi
}

# WQ9201S WiFi/BT combo (FCS960KAAMD module): DKMS driver + firmware +
# bt-attach service from the Seeed APT repo. The package's postinst sets
# up driver blacklists and enables its own wq9201s-bt.service. DKMS
# build happens via the shared post_install_kernel_debs dkms autoinstall
# hook (headers are forced by common.inc), same as the other DKMS
# packages in the family.
function pre_install_distribution_specific__recomputer_rk3576_industrial_wq9201s() {
	[[ "${BRANCH}" == "vendor" ]] || return 0 # only for BRANCH=vendor
	display_alert "$BOARD" "Installing WQ9201S WiFi/BT (wq9201s-wifi-bt-dkms)" "info"
	seeed_recomputer_install_from_apt wq9201s-wifi-bt-dkms
}

# Maxio MAE0621A PHY (GMAC1): DKMS driver from the Seeed APT repo. The
# generic C22 driver already runs the link; this module programs the RJ45
# LED mode (LED1=link, LED2=activity) and registers the same sequence as a
# PHY fixup against MDIO bind races. Same DKMS build path as WQ9201S above.
function pre_install_distribution_specific__recomputer_rk3576_industrial_maxio_phy() {
	[[ "${BRANCH}" == "vendor" ]] || return 0 # only for BRANCH=vendor
	display_alert "$BOARD" "Installing Maxio MAE0621A PHY driver (maxio-phy-dkms)" "info"
	seeed_recomputer_install_from_apt maxio-phy-dkms
}

# wq_wlan has no udev autoload for the pre-firmware SDIO enumeration, and
# btattach needs hci_uart's N_HCI line discipline: load both explicitly.
function post_family_tweaks_bsp__recomputer_rk3576_industrial_wq9201s_modules() {
	[[ "${BRANCH}" == "vendor" ]] || return 0 # only for BRANCH=vendor
	# etc/modules-load.d is not part of the default bsp-cli skeleton (upstream
	# board confs create it themselves); the AIC8800 hook that normally does it
	# is skipped on this board.
	mkdir -p "${destination}"/etc/modules-load.d
	cat > "${destination}"/etc/modules-load.d/wq-wlan.conf <<- EOT
		hci_uart
		wq_wlan
	EOT
}
