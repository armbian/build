# TI AM67A/J722S quad Cortex-A53 SoC, 2/8GB RAM, eMMC, microSD, 2x GBE, USB, CAN, SPE

BOARD_NAME="MBa67xx"
BOARD_VENDOR="tqgroup"
BOARDFAMILY="k3-tq"
BOARD_MAINTAINER="schmiedelm"
INTRODUCED="2026"
HAS_VIDEO_OUTPUT="yes"
# KNOWN LIMITATION: no video output (DP or LVDS) and no GPU on "edge" -
# mainline 7.2 has no DSS/OLDI/DSI/gpu@fd80000 node for J722S/AM62P yet.
BOOT_SOC="j722s"
BOOTCONFIG="tqma67xx_mba67xx_a53_defconfig"
BOOTFS_TYPE="fat"
BOOTSIZE=512
TIBOOT3_BOOTCONFIG="tqma67xx_mba67xx_r5_defconfig"
TIBOOT3_FILE="tiboot3-j722s-hs-fs-tqma67xx.bin"
KERNEL_TARGET="vendor,edge"
KERNEL_TEST_TARGET="vendor,edge"
DEFAULT_CONSOLE="serial"
SERIALCON="ttyS0"
# SRC_EXTLINUX boards don't get SERIALCON auto-added to the cmdline
SRC_CMDLINE="console=ttyS0,115200"
ATF_PLAT="k3"
ATF_BOARD="lite"
OPTEE_ARGS="CFG_TEE_CORE_LOG_LEVEL=1"
OPTEE_PLATFORM="k3-am62x"
BOOT_FDT_FILE="ti/k3-am67a-tqma67xx-mba67xx.dtb"
CC33XX_SUPPORT="yes"

# Use out-of-tree DKMS Rogue driver, not the kernel's newer in-tree "powervr" driver.
TI_DEBPKGS_FALLBACK_SUITES=("noble" "jammy")
TI_PACKAGES+=(
	"ti-img-rogue-driver-am62p-dkms"
	"ti-img-rogue-umlibs-am62p"
	"ti-img-rogue-tools-am62p"
	"ti-img-rogue-firmware-am62p"
)
if [[ "${RELEASE}" == "bookworm" || "${RELEASE}" == "jammy" ]]; then
	TI_PACKAGES+=("mesa-vulkan-drivers" "libgl1-mesa-dri")
fi

# Disable the in-tree "powervr" DRM driver so it doesn't fight the DKMS one
function custom_kernel_config__mba67xx_disable_intree_powervr() {
	opts_n+=(DRM_POWERVR)
}

