# Nexell S5P6818 octa core 1GB RAM GbE SD (NanoPi Fire3, NanoPi M3, NanoPC-T3)
# The 1 GiB FriendlyARM S5P6818 boards. Shares the S5P6818 kernel + device tree
# with the 2 GiB NanoPC-T3+ (see nanopct3plus); the only difference is the 1 GiB
# boot blob (DRAM init in BL1). u-boot fills the real RAM size into the DT.
# (These boards have no eMMC and no on-board WiFi/BT; those DT nodes are no-ops.)
BOARD_NAME="NanoPi Fire3 / M3 / T3"
BOARDFAMILY="s5p6818"
BOARD_VENDOR="friendlyelec"
BOARD_MAINTAINER="igorpecovnik"
BOOTCONFIG="nanopim3_defconfig"
MODULES_CURRENT="g_serial"
SERIALCON="ttySAC0,ttyGS0"
KERNEL_TARGET="current"
FULL_DESKTOP="yes"
