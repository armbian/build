# Nexell S5P6818 octa core 1GB RAM GbE SD (NanoPi Fire3)
# NanoPi Fire3 (1 GiB). The stripped-down S5P6818 board: micro-SD only, no
# on-board eMMC and no WiFi/BT or audio codec, so it uses the minimal device
# tree (s5p6818-nanopi-fire3.dtb) - just the peripherals it actually has - to
# avoid the phantom-probe errors the full tree would spew. The 1 GiB boot blob
# does DRAM init; u-boot fills the real RAM size into the DT.
BOARD_NAME="NanoPi Fire3"
BOARDFAMILY="s5p6818"
BOARD_VENDOR="friendlyelec"
BOARD_MAINTAINER="igorpecovnik"
BOOTCONFIG="nanopim3_defconfig"
BOOT_FDT_FILE="nexell/s5p6818-nanopi-fire3.dtb"
MODULES_CURRENT="g_serial"
SERIALCON="ttySAC0,ttyGS0"
KERNEL_TARGET="edge"
KERNEL_TEST_TARGET="edge"
INTRODUCED="2017"
