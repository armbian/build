# Qualcomm SC8280XP Snapdragon 8cx Gen 3 octa core 8-32GB RAM SoC NVMe WiFi6E/BT 5G USB-C
declare -g BOARD_NAME="ThinkPad X13s"
declare -g BOARD_VENDOR="lenovo"
declare -g BOARD_MAINTAINER="rpardini"
declare -g INTRODUCED="2023"
declare -g BOARDFAMILY="sc8280xp"
declare -g KERNEL_TARGET="edge"
declare -g KERNEL_TEST_TARGET="edge"
declare -g BOOT_FDT_FILE="qcom/sc8280xp-lenovo-thinkpad-x13s.dtb"

# https://wiki.debian.org/InstallingDebianOn/Thinkpad/X13s
function post_family_config__debian_now_has_userspace_for_the_x13s() {
	# Override it here, since the family has its own opinion.
	declare -g GRUB_CMDLINE_LINUX_DEFAULT="clk_ignore_unused systemd.tpm2_wait=0 pd_ignore_unused arm64.nopauth efi=noruntime"
	unset SERIALCON # thinkpad-x13s has no serial console, so don't try to use it

	# touch/fingerprint support
	sc8280xp_is_userspace_supported || return 0
	add_packages_to_image "fprintd"        # for fingerprint reader; see https://packages.ubuntu.com/fprintd and https://packages.debian.org/fprintd
	add_packages_to_image "libpam-fprintd" # for fingerprint reader PAM support; see https://packages.ubuntu.com/libpam-fprintd and https://packages.debian.org/libpam-fprintd
}

# Camera (ov5675 via camss) needs libcamera's simple pipeline + SoftISP; trixie's 0.4.0 is much
# weaker than trixie-backports' 0.7.x (GPU/multithreaded debayer, better AGC/AWB).
# Pin all libcamera binaries (libcamera0.x, -ipa, -tools, -v4l2, gstreamer1.0-libcamera) so
# whatever gets installed later comes from backports; nothing is installed here.
# PipeWire's camera support (pipewire-libcamera/libspa-0.2-libcamera) is built from src:pipewire
# and links trixie's libcamera0.4, so pin pipewire (and its session manager wireplumber) too.
function post_family_tweaks__thinkpad_x13s_libcamera_backports_pin() {
	if [[ "${RELEASE}" != "trixie" ]]; then
		display_alert "Skipping libcamera backports pin" "${RELEASE}" "info"
		return 0
	fi

	display_alert "Pinning libcamera, pipewire and wireplumber to trixie-backports" "${BOARD}" "info"

	install -d -m755 "${SDCARD}/etc/apt/preferences.d"
	cat > "${SDCARD}/etc/apt/preferences.d/armbian-libcamera-from-backports" <<-'EOF_PIN'
		Package: src:libcamera
		Pin: release n=trixie-backports
		Pin-Priority: 990

		Package: src:pipewire src:wireplumber
		Pin: release n=trixie-backports
		Pin-Priority: 990
	EOF_PIN
}

function post_family_tweaks_bsp__thinkpad_x13s_bsp_bluetooth_addr() {
	### The bluetooth does not have a public MAC address set in DT, and BT won't start without one.
	### Use a systemd override to hook up setting a public-addr before starting bluetoothd.
	### Wait for the controller to register with mgmt (after QCA fw download); without a public address it is
	### "unconfigured" and absent from "btmgmt info", but "btmgmt --index 0 config" lists it (max ~25s, below
	### the 90s start timeout). btmgmt is a shell that quits on stdin EOF before replying, so feed it "yes".
	### The address is derived on the device from the Qualcomm SoC serial (fuses, /sys/devices/soc0/serial_number),
	### so it is unique per unit and survives reinstalls; falls back to /etc/machine-id if that is missing.
	display_alert "Adding systemd override for bluetooth public address init" "${BOARD} :: bt mac from soc serial" "info"

	add_file_from_stdin_to_bsp_destination "/etc/systemd/system/bluetooth.service.d/override.conf" <<- 'EOD'
		[Service]
		ExecStartPre=/bin/bash -c 'for i in $$(seq 20); do yes 2>/dev/null | timeout 1 btmgmt --index 0 config 2>/dev/null | grep -q "supported options:.*public-address" && break; sleep 0.25; done; id=$$(cat /sys/devices/soc0/serial_number 2>/dev/null); [[ -n "$$id" ]] || id=$$(cat /etc/machine-id); h=$$(echo -n "bt:$$id" | sha256sum | cut -c1-10); yes 2>/dev/null | btmgmt public-addr "02:$${h:0:2}:$${h:2:2}:$${h:4:2}:$${h:6:2}:$${h:8:2}"'
	EOD
}

##
## Include board-specific firmware in the initrd (blobs are shipped via armbian-firmware-full)
## - DSPs: qcom_q6v5_pas (in initrd) boots ADSP/CDSP/SLPI before switch-root and requests their
##   firmware only once; the ADSP hosts pmic_glink (USB-C orientation/SuperSpeed, charging).
## - GPU zap shader: msm is builtin and loads it before switch-root.
## Video firmware, audio topology and *.jsn are only used later, from the rootfs.
##
function post_family_tweaks_bsp__thinkpad_x13s_bsp_firmware_in_initrd() {
	display_alert "Adding to bsp-cli" "${BOARD}: board firmware in initrd" "info"
	declare file_added_to_bsp_destination
	add_file_from_stdin_to_bsp_destination "/etc/initramfs-tools/hooks/x13s-firmware" <<- 'FIRMWARE_HOOK'
		#!/bin/bash
		[[ "$1" == "prereqs" ]] && exit 0
		. /usr/share/initramfs-tools/hook-functions
		for f in qcadsp8280.mbn qccdsp8280.mbn qcslpi8280.mbn qcdxkmsuc8280.mbn ; do
			add_firmware "qcom/sc8280xp/LENOVO/21BX/${f}"
		done
	FIRMWARE_HOOK
	run_host_command_logged chmod -v +x "${file_added_to_bsp_destination}"
}

## Modules, required to boot, add them to initrd; might need to be done in '.d/x13s-modules' instead
function post_family_tweaks_bsp__thinkpad_x13s_bsp_modules_in_initrd() {
	display_alert "Adding to bsp-cli" "${BOARD}: modules in initrd" "info"
	add_file_from_stdin_to_bsp_destination "/etc/initramfs-tools/modules" <<- 'EXTRA_MODULES'
		i2c_hid_of
		i2c_qcom_geni
		leds_qcom_lpg
		# boots ADSP/CDSP/SLPI; firmware via the x13s-firmware hook
		qcom_q6v5_pas
		uas
	EXTRA_MODULES

}
