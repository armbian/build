# Marvell Armada 385 dual core 1GB/2GB RAM SoC eMMC GBE switch SFP 2xUSB3 3xmPCIe mSATA WiFi
BOARD_NAME="Turris Omnia"
BOARD_VENDOR="cznic"
BOARDFAMILY="mvebu"
BOARD_MAINTAINER="BKPepe"
INTRODUCED="2016"
BOOTCONFIG="turris_omnia_defconfig"
BOOT_FDT_FILE="armada-385-turris-omnia.dtb"
SERIALCON="ttyS0"
HAS_VIDEO_OUTPUT="no"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"
BOOTLOADER_BOOTS_FROM="mmc" # U-Boot tries the eMMC before NVMe, SATA and USB
# ENABLE_EXTENSIONS=image-output-turris-medkit also builds a medkit for the Turris rescue system

# U-Boot shares the SPI NOR flash with the Turris rescue system, so only a manual
# call writes it: write_uboot_platform "$DIR" /dev/mtdblock0
function post_family_config__turris_omnia_uboot() {
	# Mainline U-Boot instead of the SolidRun U-Boot of the ClearFog
	declare -g BOOTSOURCE="${MAINLINE_UBOOT_SOURCE}" BOOTDIR="${MAINLINE_UBOOT_DIR}" BOOTBRANCH='tag:v2026.10'
	# An empty board_turris-omnia/1001-*.patch disables that debug patch
	declare -g BOOTPATCHDIR="${BOOTBRANCH#tag:}"
	declare -g BOOTSCRIPT='boot-turris-omnia.cmd:boot.cmd' BOOTENV_FILE='turris-omnia.txt'
	declare -g UBOOT_TARGET_MAP=";;u-boot-with-spl.kwb:u-boot.flash"
	unset OVERLAY_PREFIX # The ClearFog overlays do not fit the Omnia

	# Replace the writers of mvebu.conf. armbian-install offers the mtd writer first.
	unset write_uboot_platform write_uboot_platform_mtd

	function write_uboot_platform() {
		local image="$1/u-boot.flash" device="$2" mtd size max

		if [[ -z "$1" || -z "${device}" ]]; then
			echo "Usage: write_uboot_platform <directory of u-boot.flash> /dev/mtdblock0" >&2
			return 1
		fi
		if [[ "${device}" == /dev/mtd[0-9]* ]]; then
			echo "${device} is the character device, use /dev/mtdblock${device//[^0-9]/}" >&2
			return 1
		fi
		if [[ "${device}" != /dev/mtdblock* ]]; then
			echo "The Turris Omnia loads U-Boot from the SPI NOR flash, nothing is written to ${device}" >&2
			# MOUNT is / when armbian-install only updates the bootloader
			if [[ "${MOUNT:-}" == / ]]; then
				echo "To write U-Boot to the SPI NOR flash, run as root: . /usr/lib/u-boot/platform_install.sh && write_uboot_platform \"$1\" /dev/mtdblock0" >&2
				return 1
			fi
			return 0
		fi

		mtd="/sys/class/mtd/mtd${device#/dev/mtdblock}"
		if [[ "$(cat "${mtd}/name" 2> /dev/null)" != "U-Boot" || "$(cat "${mtd}/offset" 2> /dev/null)" != 0 ]]; then
			echo "${device} is not the U-Boot partition at the start of the SPI NOR flash, U-Boot is not written" >&2
			return 1
		fi
		# U-Boot keeps its environment at 0xF0000 since v2019.10
		size=$(stat -c %s "${image}") || return 1
		max=$(< "${mtd}/size")
		if ((size == 0 || size > max || size > 0xF0000)); then
			echo "${image} does not fit below the U-Boot environment, U-Boot is not written" >&2
			return 1
		fi
		# Compare with the character device, which reads the flash and not a cache
		if ! dd if="${image}" of="${device}" conv=fsync status=none || ! cmp -s -n "${size}" "${image}" "/dev/${mtd##*/}"; then
			echo "Writing U-Boot to ${device} failed, write it again or recover the board with kwboot" >&2
			return 1
		fi
		echo "U-Boot was written to ${device}" >&2
	}
}

# armbian-firmware (about 500 MB) is too big for the 8 GB eMMC. Install the Wi-Fi
# firmware of the distribution and keep only the Omnia cards.
function extension_prepare_config__turris_omnia_wifi_firmware() {
	declare -g -a TURRIS_OMNIA_WIFI_FIRMWARE=()
	case "${RELEASE}" in
		bookworm | trixie | forky | sid) TURRIS_OMNIA_WIFI_FIRMWARE=(firmware-atheros firmware-mediatek) ;; # bookworm: from backports
		noble | resolute) TURRIS_OMNIA_WIFI_FIRMWARE=(linux-firmware-qualcomm-wireless linux-firmware-mediatek) ;;
		*) return 0 ;;
	esac
	declare -g INSTALL_ARMBIAN_FIRMWARE="no"
	add_packages_to_image "${TURRIS_OMNIA_WIFI_FIRMWARE[@]}"
}

# The dpkg filter must be in place before the image packages install
function pre_install_distribution_specific__turris_omnia_wifi_firmware() {
	[[ ${#TURRIS_OMNIA_WIFI_FIRMWARE[@]} -gt 0 ]] || return 0
	display_alert "$BOARD" "Filtering the Wi-Fi firmware ${TURRIS_OMNIA_WIFI_FIRMWARE[*]}" "info"
	declare filter="${SDCARD}/etc/dpkg/dpkg.cfg.d/turris-omnia-wifi-firmware" dir
	mkdir -p "${filter%/*}"
	cat <<- EOF > "${filter}"
		# Keep only the firmware of the Wi-Fi cards of the Turris Omnia.
		# dpkg -V and armbianmonitor -v list the other files of these packages as missing:
		# ${TURRIS_OMNIA_WIFI_FIRMWARE[*]}
		# To get them, delete this file and run:
		# apt install --reinstall ${TURRIS_OMNIA_WIFI_FIRMWARE[*]}
	EOF
	# Older packages use /lib/firmware. The mt76 and QCA9887 entries are link targets.
	for dir in /lib/firmware /usr/lib/firmware; do
		cat <<- EOF >> "${filter}"
			path-exclude=${dir}/ar3k/*
			path-exclude=${dir}/ath6k/*
			path-exclude=${dir}/ath10k/*
			path-include=${dir}/ath10k/QCA988X*
			path-include=${dir}/ath10k/QCA9887*/notice_ath10k_firmware-5.txt*
			path-exclude=${dir}/ath11k/*
			path-exclude=${dir}/ath12k/*
			path-exclude=${dir}/mediatek/*
			path-include=${dir}/mediatek/mt7915*
			path-include=${dir}/mediatek/mt7601u.bin*
			path-include=${dir}/mediatek/mt7650.bin*
			path-include=${dir}/mediatek/mt7662.bin*
			path-include=${dir}/mediatek/mt7662_rom_patch.bin*
			path-exclude=${dir}/qca/*
			path-exclude=${dir}/qcom/*/wlanmdsp.mbn*
			path-exclude=${dir}/qcom/*/wpss.mbn*
			path-exclude=${dir}/vpu_*
		EOF
	done
}

# Fail the build if a package change makes the filter drop needed firmware
function post_install_kernel_debs__turris_omnia_wifi_firmware() {
	[[ ${#TURRIS_OMNIA_WIFI_FIRMWARE[@]} -gt 0 ]] || return 0
	declare firmware="${SDCARD}/usr/lib/firmware" file link target
	for file in ath10k/QCA988X/hw2.0/board.bin ath10k/QCA988X/hw2.0/firmware-5.bin mediatek/mt7915_rom_patch.bin mediatek/mt7915_wa.bin mediatek/mt7915_wm.bin; do
		compgen -G "${firmware}/${file}*" > /dev/null || exit_with_error "The dpkg filter dropped Wi-Fi firmware" "${file}"
	done
	# Skip absolute links, they point into /etc/alternatives of the image
	while IFS= read -r -d '' link; do
		target="$(readlink "${link}")"
		[[ "${target}" == /* || -e "${link%/*}/${target}" ]] || exit_with_error "The dpkg filter left a link without its target" "${link#"${SDCARD}"}"
	done < <(find "${firmware}" -type l -print0)
}

# The kernel rejects the regulatory.db that Debian signs. Select the upstream copy.
function post_install_kernel_debs__turris_omnia_regdb() {
	declare alternatives="${SDCARD}/var/lib/dpkg/alternatives/regulatory.db" regdb
	[[ -f "${alternatives}" ]] || return 0 # Ubuntu ships only the upstream copy
	if ! regdb="$(grep -m 1 -x '/.*/regulatory\.db-upstream' "${alternatives}")"; then
		display_alert "$BOARD" "wireless-regdb has no upstream regulatory.db, Wi-Fi is limited to the world domain" "wrn"
		return 0
	fi
	display_alert "$BOARD" "Selecting the upstream regulatory.db ${regdb}" "info"
	chroot_sdcard update-alternatives --set regulatory.db "${regdb}"
}

# Old MCU firmware has no TRNG, so the board has no hwrng. Ship the CZ.NIC
# firmware and omnia-mcutool to upgrade it, like OpenWrt does.
function post_family_tweaks__turris_omnia_mcu_firmware() {
	declare version="4.1" sha256="9c6a3d88ae2ca093dd35aace040f0b1eb1cb5c1141575b45623bdd64d733c59f"
	declare tarball="${SRC}/cache/sources/omnia_hw_ctrl-binaries-v${version}.tar.bz2"

	display_alert "$BOARD" "Adding the MCU firmware ${version}" "info"
	if ! echo "${sha256}  ${tarball}" | sha256sum --check --status 2> /dev/null; then
		run_host_command_logged curl -fsSL -o "${tarball}" "https://gitlab.nic.cz/turris/hw/omnia_hw_ctrl/-/releases/v${version}/downloads/${tarball##*/}"
		echo "${sha256}  ${tarball}" | sha256sum --check --status || exit_with_error "Checksum mismatch" "${tarball##*/}"
	fi
	run_host_command_logged mkdir -p "${SDCARD}"/usr/share/omnia-mcu-firmware
	run_host_command_logged tar -xjf "${tarball}" -C "${SDCARD}"/usr/share/omnia-mcu-firmware --strip-components=1
}

function post_family_tweaks__turris_omnia_mcutool() {
	declare version="0.3-rc4" commit="195391be28d243e047ac0b1464c79c8cf0ee3125" package
	declare -a build_packages=()

	display_alert "$BOARD" "Building omnia-mcutool ${version}" "info"
	fetch_from_repo "https://gitlab.nic.cz/turris/omnia-mcutool.git" "omnia-mcutool" "commit:${commit}"
	run_host_command_logged cp -a "${SRC}"/cache/sources/omnia-mcutool "${SDCARD}"/tmp/
	# Install only what the image lacks. CLI images have gcc, make and libc6-dev
	# through build-essential, and the cleanup must keep them.
	# shellcheck disable=SC2016 # dpkg-query expands the format
	for package in gcc make libc6-dev libssl-dev; do
		[[ "$(dpkg-query --admindir="${SDCARD}"/var/lib/dpkg -W -f='${db:Status-Status}' "${package}" 2> /dev/null)" == installed ]] || build_packages+=("${package}")
	done
	[[ ${#build_packages[@]} -eq 0 ]] || chroot_sdcard_apt_get_install "${build_packages[@]}"
	chroot_sdcard make -C /tmp/omnia-mcutool MCUTOOL_VERSION="${version}"
	chroot_sdcard install -m 755 /tmp/omnia-mcutool/omnia-mcutool /usr/sbin/
	run_host_command_logged rm -rf "${SDCARD}"/tmp/omnia-mcutool
	# Without SuggestsImportant=false, APT keeps the compiler that other packages suggest
	[[ ${#build_packages[@]} -eq 0 ]] || chroot_sdcard_apt_get_remove --purge --auto-remove -o APT::AutoRemove::SuggestsImportant=false "${build_packages[@]}"
	# Fail the build if the cleanup took a library that omnia-mcutool needs
	chroot_sdcard /usr/sbin/omnia-mcutool --version
}

# Point to the upgrade at login while the MCU firmware has no TRNG
function post_family_tweaks_bsp__turris_omnia_mcu_motd() {
	display_alert "$BOARD" "Adding the MCU firmware notice to the login message" "info"
	mkdir -p "${destination}"/etc/update-motd.d
	cat <<- 'EOF' > "${destination}"/etc/update-motd.d/97-turris-omnia-mcu
		#!/bin/bash
		# Bit 13 of the MCU firmware features is the TRNG
		features_path=/sys/bus/i2c/devices/1-002a/fw_features
		[[ -r "${features_path}" ]] || exit 0
		features="$(< "${features_path}")"
		[[ "${features}" =~ ^0x[0-9a-fA-F]+$ ]] || exit 0
		((features & 0x2000)) && exit 0
		printf "\e[0;91m Warning: the MCU firmware of this Turris Omnia is outdated \x1B[0m \n"
		if [[ -x /usr/sbin/omnia-mcutool ]]; then
			printf "\e[0;91m Upgrade it as root with omnia-mcutool --upgrade, then reboot \x1B[0m \n"
		else
			printf "\e[0;91m Upgrade it with omnia-mcutool: https://gitlab.nic.cz/turris/omnia-mcutool \x1B[0m \n"
		fi
	EOF
	chmod 755 "${destination}"/etc/update-motd.d/97-turris-omnia-mcu
}

# The CPU ports of the switch carry tagged traffic, so keep them out of DHCP
function post_family_tweaks_bsp__turris_omnia_switch_cpu_ports() {
	display_alert "$BOARD" "Leaving the CPU ports of the switch unmanaged" "info"
	mkdir -p "${destination}"/usr/lib/systemd/network "${destination}"/usr/lib/NetworkManager/conf.d
	cat <<- EOF > "${destination}"/usr/lib/systemd/network/05-turris-omnia-cpu-ports.network
		[Match]
		Name=end0 end1 eth0 eth1

		[Link]
		Unmanaged=yes
	EOF
	cat <<- EOF > "${destination}"/usr/lib/NetworkManager/conf.d/99-turris-omnia-cpu-ports.conf
		[keyfile]
		unmanaged-devices=interface-name:end0;interface-name:end1;interface-name:eth0;interface-name:eth1
	EOF
}

# U-Boot starts the SoC watchdog (60 s), and the MCU drives the PCIe resets on
# newer boards. Load these drivers in the initramfs. The MCU driver has no alias
# before Linux 7.4.
function post_family_tweaks_bsp__turris_omnia_initramfs_modules() {
	display_alert "$BOARD" "Adding the watchdog, I2C mux and MCU drivers to the initramfs" "info"
	mkdir -p "${destination}"/usr/share/initramfs-tools/modules.d
	cat <<- EOF > "${destination}"/usr/share/initramfs-tools/modules.d/turris-omnia
		orion_wdt
		i2c-mux-pca954x
		turris-omnia-mcu
	EOF
}

# The SoC watchdog allows 171 s, so the systemd default of 10 min turns it off at reboot
function post_family_tweaks_bsp__turris_omnia_reboot_watchdog() {
	display_alert "$BOARD" "Keeping the watchdog on while systemd-shutdown runs" "info"
	mkdir -p "${destination}"/usr/lib/systemd/system.conf.d
	cat <<- EOF > "${destination}"/usr/lib/systemd/system.conf.d/10-turris-omnia-watchdog.conf
		[Manager]
		RebootWatchdogSec=2min
	EOF
}
