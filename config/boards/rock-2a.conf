# Rockchip RK3528 quad core 1-4GB SoC 1xGBe 0-32GB eMMC
BOARD_NAME="ROCK 2A"
BOARD_VENDOR="radxa"
BOARDFAMILY="rk35xx"
BOOTCONFIG="rock-2-rk3528_defconfig"
BOARD_MAINTAINER="CodeChenL"
INTRODUCED="2024"
KERNEL_TARGET="vendor,current,edge"
KERNEL_TEST_TARGET="vendor,current,edge"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3528-rock-2a.dtb"
BOOT_SCENARIO="spl-blobs"
IMAGE_PARTITION_TABLE="gpt"
enable_extension "radxa-aic8800"
AIC8800_TYPE="usb"
# Newest Rockchip blobs in armbian/rkbin; mainline TF-A has no rk3528 support yet.
DDR_BLOB="rk35/rk3528_ddr_1056MHz_v1.14.bin"
BL31_BLOB="rk35/rk3528_bl31_v1.21.elf"

# Mainline kernels (current, edge) get mainline u-boot and a ttyS0 console; vendor keeps Radxa's u-boot.
function post_family_config__rock2a_mainline() {
	[[ "${BRANCH}" == vendor* ]] && return 0 # mainline branches only

	display_alert "$BOARD" "Using mainline u-boot for $BOARD / $BRANCH" "info"

	declare -g BOOTDELAY=1
	declare -g BOOTSOURCE="https://github.com/u-boot/u-boot.git"
	declare -g BOOTBRANCH="tag:v2026.10"
	declare -g BOOTPATCHDIR="v2026.10"
	declare -g BOOTDIR="u-boot-${BOARD}"

	# rk3528 has no mainline TF-A platform support yet, so we use the vendor's TF-A blobs for now.
	declare -g UBOOT_TARGET_MAP="BL31=${RKBIN_DIR}/${BL31_BLOB} ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB};;u-boot-rockchip.bin"
	unset uboot_custom_postprocess write_uboot_platform write_uboot_platform_mtd

	function write_uboot_platform() {
		dd "if=$1/u-boot-rockchip.bin" "of=$2" bs=32k seek=1 conv=notrunc status=none
	}

	# The rk3528 debug UART is uart0; the mainline kernel exposes it as ttyS0, not the family default ttyS2.
	declare -g BOOTSCRIPT="boot-rockchip64-ttyS0.cmd:boot.cmd"
	declare -g SERIALCON="ttyS0"
}

# Vendor kernel: the rk3528 debug UART is the FIQ debugger console (ttyFIQ0), not the family default ttyS2.
function post_family_config__rock2a_vendor_console() {
	[[ "${BRANCH}" == vendor* ]] || return 0
	declare -g SERIALCON="ttyFIQ0"
}

function post_family_tweaks__rock2a_vendor_console() {
	[[ "${BRANCH}" == vendor* ]] || return 0
	display_alert "$BOARD" "Serial console on ttyFIQ0 for ${BRANCH}" "info"
	sed -i 's/console=ttyS2,1500000/console=ttyFIQ0,1500000/g' "${SDCARD}"/boot/boot.cmd
	mkimage -C none -A arm -T script -d "${SDCARD}"/boot/boot.cmd "${SDCARD}"/boot/boot.scr
}
