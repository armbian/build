# Rockchip RK3588S octa core 8GB RAM SoC eMMC USB3 USB2 1x GbE 1x M2-E 1x M2-M
source "${SRC}/config/boards/friendlyelec-rk3588.conf"

BOARD_NAME="NanoPi M6"
BOARD_VENDOR="friendlyelec"
BOARD_MAINTAINER="efectn"
INTRODUCED="2023"
# These are repeated because the JSON matrix generator parses this file directly.
BOARDFAMILY="rockchip-rk3588"
KERNEL_TARGET="current,edge,vendor"
KERNEL_TEST_TARGET="vendor,current"

# More accurate than the family-wide R6S fallback in friendlyelec-rk3588.conf,
# for whenever a non-SARADC-aware u-boot lands on actual M6 hardware.
BOOT_FDT_FILE_FALLBACK="rockchip/rk3588s-nanopi-m6.dtb"

# "rockchip-common: boot SD card first, then NVMe, then mmc"
# include/configs/rockchip-common.h
# -#define BOOT_TARGETS "mmc1 mmc0 nvme scsi usb pxe dhcp spi"
# +#define BOOT_TARGETS "mmc0 nvme mmc1 scsi usb pxe dhcp spi"
# On nanopi-m6, mmc0 is the eMMC, mmc1 is the SD card slot. The shared
# nanopi6-series EFI-bootmeth patch (friendlyelec-rk3588.conf) doesn't touch
# boot order, so this stays board-specific rather than assumed for the whole
# family (R6S/R6C weren't verified to share the same mmc0/mmc1 mapping).
function pre_config_uboot_target__nanopi_m6_patch_rockchip_common_boot_order() {
	declare -a rockchip_uboot_targets=("mmc1" "nvme" "mmc0" "scsi" "usb" "pxe" "dhcp" "spi")
	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: adjust boot order to '${rockchip_uboot_targets[*]}'" "info"
	sed -i -e "s/#define BOOT_TARGETS.*/#define BOOT_TARGETS \"${rockchip_uboot_targets[*]}\"/" include/configs/rockchip-common.h
}
