# Rockchip RK3562 DDR3 eMMC GBE SWT6621S WLAN/BT
BOARD_NAME="K3B"
BOARD_VENDOR="kickpi"
BOARDFAMILY="rk35xx"
BOARD_MAINTAINER="retro98boy"
INTRODUCED="2026"
KERNEL_TARGET="edge"
KERNEL_TEST_TARGET="edge"
MODULES_EDGE="panel-rocknix-generic-dsi"
FULL_DESKTOP="yes"
BOOT_LOGO="desktop"
BOOT_FDT_FILE="rockchip/rk3562-kickpi-k3b.dtb"
OVERLAY_PREFIX_BOARD="rk3562-kickpi-k3b"
BOOT_SCENARIO="binman"
BOOT_SOC="rk3562"
IMAGE_PARTITION_TABLE="gpt"
PACKAGE_LIST_BOARD="alsa-ucm-conf"

function post_family_config__kickpi_k3b_kernel_headers() {
	declare -g INSTALL_HEADERS="yes"
}

function post_install_kernel_debs__kickpi_k3b_swt6621s() {
	local version="2026.10.31.092707+gitd78c90e61ffc"
	local deb_file="swt6621s-dkms_${version}_all.deb"
	local url="${GITHUB_SOURCE}/retro98boy/swt6621s/releases/download/${version}/${deb_file}"

	run_host_command_logged curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 \
		"${url@Q}" --output "${SDCARD@Q}/tmp/${deb_file}" || return 1
	declare -ag if_error_find_files_sdcard=("/var/lib/dkms/swt6621s/*/build/make.log")
	use_clean_environment="yes" chroot_sdcard_apt_get_install "/tmp/${deb_file}" || return 1
	run_host_command_logged rm -- "${SDCARD@Q}/tmp/${deb_file}"
}

function post_family_tweaks_bsp__kickpi_k3b_swt6621s() {
	install -D -m 0644 "${SRC}/packages/bsp/kickpi-k3b/etc/modules-load.d/swt6621s-sdio-uart.conf" \
		"${destination}/etc/modules-load.d/swt6621s-sdio-uart.conf"
	install -D -m 0644 "${SRC}/packages/bsp/kickpi-k3b/etc/modprobe.d/swt6621s-sdio-uart.conf" \
		"${destination}/etc/modprobe.d/swt6621s-sdio-uart.conf"
}

function post_family_config__kickpi-k3b() {
	declare -g BOOTSCRIPT='boot-rockchip64-ttyS0.cmd:boot.cmd'
	declare -g DEFAULT_OVERLAYS="demo-dsi-panel"

	display_alert "$BOARD" "mainline u-boot overrides" "info"

	declare -g BOOTCONFIG="kickpi-k3b-rk3562_defconfig"
	declare -g BOOTDELAY=1
	declare -g BOOTSOURCE="https://github.com/u-boot/u-boot.git"
	declare -g BOOTBRANCH="tag:v2026.07"
	declare -g BOOTPATCHDIR="v2026.07"
	declare -g BOOTDIR="u-boot-${BOARD}"
}
