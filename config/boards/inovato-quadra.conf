# Allwinner H6 quad core 2GB SoC WiFi eMMC
BOARD_NAME="Inovato Quadra"
BOARD_VENDOR="inovato"
BOARDFAMILY="sun50iw6"
BOARD_MAINTAINER="igorpecovnik"
INTRODUCED="2022"
BOOTCONFIG="tanix_tx6_defconfig"
CRUSTCONFIG="tanix_tx6_defconfig"
BOOT_FDT_FILE="allwinner/sun50i-h6-inovato-quadra.dtb"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current"
BOOT_LOGO="desktop"
FULL_DESKTOP="yes"
SRC_EXTLINUX="yes"
SRC_CMDLINE="console=ttyS0,115200 console=tty0 mem=2048M video=HDMI-A-1:e drm.edid_firmware=edid/1920x1080.bin loglevel=4"
OFFSET=16

# This unit's monitor sits behind an HDMI switch that doesn't reliably pass
# through DDC/HPD: live EDID reads come back empty and HPD toggles in bursts.
# A static EDID sidesteps the dependency on a live DDC read. drm.edid_firmware
# is requested synchronously very early (before the real rootfs is mounted),
# so the blob has to be bundled into the initramfs itself, not just installed
# under /lib/firmware. loglevel=4 keeps the still-flapping HPD interrupt's
# dev_dbg() "EVENT=plugin" spam off the physical console without touching the
# dmesg buffer.
function post_family_tweaks_bsp__inovato_quadra_edid_firmware_in_initrd() {
	display_alert "Adding to bsp-cli" "${BOARD}: EDID firmware in initrd" "info"
	declare file_added_to_bsp_destination # filled in by add_file_from_stdin_to_bsp_destination
	add_file_from_stdin_to_bsp_destination "/etc/initramfs-tools/hooks/inovato-quadra-edid" <<- 'EDID_HOOK'
		#!/bin/sh
		[ "$1" = "prereqs" ] && exit 0
		. /usr/share/initramfs-tools/hook-functions
		add_firmware "edid/1920x1080.bin"
	EDID_HOOK
	run_host_command_logged chmod -v +x "${file_added_to_bsp_destination}"
}
