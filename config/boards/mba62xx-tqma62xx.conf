# TI AM625 quad Cortex-A53 SoC, 1/2GB RAM, 2x GBE, USB, CAN, optional LVDS/CSI

BOARD_NAME="MBa62xx"
BOARD_VENDOR="tqgroup"
BOARDFAMILY="k3-tq"
BOARD_MAINTAINER="schmiedelm"
INTRODUCED="2026"
HAS_VIDEO_OUTPUT="yes"
# Default armbian-firmware doesn't ship mrvl/sdsd8997_combo_v4.bin (SD8997 WiFi/BT); -full does.
BOARD_FIRMWARE_INSTALL="-full"
BOOT_SOC="am62"
BOOTCONFIG="tqma62xx_mba62xx_a53_defconfig"
BOOTFS_TYPE="fat"
BOOTSIZE=512
TIBOOT3_BOOTCONFIG="tqma62xx_mba62xx_r5_defconfig"
TIBOOT3_FILE="tiboot3-am62x-gp-tqma62xx.bin"
KERNEL_TARGET="vendor,edge"
KERNEL_TEST_TARGET="vendor,edge"
DEFAULT_CONSOLE="serial"
SERIALCON="ttyS0"
# SRC_EXTLINUX boards don't get SERIALCON auto-added to the cmdline
SRC_CMDLINE="console=ttyS0,115200 earlycon=ns16550a,mmio32,0x02800000"
ATF_PLAT="k3"
ATF_BOARD="lite"
OPTEE_ARGS="CFG_TEE_CORE_LOG_LEVEL=1"
OPTEE_PLATFORM="k3-am62x"
BOOT_FDT_FILE="ti/k3-am625-tqma62xx-mba62xx.dtb"
OVERLAY_PREFIX="k3-am62-tqma62xx-mba62xx"
DEFAULT_OVERLAYS="lvds-tm070jdhg30"

# AM625's GPU (img,img-axe-1-16m) is real but tiny, with immature Mesa/EGL support - same
# pixman (CPU) renderer approach as mba93xxca (imx93, no GPU at all) for a reliable desktop.
[[ "${BUILD_DESKTOP}" == "yes" && "${DESKTOP_ENVIRONMENT}" == "xfce" ]] && PACKAGE_LIST_BOARD+=" labwc xwayland"

function post_family_tweaks_bsp__mba62xx() {
	if [[ "${BUILD_DESKTOP}" == "yes" && "${DESKTOP_ENVIRONMENT}" == "xfce" ]]; then
		# --- XFCE Wayland session (labwc) ---
		# xfce4-session 4.20 already ships /usr/share/wayland-sessions/xfce-wayland.desktop;
		# we only need to tell lightdm to look in that directory and set it as default.
		run_host_command_logged mkdir -pv --mode=755 \
			"${destination}/etc/lightdm/lightdm.conf.d"
		cat > "${destination}/etc/lightdm/lightdm.conf.d/50-wayland-sessions.conf" <<- 'EOF'
			[LightDM]
			sessions-directory=/usr/share/lightdm/sessions:/usr/share/xsessions:/usr/share/wayland-sessions
		EOF

		# Default to the always-present plain session; mba62xx_bsp_postinst_pixman_renderer
		# switches this to xfce-wayland-pixman only once that session file actually exists,
		# so lightdm never points at a session that failed to get derived at postinst time.
		cat > "${destination}/etc/lightdm/lightdm.conf.d/60-default-session.conf" <<- 'EOF'
			[Seat:*]
			user-session=xfce-wayland
		EOF

		run_host_command_logged mkdir -pv --mode=755 \
			"${destination}/etc/environment.d"
		cat > "${destination}/etc/environment.d/50-wayland.conf" <<- 'EOF'
			XDG_SESSION_TYPE=wayland
			GDK_BACKEND=wayland,x11
			QT_QPA_PLATFORM=wayland;xcb
			MOZ_ENABLE_WAYLAND=1
		EOF

		# --- pixman renderer ---
		# Force wlroots pixman (CPU) renderer for labwc instead of the default GLES2 renderer,
		# since AM625's PowerVR AXE-1-16M Mesa/EGL support isn't confirmed reliable yet.
		# xfce4-session owns /usr/share/wayland-sessions/xfce-wayland.desktop, so
		# neither shipping our own copy under that name (dpkg-unpack collision)
		# nor patching it in place survives an xfce4-session upgrade (its files
		# get re-unpacked unconditionally, silently reverting the renderer back
		# to GLES2). Ship a separate, uniquely-named session entry instead -
		# derived from today's xfce-wayland.desktop with only Exec= overridden,
		# so it never collides and stays otherwise identical to upstream.
		postinst_functions+=(mba62xx_bsp_postinst_pixman_renderer)
	fi
}

function mba62xx_bsp_postinst_pixman_renderer() {
	src="/usr/share/wayland-sessions/xfce-wayland.desktop"
	dst="/usr/share/wayland-sessions/xfce-wayland-pixman.desktop"
	if [[ -f "${src}" ]]; then
		sed 's|^Exec=.*|Exec=env WLR_RENDERER=pixman startxfce4 --wayland|' "${src}" > "${dst}"
		sed -i 's/^user-session=.*/user-session=xfce-wayland-pixman/' /etc/lightdm/lightdm.conf.d/60-default-session.conf
	fi
}
