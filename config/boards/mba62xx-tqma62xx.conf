# TI AM625 quad Cortex-A53 SoC, 1/2GB RAM, eMMC, microSD, 2x GBE, USB, CAN, optional LVDS/CSI

BOARD_NAME="MBa62xx"
BOARD_VENDOR="tqgroup"
BOARDFAMILY="k3-tq"
BOARD_MAINTAINER="schmiedelm"
INTRODUCED="2026"
HAS_VIDEO_OUTPUT="yes"
# Default armbian-firmware doesn't ship mrvl/sdsd8997_combo_v4.bin (SD8997 WiFi/BT); -full does.
BOARD_FIRMWARE_INSTALL="-full"
BOOT_SOC="am62"
BOOTCONFIG="tqma62xx_mba62xx_a53_defconfig"
BOOTFS_TYPE="fat"
BOOTSIZE=512
TIBOOT3_BOOTCONFIG="tqma62xx_mba62xx_r5_defconfig"
TIBOOT3_FILE="tiboot3-am62x-gp-tqma62xx.bin"
KERNEL_TARGET="vendor,edge"
KERNEL_TEST_TARGET="vendor,edge"
DEFAULT_CONSOLE="serial"
SERIALCON="ttyS0"
# SRC_EXTLINUX boards don't get SERIALCON auto-added to the cmdline
SRC_CMDLINE="console=ttyS0,115200 earlycon=ns16550a,mmio32,0x02800000"
ATF_PLAT="k3"
ATF_BOARD="lite"
OPTEE_ARGS="CFG_TEE_CORE_LOG_LEVEL=1"
OPTEE_PLATFORM="k3-am62x"
BOOT_FDT_FILE="ti/k3-am625-tqma62xx-mba62xx.dtb"
OVERLAY_PREFIX="k3-am62-tqma62xx-mba62xx"
DEFAULT_OVERLAYS="lvds-tm070jdhg30"

# Use out-of-tree DKMS Rogue driver, not the kernel's newer in-tree "powervr" driver
TI_DEBPKGS_FALLBACK_SUITES=("noble" "jammy")
TI_PACKAGES+=(
	"ti-img-rogue-driver-am62-dkms"
	"ti-img-rogue-umlibs-am62"
	"ti-img-rogue-tools-am62"
	"ti-img-rogue-firmware-am62"
)
if [[ "${RELEASE}" == "bookworm" || "${RELEASE}" == "jammy" ]]; then
	TI_PACKAGES+=("mesa-vulkan-drivers" "libgl1-mesa-dri")
fi

# Disable the in-tree "powervr" DRM driver so it doesn't fight the DKMS one
function custom_kernel_config__mba62xx_disable_intree_powervr() {
	opts_n+=(DRM_POWERVR)
}

[[ "${BUILD_DESKTOP}" == "yes" && "${DESKTOP_ENVIRONMENT}" == "xfce" ]] && PACKAGE_LIST_BOARD+=" labwc xwayland"

function post_family_tweaks_bsp__mba62xx() {
	if [[ "${BUILD_DESKTOP}" == "yes" && "${DESKTOP_ENVIRONMENT}" == "xfce" ]]; then
		# --- XFCE Wayland session (labwc) ---
		# xfce4-session 4.20 already ships /usr/share/wayland-sessions/xfce-wayland.desktop;
		# we only need to tell lightdm to look in that directory and set it as default.
		run_host_command_logged mkdir -pv --mode=755 \
			"${destination}/etc/lightdm/lightdm.conf.d"
		cat > "${destination}/etc/lightdm/lightdm.conf.d/50-wayland-sessions.conf" <<- 'EOF'
			[LightDM]
			sessions-directory=/usr/share/lightdm/sessions:/usr/share/xsessions:/usr/share/wayland-sessions
		EOF

		cat > "${destination}/etc/lightdm/lightdm.conf.d/60-default-session.conf" <<- 'EOF'
			[Seat:*]
			user-session=xfce-wayland
		EOF

		run_host_command_logged mkdir -pv --mode=755 \
			"${destination}/etc/environment.d"
		cat > "${destination}/etc/environment.d/50-wayland.conf" <<- 'EOF'
			XDG_SESSION_TYPE=wayland
			GDK_BACKEND=wayland,x11
			QT_QPA_PLATFORM=wayland;xcb
			MOZ_ENABLE_WAYLAND=1
		EOF
	fi
}
