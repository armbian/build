# Rockchip RK3588S octa core 8GB RAM SoC eMMC USB3 USB2 1x GbE 2x 2.5GbE
source "${SRC}/config/boards/friendlyelec-rk3588.conf"

BOARD_NAME="NanoPC T6"
BOARD_VENDOR="friendlyelec"
BOARD_MAINTAINER="SuperKali Tonymac32"
INTRODUCED="2023"
# These are repeated because the JSON matrix generator parses this file directly.
BOARDFAMILY="rockchip-rk3588"
KERNEL_TARGET="current,edge,vendor"
KERNEL_TEST_TARGET="vendor,current"
declare -g UEFI_EDK2_BOARD_ID="nanopc-t6"
declare -g GRUB_FDT_FILE="rockchip/rk3588-nanopc-t6.dtb"

# Retain the T6 user-LED indication without overriding the common runtime
# environment-location policy (SPI only on detected T6 hardware).
function post_config_uboot_target__nanopct6_preboot_user_led() {
	display_alert "u-boot for ${BOARD}/${BRANCH}" "enable T6 user LED preboot indication" "info"
	run_host_command_logged scripts/config --enable CONFIG_USE_PREBOOT
	run_host_command_logged scripts/config --set-str CONFIG_PREBOOT "'led user-led on; sleep 0.1; led user-led off'"
	run_host_command_logged scripts/config --enable CONFIG_LED
	run_host_command_logged scripts/config --enable CONFIG_LED_GPIO
}
