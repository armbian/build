# NXP i.MX93 dual Cortex-A55 SoC, 1GB/2GB RAM, 2x GBE, USB-C, USB3, CAN, RS485, DisplayPort/LVDS
BOARD_NAME="MBa93xxCA"
BOARD_VENDOR="tqgroup"
BOARDFAMILY="imx93"
BOARD_MAINTAINER="schmiedelm"
INTRODUCED="2026"
HAS_VIDEO_OUTPUT="yes"
ATF_PLAT="imx93"
ATF_UART_BASE="0x44380000"
ELE_BINARY="mx93a1-ahab-container.img"
BOOTCONFIG="tqma93xx_mba93xxca_defconfig"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current,edge"
DEFAULT_CONSOLE="serial"
SERIALCON="ttyLP0"
BOOT_FDT_FILE="freescale/imx93-tqma9352-mba93xxca.dtb"
OVERLAY_PREFIX="imx93-tqma9352-mba93xxca"
DEFAULT_OVERLAYS="lvds-tm070jvhg33"
# imx93 has no 3D GPU (only PXP 2D). GNOME/KDE are unusably slow (llvmpipe).
# Only XFCE with labwc (wlroots pixman renderer) gives a responsive desktop.
[[ "${BUILD_DESKTOP}" == "yes" && "${DESKTOP_ENVIRONMENT}" == "xfce" ]] && PACKAGE_LIST_BOARD="labwc xwayland"

function post_family_tweaks_bsp__mba93xxca() {
	if [[ "${BUILD_DESKTOP}" == "yes" && "${DESKTOP_ENVIRONMENT}" == "xfce" ]]; then
		# --- XFCE Wayland session (labwc) ---
		# xfce4-session 4.20 already ships /usr/share/wayland-sessions/xfce-wayland.desktop;
		# we only need to tell lightdm to look in that directory and set it as default.
		run_host_command_logged mkdir -pv --mode=755 \
			"${destination}/etc/lightdm/lightdm.conf.d"
		cat > "${destination}/etc/lightdm/lightdm.conf.d/50-wayland-sessions.conf" <<- 'EOF'
			[LightDM]
			sessions-directory=/usr/share/lightdm/sessions:/usr/share/xsessions:/usr/share/wayland-sessions
		EOF

		cat > "${destination}/etc/lightdm/lightdm.conf.d/60-default-session.conf" <<- 'EOF'
			[Seat:*]
			user-session=xfce-wayland-pixman
		EOF

		run_host_command_logged mkdir -pv --mode=755 \
			"${destination}/etc/environment.d"
		cat > "${destination}/etc/environment.d/50-wayland.conf" <<- 'EOF'
			XDG_SESSION_TYPE=wayland
			GDK_BACKEND=wayland,x11
			QT_QPA_PLATFORM=wayland;xcb
			MOZ_ENABLE_WAYLAND=1
		EOF

		# --- pixman renderer ---
		# imx93 has no 3D GPU. Force wlroots pixman (CPU) renderer for labwc
		# instead of the default GLES2 renderer which requires hardware OpenGL.
		# xfce4-session owns /usr/share/wayland-sessions/xfce-wayland.desktop, so
		# neither shipping our own copy under that name (dpkg-unpack collision)
		# nor patching it in place survives an xfce4-session upgrade (its files
		# get re-unpacked unconditionally, silently reverting the renderer back
		# to GLES2). Ship a separate, uniquely-named session entry instead -
		# derived from today's xfce-wayland.desktop with only Exec= overridden,
		# so it never collides and stays otherwise identical to upstream.
		postinst_functions+=(mba93xxca_bsp_postinst_pixman_renderer)
	fi

	# --- WiFi/BT firmware (NXP 88W8997, USB combo) ---
	curl -fLOJ https://github.com/NXP/mwifiex-firmware/raw/1a5773c0c89ee44cee51a285d5c7c1063cdb0891/mrvl/usbusb8997_combo_v4.bin || {
		echo "download of usbusb8997_combo_v4.bin failed"
		rm -f usbusb8997_combo_v4.bin
		exit 1
	}
	run_host_command_logged mkdir -pv --mode=755 "$destination/lib/firmware/" || exit_with_error "Unable to mkdir firmware"
	run_host_command_logged mkdir -v --mode=775 "$destination/lib/firmware/mrvl/" || exit_with_error "Unable to mkdir mrvl"
	run_host_command_logged mv -v "usbusb8997_combo_v4.bin" "$destination/lib/firmware/mrvl/" || exit_with_error "Unable to copy mrvl firmware"
}

function mba93xxca_bsp_postinst_pixman_renderer() {
	src="/usr/share/wayland-sessions/xfce-wayland.desktop"
	dst="/usr/share/wayland-sessions/xfce-wayland-pixman.desktop"
	[[ -f "${src}" ]] && sed 's|^Exec=.*|Exec=env WLR_RENDERER=pixman startxfce4 --wayland|' "${src}" > "${dst}"
}
