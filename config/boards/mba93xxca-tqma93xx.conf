# NXP i.MX93 dual Cortex-A55 SoC, 1GB/2GB RAM, 2x GBE, USB-C, USB3, CAN, RS485, DisplayPort/LVDS
BOARD_NAME="MBa93xxCA"
BOARD_VENDOR="tqgroup"
BOARDFAMILY="imx93"
BOARD_MAINTAINER="schmiedelm"
INTRODUCED="2026"
HAS_VIDEO_OUTPUT="yes"
BOOTCONFIG="tqma93xx_mba93xxca_defconfig"
KERNEL_TARGET="current,edge"
KERNEL_TEST_TARGET="current,edge"
DEFAULT_CONSOLE="serial"
SERIALCON="ttyLP0"
BOOT_FDT_FILE="freescale/imx93-tqma9352-mba93xxca.dtb"
OVERLAY_PREFIX="imx93-tqma9352-mba93xxca"
DEFAULT_OVERLAYS="lvds-tm070jvhg33"

function post_family_tweaks_bsp__mba93xxca() {
	# --- WiFi/BT firmware (NXP 88W8997, USB combo) ---
	curl -fLOJ https://github.com/NXP/mwifiex-firmware/raw/1a5773c0c89ee44cee51a285d5c7c1063cdb0891/mrvl/usbusb8997_combo_v4.bin || {
		echo "download of usbusb8997_combo_v4.bin failed"
		rm -f usbusb8997_combo_v4.bin
		exit 1
	}
	run_host_command_logged mkdir -pv --mode=755 "$destination/lib/firmware/" || exit_with_error "Unable to mkdir firmware"
	run_host_command_logged mkdir -v --mode=775 "$destination/lib/firmware/mrvl/" || exit_with_error "Unable to mkdir mrvl"
	run_host_command_logged mv -v "usbusb8997_combo_v4.bin" "$destination/lib/firmware/mrvl/" || exit_with_error "Unable to copy mrvl firmware"
}
