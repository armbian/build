# JetHub D3 (j310) Amlogic S905y5 quad core 4Gb RAM SoC eMMC USB2
BOARD_NAME="JetHub D3"
BOARD_VENDOR="jethome"
BOARDFAMILY="jethub"
BOARD_MAINTAINER="QwaSeek adeepn"
INTRODUCED="2026"
BOOTCONFIG="jethub_j310_defconfig"
CPUMAX=1704000
# Recovery A/B raw layout, ahead of the rootfs partition:
#   AML inherent areas: 0–132 MiB
#   Slot A: 132–234 MiB, Slot B: 234–336 MiB
OFFSET=336
KERNELSOURCE="https://github.com/jethome-iot/linux-kernel.git"
KERNELBRANCH="branch:linux-s7-5.15"
KERNELPATCHDIR=""
BOOTSOURCE="https://github.com/jethome-iot/u-boot"
BOOTBRANCH_BOARD="branch:jethub_j310"
BOOTDIR="u-boot-jethub-j310"
KERNEL_TARGET="vendor"
KERNEL_DRIVERS_SKIP+=(driver_rtl8811CU_rtl8821C)
PACKAGE_LIST_BOARD="libubootenv-tool apparmor rfkill bluetooth bluez bluez-tools python3-pip watchdog python3-serial python3-intelhex python3-intelhex"
[[ "${RELEASE}" == "jammy" ]] || PACKAGE_LIST_BOARD="${PACKAGE_LIST_BOARD} util-linux-extra"
DEFAULT_CONSOLE="serial"
SERIALCON="ttyS0"
HAS_VIDEO_OUTPUT="no"
MODULES_BLACKLIST="rtw88_8822cs"
enable_extension "jethub-burn"
