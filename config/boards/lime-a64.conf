# Allwinner A64 quad core 1GB RAM SoC GBE eMMC Wi-Fi/BT
BOARD_NAME="A64 OLinuXino"
BOARD_VENDOR="olimex"
BOARDFAMILY="sun50iw1"
BOARD_MAINTAINER="igorpecovnik"
INTRODUCED="2017"
BOOTCONFIG_DEFAULT="sun50iw1p1_config"
BOOTCONFIG="a64-olinuxino-emmc_defconfig"
KERNEL_TARGET="current,edge,legacy"
KERNEL_TEST_TARGET="current"
FULL_DESKTOP="yes"
CRUSTCONFIG="a64_defconfig"

function post_config_uboot_target__lime_a64_extra_configs() {
	display_alert "$BOARD" "u-boot: DRAM clock, KSZ9031 PHY, network boot and debug commands" "info"
	run_host_command_logged scripts/config --set-val CONFIG_DRAM_CLK "624"
	run_host_command_logged scripts/config --set-val CONFIG_DRAM_ZQ "3881949"
	local opt
	for opt in PHY_MICREL PHY_MICREL_KSZ90X1 CMD_DHCP CMD_PING CMD_PXE CMD_TFTPBOOT CMD_NFS CMD_WGET CMD_DNS \
		CMD_GPIO CMD_POWEROFF SYSRESET_CMD_POWEROFF CMD_EXT4_WRITE FAT_WRITE CMD_HASH CMD_BOOTMENU CMD_EFICONFIG; do
		run_host_command_logged scripts/config --enable "CONFIG_${opt}"
	done
}
