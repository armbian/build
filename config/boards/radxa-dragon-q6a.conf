# Qualcomm QCS6490 Kryo octa core Adreno 643 up to 16GB LPDDR5 SoC UFS/eMMC/NVMe microSD 1x GbE WiFi6/BT5.4 4K HDMI
declare -g BOARD_NAME="Radxa Dragon Q6A"
declare -g BOARD_VENDOR="radxa"
declare -g BOARD_MAINTAINER="HeyMeco SuperKali"
declare -g INTRODUCED="2025"
declare -g BOARDFAMILY="qcs6490"
declare -g KERNEL_TARGET="current,edge"
declare -g KERNEL_TEST_TARGET="current,edge"
declare -g BOOTCONFIG="none"
declare -g IMAGE_PARTITION_TABLE="gpt"
enable_extension "radxa-aic8800"
AIC8800_TYPE="usb"

# Use the full firmware, complete linux-firmware plus Armbian's (for qcom/qcs6490/a660_zap.mbn)
declare -g BOARD_FIRMWARE_INSTALL="-full"

declare -g BOOT_FDT_FILE="qcom/qcs6490-radxa-dragon-q6a.dtb"

# Radxa EDK2 SPI NOR image (pulls edl-ng) and flash_erase for write_uboot_platform_mtd
declare -g PACKAGE_LIST_BOARD="mtd-utils edk2-radxa-dragon-q6a"

function post_family_tweaks_bsp__radxa-dragon-q6a_bsp_firmware_in_initrd() {
	display_alert "Adding to bsp-cli" "${BOARD}: firmware in initrd" "info"
	declare file_added_to_bsp_destination # will be filled in by add_file_from_stdin_to_bsp_destination
	add_file_from_stdin_to_bsp_destination "/etc/initramfs-tools/hooks/initramfs-hook-qcs6490-fw" <<- 'FIRMWARE_HOOK'
		#!/bin/bash
		[[ "$1" == "prereqs" ]] && exit 0
		. /usr/share/initramfs-tools/hook-functions
		add_firmware "qcom/qcs6490/a660_zap.mbn" # extra one for gpu
		add_firmware "qcom/a660_sqe.fw" # extra one for dpu
		add_firmware "qcom/a660_gmu.bin" # extra one for gpu gmu
		add_firmware "qcom/qcm6490/qupv3fw.elf" # extra one for qup i2c/spi serial engines
		add_firmware "qcom/qcs6490/radxa/dragon-q6a/adsp.mbn" # extra one for remoteproc0
		add_firmware "qcom/qcs6490/radxa/dragon-q6a/cdsp.mbn" # extra one for remoteproc1
		add_firmware "qcom/qcs6490/QCS6490-Radxa-Dragon-Q6A-tplg.bin" # extra one for sound
	FIRMWARE_HOOK
	run_host_command_logged chmod -v +x "${file_added_to_bsp_destination}"
}

function post_family_tweaks__radxa-dragon-q6a_install_alsa_ucm_conf() {
	# Radxa backport bundles the Q6A device UCM plus the DMI matcher (fork only, not upstream).
	declare alsa_ucm_ver="1.2.16.1-radxa-1"
	display_alert "Installing alsa-ucm-conf" "${BOARD}: Radxa ALSA UCM backport ${alsa_ucm_ver}" "info"
	declare alsa_ucm_url="https://github.com/radxa-pkg/alsa-ucm-conf/releases/download/${alsa_ucm_ver}/alsa-ucm-conf_${alsa_ucm_ver}_all.deb"
	declare alsa_ucm_deb="/tmp/alsa-ucm-conf_${alsa_ucm_ver}_all.deb"
	run_host_command_logged wget -O "${SDCARD}${alsa_ucm_deb}" "${alsa_ucm_url}"
	chroot_sdcard dpkg -i "${alsa_ucm_deb}"
	run_host_command_logged rm -f "${SDCARD}${alsa_ucm_deb}"
}

function post_family_tweaks_bsp__radxa-dragon-q6a_bsp_spinor_update() {
	display_alert "Adding to bsp-cli" "${BOARD}: SPI NOR firmware update hook" "info"
	# armbian-install only lists MTD devices that have an mtdblock node
	add_file_from_stdin_to_bsp_destination "/etc/modules-load.d/${BOARD}-spinor.conf" <<< "mtdblock"
	{
		echo "# Armbian SPI NOR firmware install script for ${BOARD}"
		echo "DIR=/usr/lib/edk2/radxa/${BOARD}"
		declare -f write_uboot_platform_mtd
	} | add_file_from_stdin_to_bsp_destination "/usr/lib/u-boot/platform_install.sh"
}

# Called by armbian-install as: write_uboot_platform_mtd <dir> <device> <log> <mtd_list>
function write_uboot_platform_mtd() {
	declare dir="${1}" log="${3:-/dev/stderr}"
	declare mtd="" sysdev work backup entry file start size
	declare -i verified=0

	# The NOR is owned by TrustZone and only reachable through the SCM storage MTD device
	for sysdev in /sys/class/mtd/mtd*; do
		[[ "${sysdev}" =~ /mtd[0-9]+$ && "$(cat "${sysdev}/name" 2> /dev/null)" == "qcom_scm_storage" ]] || continue
		mtd="/dev/${sysdev##*/}"
		break
	done
	if [[ -z "${mtd}" ]]; then
		echo "SPI NOR not available: no qcom_scm_storage MTD device" >> "${log}"
		return 1
	fi
	if [[ ! -f "${dir}/rawprogram0.xml" || ! -f "${dir}/patch0.xml" ]]; then
		echo "SPI NOR image not found in ${dir}" >> "${log}"
		return 1
	fi
	if ! command -v edl-ng > /dev/null || ! command -v flash_erase > /dev/null; then
		echo "edl-ng or flash_erase is missing" >> "${log}"
		return 1
	fi

	# patch0.xml rewrites the GPT image in place, so flash from a scratch copy
	work="$(mktemp -d)" || return 1
	cp -rL "${dir}/." "${work}/" || {
		rm -rf "${work}"
		return 1
	}

	mkdir -p /var/backups
	backup="/var/backups/spinor-$(date +%Y%m%d-%H%M%S).bin"
	if ! dd if="${mtd}" of="${backup}" bs=64k status=none; then
		echo "Backup of ${mtd} failed, nothing written" >> "${log}"
		rm -rf "${work}" "${backup}"
		return 1
	fi
	echo "Saved current SPI NOR contents to ${backup}" >> "${log}"

	if ! flash_erase "${mtd}" 0 0 >> "${log}" 2>&1 ||
		! (cd "${work}" && edl-ng --hostdev-as-target "${mtd}" rawprogram rawprogram0.xml patch0.xml) >> "${log}" 2>&1; then
		echo "Writing ${mtd} failed, do not reboot, retry or restore ${backup} via EDL" >> "${log}"
		rm -rf "${work}"
		return 1
	fi
	sync

	# Read back every image except the GPT, which patch0.xml patches on the device
	while read -r entry; do
		file="$(sed -n 's/.* filename="\([^"]*\)".*/\1/p' <<< "${entry}")"
		start="$(sed -n 's/.* start_sector="\([0-9]*\)".*/\1/p' <<< "${entry}")"
		[[ -n "${file}" && -n "${start}" ]] || continue
		size="$(stat -c %s "${work}/${file}")"
		if ! cmp -s -n "${size}" "${work}/${file}" <(dd if="${mtd}" bs=4096 skip="${start}" count="$(((size + 4095) / 4096))" status=none); then
			echo "Verification of ${file} failed, do not reboot, retry or restore ${backup} via EDL" >> "${log}"
			rm -rf "${work}"
			return 1
		fi
		verified+=1
	done < <(grep -o '<program [^>]*' "${work}/rawprogram0.xml" | grep 'partofsingleimage="false"')
	if ((verified == 0)); then
		echo "No image of rawprogram0.xml was verified, do not reboot, retry or restore ${backup} via EDL" >> "${log}"
		rm -rf "${work}"
		return 1
	fi

	echo "SPI NOR firmware written on ${mtd}, ${verified} images verified" >> "${log}"
	rm -rf "${work}"
	return 0
}
