# Allwinner A733 (sun60iw2) SoC family.

declare -g LINUXFAMILY="sun60iw2"
declare -g ARCH="arm64"
declare -g ATF_COMPILE="no"
declare -g INSTALL_HEADERS="yes"

declare -g INITRD_ARCH="arm"
declare -g SERIALCON="ttyS0"
declare -g BOOTSCRIPT="boot-sun60iw2.cmd:boot.cmd"
declare -g BOOTENV_FILE="sun60iw2.txt"
declare -g OFFSET=32

# NOTE: Don't swap in an out-of-tree AIC8800 DKMS driver — it shadows the
# in-tree bsp symbols and breaks fdrv ("Unknown symbol").
# pvrsrvkm is the out-of-tree IMG BXM (PowerVR) GPU driver, built by pre_package_kernel_image__sun60iw2_gpu_module
# below. It has an "img,gpu" devicetree alias, but is listed explicitly so it is loaded early and reliably.
[[ -z "${MODULES}" ]] && declare -g MODULES="aic8800_bsp aic8800_fdrv aic8800_btlpm pvrsrvkm"

declare -g KERNELSOURCE="https://github.com/orangepi-xunlong/linux-orangepi.git"
declare -g KERNELBRANCH="branch:orange-pi-6.6-sun60iw2"
declare -g KERNEL_MAJOR_MINOR="6.6"
declare -g LINUXCONFIG="linux-sun60iw2-vendor"
declare -g KERNELPATCHDIR="archive/sun60iw2-opi-vendor"
declare -g OVERLAY_PREFIX="sun60i-a733"

declare -g BOOTSOURCE="https://github.com/orangepi-xunlong/u-boot-orangepi.git"
declare -g BOOTBRANCH="commit:b791be842935b27268ae3d00e943a9075495f30a" # branch v2018.05-sun60iw2
declare -g BOOTDIR="u-boot-orangepi-sun60iw2"
declare -g UBOOT_GIT_SKIP_SUBMODULES="yes"
declare -g BOOTCONFIG="sun60iw2p1_t736_defconfig"
declare -g UBOOT_COMPILER="arm-linux-gnueabi-" # vendor U-Boot is 32-bit ARM
declare -g UBOOT_TARGET_MAP=";;boot0_sdcard.fex boot0_spinor.fex boot_package.fex"
declare -g OVERLAY_DIR="/boot/dtb/allwinner/overlay"

# GPU (IMG BXM-4-64, driver "pvrsrvkm") + NPU userspace are installed from Orange Pi's
# sun60iw2_packages repo. Switches, all default "yes":
#   SUN60IW2_GPU_USERSPACE  - PowerVR EGL/GLES/GBM/Vulkan/OpenCL libs, RGX firmware
#   SUN60IW2_NPU_USERSPACE  - VIPLite NPU runtime + demos
#   SUN60IW2_MEDIA_USERSPACE- Allwinner CedarC (video enc/dec), ISP (camera) libs, GStreamer OMX plugin
declare -g SUN60IW2_PACKAGES_REPO="https://github.com/orangepi-xunlong/rk-rootfs-build.git"
declare -g SUN60IW2_PACKAGES_REF="7b6d78d4f5eaefd5456777fbea5057a0876e8f4d" # branch sun60iw2_packages
# Camera tools (csi_test_mplane, v4l2_opencv_demo, test_camera.sh) come from orangepi-build.
declare -g SUN60IW2_OPI_BUILD_REPO="https://github.com/orangepi-xunlong/orangepi-build.git"
declare -g SUN60IW2_OPI_BUILD_REF="7f776a209b72b92e8c6a06abc83b1e7597eef5af" # branch next

# Desktop targets are not built by default (FULL_DESKTOP). Boards without a working
# desktop set HAS_VIDEO_OUTPUT="no" in their own config (not here) so the build-list
# inventory -- which parses only board configs, not family files -- sees it.
declare -g FULL_DESKTOP="no"

function add_host_dependencies__sun60iw2_uboot_xxd() {
	# xxd is needed to build vendor U-Boot
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} xxd"
}

function post_config_uboot_target__sun60iw2_vendor_quirks() {
	# The vendor U-Boot tree has some warnings that are treated as errors by newer toolchains. Silence them.
	uboot_cflags_array+=(-fcommon -Wno-error -Wno-attributes -Wno-array-bounds -Wno-maybe-uninitialized -Wno-stringop-overflow)

	# The source tree ships an x86-only scripts/dtc/dtc; rebuild it as arm64
	if ! ./scripts/dtc/dtc --version > /dev/null 2>&1; then
		run_host_command_logged rm -f scripts/dtc/dtc
		# run directly (not run_host_command_logged): HOSTCFLAGS value contains a space
		make -f scripts/Makefile.build obj=scripts/dtc srctree=. objtree="${PWD}" HOSTCC=cc HOSTCFLAGS="-O2 -fcommon" LEX=flex YACC=bison ||
			exit_with_error "sun60iw2: native scripts/dtc rebuild failed"
	fi
}

function uboot_make_config__sun60iw2_pwd() {
	uboot_make_envs+=("PWD=${PWD}") # Orange Pi U-Boot make expects PWD to be set
}

# Pack the compiled u-boot into the Allwinner boot images using Orange Pi's
# pack-uboot tooling. Produces boot0_sdcard.fex, boot0_spinor.fex, and
# boot_package.fex. Per-board DRAM blobs (boot0 + sys_config) must be provided
# by each board's fetch_custom_uboot hook — there is no default.
function uboot_custom_postprocess() {
	local opi_build_repo="https://github.com/orangepi-xunlong/orangepi-build.git"
	local opi_build_ref="7f776a209b72b92e8c6a06abc83b1e7597eef5af" # branch next
	local work_dir="$(mktemp -d)"
	local pack_dir="${work_dir}/opibuild/external/packages/pack-uboot"

	# Current dir is the u-boot worktree throughout (we never cd); paths are relative to it.
	[[ -f u-boot.bin ]] || exit_with_error "uboot_custom_postprocess: u-boot.bin not found in u-boot worktree"
	command -v xxd > /dev/null 2>&1 || exit_with_error "uboot_custom_postprocess: missing host tool 'xxd'"

	# Per-board boot blobs provided by each board's fetch_custom_uboot hook.
	[[ -n "${SUNXI_BOOT0_SDCARD_FEX}" && -n "${SUNXI_BOOT0_SPINOR_FEX}" && -n "${SUNXI_SYS_CONFIG_FEX}" ]] ||
		exit_with_error "sun60iw2: board must set SUNXI_BOOT0_SDCARD_FEX / SUNXI_BOOT0_SPINOR_FEX / SUNXI_SYS_CONFIG_FEX in its fetch_custom_uboot hook"
	[[ -f "${SUNXI_BOOT0_SDCARD_FEX}" ]] || exit_with_error "uboot_custom_postprocess: boot0 sdcard blob not found: ${SUNXI_BOOT0_SDCARD_FEX}"
	[[ -f "${SUNXI_BOOT0_SPINOR_FEX}" ]] || exit_with_error "uboot_custom_postprocess: boot0 spinor blob not found: ${SUNXI_BOOT0_SPINOR_FEX}"
	[[ -f "${SUNXI_SYS_CONFIG_FEX}" ]] || exit_with_error "uboot_custom_postprocess: sys_config blob not found: ${SUNXI_SYS_CONFIG_FEX}"

	# The Allwinner pack tools are x86-only ELF binaries that operate relative to
	# their working directory so we wrap their execution.
	local -a pack_run=(env -u QEMU_CPU -C "${work_dir}")
	if [[ "$(uname -m)" != "x86_64" ]]; then
		local qemu_bin
		qemu_bin="$(command -v qemu-x86_64-static || true)"
		[[ -n "${qemu_bin}" ]] || exit_with_error "uboot_custom_postprocess: qemu-x86_64-static needed on $(uname -m)"
		pack_run+=("${qemu_bin}")
	fi

	display_alert "Cloning pack-uboot from orangepi-build" "${opi_build_ref:0:12}" "info"
	run_host_command_logged git init -q "${work_dir}/opibuild"
	run_host_command_logged git -C "${work_dir}/opibuild" remote add origin "${opi_build_repo}"
	run_host_command_logged git -C "${work_dir}/opibuild" config core.sparseCheckout true
	echo "external/packages/pack-uboot/*" > "${work_dir}/opibuild/.git/info/sparse-checkout"
	run_host_command_logged git -C "${work_dir}/opibuild" fetch -q --depth 1 origin "${opi_build_ref}"
	run_host_command_logged git -C "${work_dir}/opibuild" checkout -q FETCH_HEAD
	[[ -d "${pack_dir}/sun60iw2/bin" && -d "${pack_dir}/tools" ]] || exit_with_error "uboot_custom_postprocess: pack-uboot layout missing in orangepi-build @ ${opi_build_ref}"

	# Stage the shared SoC boot assets (boot_package.cfg, monitor/SCP, dts/) into work_dir.
	display_alert "Packing boot images" "${BOARD}" "info"
	run_host_command_logged cp -r "${pack_dir}/sun60iw2/bin/." "${work_dir}/"

	# DTB: u-boot.dtb -> sunxi.fex
	run_host_command_logged cp u-boot.bin "${work_dir}/u-boot.fex"
	run_host_command_logged ./scripts/dtc/dtc -p 2048 -W no-unit_address_vs_reg -@ -O dtb -o "${work_dir}/uboot.dtb" -b 0 "${work_dir}/dts/u-boot-current.dts"
	run_host_command_logged cp "${work_dir}/uboot.dtb" "${work_dir}/sunxi.fex"
	run_host_command_logged "${pack_run[@]}" "${pack_dir}/tools/update_dtb" sunxi.fex 4096

	# sys_config: sys_config.fex -> sys_config.bin
	run_host_command_logged cp "${SUNXI_SYS_CONFIG_FEX}" "${work_dir}/sys_config.fex"
	sed -i 's/$/\r/' "${work_dir}/sys_config.fex" || exit_with_error "uboot_custom_postprocess: CRLF conversion of sys_config.fex failed"
	run_host_command_logged "${pack_run[@]}" "${pack_dir}/tools/script" sys_config.fex

	# Pack boot images
	run_host_command_logged "${pack_run[@]}" "${pack_dir}/tools/update_uboot" -no_merge u-boot.fex sys_config.bin
	sed -i 's/$/\r/' "${work_dir}/boot_package.cfg" || exit_with_error "uboot_custom_postprocess: CRLF conversion of boot_package.cfg failed"
	run_host_command_logged "${pack_run[@]}" "${pack_dir}/tools/dragonsecboot" -pack boot_package.cfg

	# Deliver images into the worktree (current dir) for UBOOT_TARGET_MAP.
	run_host_command_logged cp "${SUNXI_BOOT0_SDCARD_FEX}" boot0_sdcard.fex
	run_host_command_logged cp "${SUNXI_BOOT0_SPINOR_FEX}" boot0_spinor.fex
	run_host_command_logged cp "${work_dir}/boot_package.fex" boot_package.fex
	[[ -f boot_package.fex && -f boot0_sdcard.fex && -f boot0_spinor.fex ]] ||
		exit_with_error "uboot_custom_postprocess: packing failed — missing one of boot0_sdcard/boot0_spinor/boot_package .fex"

	rm -rf "${work_dir}"
}

# Literal offsets, no config vars: this runs board-side too (armbian-install /
# u-boot upgrade) where it is dumped via `declare -f` and family/board vars are
# absent. exit_with_error is also unavailable board-side, so fail with return 1.
# The Cubie A7Z overrides this with its own offsets in config/boards/cubie-a7z.csc.
function write_uboot_platform() {
	local SCRIPT_DIR="$1" DEVICE="$2"
	[[ -f "${SCRIPT_DIR}/boot0_sdcard.fex" ]] || { echo "write_uboot_platform: missing ${SCRIPT_DIR}/boot0_sdcard.fex" >&2; return 1; }
	[[ -f "${SCRIPT_DIR}/boot_package.fex" ]] || { echo "write_uboot_platform: missing ${SCRIPT_DIR}/boot_package.fex" >&2; return 1; }
	dd conv=notrunc,fsync status=none if="${SCRIPT_DIR}/boot0_sdcard.fex" of="${DEVICE}" bs=1k seek=8 ||
		{ echo "write_uboot_platform: boot0_sdcard.fex write to ${DEVICE} failed" >&2; return 1; }
	dd conv=notrunc,fsync status=none if="${SCRIPT_DIR}/boot_package.fex" of="${DEVICE}" bs=1k seek=16400 ||
		{ echo "write_uboot_platform: boot_package.fex write to ${DEVICE} failed" >&2; return 1; }
	sync "${DEVICE}"
}

# Dirty Frag / Fragnesia: this vendor kernel has no fix. Keep IPsec ESP off,
# also against the Armbian default INET_ESP=m (docker support).
function custom_kernel_config__sun60iw2_dirty_frag() {
	kernel_config_force_n INET_ESP INET6_ESP
}

function post_family_tweaks__sun60iw2() {
	display_alert "sun60iw2 rootfs tweaks" "${BOARD}" "info"

	# Link the AIC8800D80 WiFi/BT firmware (shipped by armbian-firmware) to the flat
	# lowercase path the in-tree vendor driver expects.
	if [[ -d "${SDCARD}/lib/firmware/aic8800/SDIO/aic8800D80" ]]; then
		ln -sfn aic8800/SDIO/aic8800D80 "${SDCARD}/lib/firmware/aic8800d80"
	else
		display_alert "aic8800D80 firmware not found in rootfs" "WiFi may not work; check armbian-firmware" "warn"
	fi

	chroot_sdcard_apt_get_install mtd-utils # MTD flash flash_erase/mtd_debug

	# AIC8800D80 combo: BT is UART HCI on ttyS1 and needs userspace bring-up
	# (bluez + the wake/hciattach service installed by the family).
	if [[ "${SUN60IW2_UART_BT:-no}" == "yes" ]]; then
		chroot_sdcard_apt_get_install bluez rfkill
		run_host_command_logged install -m 644 "${SRC}/packages/bsp/sunxi/aic8800-bluetooth.service" "${SDCARD}/lib/systemd/system/aic8800-bluetooth.service"
		chroot_sdcard systemctl --no-reload enable aic8800-bluetooth.service
	fi
}

# Add Orange Pi's proprietary kernel headers from bsp/ to the linux-headers package.
function pre_package_kernel_headers__sun60iw2_bsp_include() {
	[[ -d "${kernel_work_dir}/bsp/include" ]] || return 0
	run_host_command_logged cp -rp "${kernel_work_dir}/bsp/include" "${headers_target_dir}/bsp/include"
}

# Build the out-of-tree IMG BXM GPU kernel module (pvrsrvkm.ko) from the vendor tree's
# bsp/modules/gpu (same recipe as orangepi-build's compilation.sh) and ship it inside the
# linux-image package under /lib/modules/<ver>/extra. Runs after the kernel is fully built
# and before the modules dir is copied into the package; the linux-image postinst runs depmod.
function pre_package_kernel_image__sun60iw2_gpu_module() {
	local gpu_dir="${kernel_work_dir}/bsp/modules/gpu"
	# Fail the build, don't warn-and-continue: MODULES unconditionally lists "pvrsrvkm" (written to
	# /etc/modules), so silently skipping the build here would ship an image that requests a kernel
	# module that was never packaged -- a confusing runtime modprobe failure instead of a build failure.
	[[ -d "${gpu_dir}" ]] || exit_with_error "sun60iw2: required bsp/modules/gpu is missing from the kernel tree; cannot build pvrsrvkm"

	local gpu_out="${kernel_work_dir}/.armbian-gpu-modules"
	local extra_dir="${tmp_kernel_install_dirs[INSTALL_MOD_PATH]}/lib/modules/${kernel_version_family}/extra"
	# The IMG makefile builds every tool as $(LICHEE_TOOLCHAIN_PATH)/$(LICHEE_CROSS_COMPILER)<tool>.
	# Locate the toolchain by ld: with ccache, gcc resolves to /usr/lib/ccache, which has no ld.
	local gpu_ld gpu_toolchain_dir
	gpu_ld="$(command -v "${KERNEL_COMPILER}ld")" || exit_with_error "sun60iw2: ${KERNEL_COMPILER}ld not found"
	gpu_toolchain_dir="$(dirname "${gpu_ld}")"
	local -a gpu_make=(make -C "${gpu_dir}" ARCH="${ARCHITECTURE}" CROSS_COMPILE="${KERNEL_COMPILER}"
		LICHEE_TOOLCHAIN_PATH="${gpu_toolchain_dir}" LICHEE_CROSS_COMPILER="${KERNEL_COMPILER}"
		LICHEE_PLATFORM=linux LICHEE_ARCH="${ARCHITECTURE}" LICHEE_KERN_DIR="${kernel_work_dir}" LICHEE_MOD_DIR="${gpu_out}")

	# The IMG kbuild wrapper declares a global ".SECONDARY:", which GNU make >= 4.4 rejects together with the
	# ".NOTINTERMEDIATE:" the kernel's Kbuild.include adds. Drop it from the template and its generated copies.
	# The vendor tree also ships a stale generated output dir whose symlinks point into the vendor's own
	# build machine (/root/orangepi/...). The IMG build regenerates it, so start from a clean one.
	run_host_command_logged rm -rf "${gpu_dir}/img-bxm/linux/rogue_km/binary_sunxi_linux_nulldrmws_release"

	local kbuild_makefile
	while IFS= read -r -d '' kbuild_makefile; do
		sed -i 's/^\.SECONDARY:[[:space:]]*$/# .SECONDARY removed (conflicts with .NOTINTERMEDIATE on make >= 4.4)/' "${kbuild_makefile}"
	done < <(find "${gpu_dir}/img-bxm" -path '*kbuild/Makefile*' -type f -print0)

	display_alert "Building PowerVR GPU module" "pvrsrvkm for ${kernel_version_family}" "info"
	run_host_command_logged rm -rf "${gpu_out}"
	run_host_command_logged mkdir -p "${gpu_out}"
	run_host_command_logged "${gpu_make[@]}" -j"$(nproc)" || exit_with_error "sun60iw2: pvrsrvkm build failed"
	run_host_command_logged "${gpu_make[@]}" modules_install || exit_with_error "sun60iw2: pvrsrvkm install failed"
	[[ -f "${gpu_out}/pvrsrvkm.ko" ]] || exit_with_error "sun60iw2: pvrsrvkm.ko was not produced"

	run_host_command_logged mkdir -p "${extra_dir}"
	run_host_command_logged install -m 644 "${gpu_out}/pvrsrvkm.ko" "${extra_dir}/pvrsrvkm.ko"
	run_host_command_logged "${KERNEL_COMPILER}strip" --strip-debug "${extra_dir}/pvrsrvkm.ko" # ~39 MB with debug info
	run_host_command_logged rm -rf "${gpu_out}"

	# `make modules_install` already ran depmod (via scripts/depmod.sh) before this hook fires, so
	# modules.dep/modules.alias baked into the linux-image package don't know about pvrsrvkm.ko yet
	# unless we regenerate them now, against the same staging root, before it gets copied into the deb.
	display_alert "Regenerating module dependencies" "depmod (for pvrsrvkm)" "info"
	run_host_command_logged depmod -a -b "${tmp_kernel_install_dirs[INSTALL_MOD_PATH]}" -F "${kernel_work_dir}/System.map" "${kernel_version_family}"
}

# Fetch the pinned sun60iw2_packages tree (sparse: only what we use) into the shared cache
# and set SUN60IW2_PACKAGES_DIR to it.
function sun60iw2_fetch_vendor_packages() {
	declare -g SUN60IW2_PACKAGES_DIR="${SRC}/cache/sources/sun60iw2_packages-${SUN60IW2_PACKAGES_REF:0:12}"
	local repo="${SUN60IW2_PACKAGES_DIR}" repo_url="${SUN60IW2_PACKAGES_REPO}"
	[[ "${repo_url}" == https://github.com/* ]] && repo_url="${GITHUB_SOURCE}/${repo_url#https://github.com/}"

	local -a wanted=("bullseye/xserver/*" "bullseye/libcedarc/*" "bullseye/libAWIspApi/*" "bullseye/gst-omx-generic1.0/*" "npu/*")

	if [[ -d "${repo}/.git" ]] && [[ "$(git -C "${repo}" rev-parse HEAD 2> /dev/null)" == "${SUN60IW2_PACKAGES_REF}" ]]; then
		# Same commit already fetched; make sure the checkout covers everything we currently need.
		if [[ "$(cat "${repo}/.git/info/sparse-checkout" 2> /dev/null)" != "$(printf '%s\n' "${wanted[@]}")" ]]; then
			printf '%s\n' "${wanted[@]}" > "${repo}/.git/info/sparse-checkout"
			run_host_command_logged git -C "${repo}" read-tree -mu HEAD
		fi
		return 0
	fi

	display_alert "Fetching sun60iw2_packages" "${SUN60IW2_PACKAGES_REF:0:12}" "info"
	run_host_command_logged rm -rf "${repo}"
	run_host_command_logged mkdir -p "${repo}"
	run_host_command_logged git init -q "${repo}"
	run_host_command_logged git -C "${repo}" remote add origin "${repo_url}"
	run_host_command_logged git -C "${repo}" config core.sparseCheckout true
	printf '%s\n' "${wanted[@]}" > "${repo}/.git/info/sparse-checkout"
	run_host_command_logged git -C "${repo}" fetch -q --depth 1 origin "${SUN60IW2_PACKAGES_REF}" ||
		exit_with_error "sun60iw2: could not fetch sun60iw2_packages @ ${SUN60IW2_PACKAGES_REF}"
	run_host_command_logged git -C "${repo}" checkout -q FETCH_HEAD
}

# Sparse fetch of orangepi-build's sun60iw2 BSP files, cached per ref.
function sun60iw2_fetch_opi_bsp() {
	declare -g SUN60IW2_OPI_BSP_DIR="${SRC}/cache/sources/sun60iw2_opi_bsp-${SUN60IW2_OPI_BUILD_REF:0:12}"
	local repo="${SUN60IW2_OPI_BSP_DIR}" repo_url="${SUN60IW2_OPI_BUILD_REPO}" lock_fd
	[[ "${repo_url}" == https://github.com/* ]] && repo_url="${GITHUB_SOURCE}/${repo_url#https://github.com/}"

	# Parallel builds share this cache: lock the check and the fetch.
	run_host_command_logged mkdir -p "${repo%/*}"
	exec {lock_fd}> "${repo}.lock"
	flock -x "${lock_fd}"
	if [[ -d "${repo}/.git" ]] && [[ "$(git -C "${repo}" rev-parse HEAD 2> /dev/null)" == "${SUN60IW2_OPI_BUILD_REF}" ]]; then
		exec {lock_fd}>&-
		return 0
	fi

	display_alert "Fetching orangepi-build sun60iw2 BSP" "${SUN60IW2_OPI_BUILD_REF:0:12}" "info"
	run_host_command_logged rm -rf "${repo}"
	run_host_command_logged mkdir -p "${repo}"
	run_host_command_logged git init -q "${repo}"
	run_host_command_logged git -C "${repo}" remote add origin "${repo_url}"
	run_host_command_logged git -C "${repo}" config core.sparseCheckout true
	echo "external/packages/bsp/sun60iw2/*" > "${repo}/.git/info/sparse-checkout"
	# blob:none: download only the sparse paths (~10 MB, not the whole ~230 MB tree)
	run_host_command_logged git -C "${repo}" fetch -q --depth 1 --filter=blob:none origin "${SUN60IW2_OPI_BUILD_REF}" ||
		exit_with_error "sun60iw2: could not fetch orangepi-build @ ${SUN60IW2_OPI_BUILD_REF}"
	run_host_command_logged git -C "${repo}" checkout -q FETCH_HEAD
	exec {lock_fd}>&-
}

# Userspace for the GPU / NPU / video / camera blocks. Only the drivers' libs are taken from the
# vendor packages; Orange Pi's patched Xorg/lightdm bits shipped in the same deb are left out.
function post_family_tweaks__sun60iw2_userspace() {
	local gpu="${SUN60IW2_GPU_USERSPACE:-yes}" npu="${SUN60IW2_NPU_USERSPACE:-yes}" media="${SUN60IW2_MEDIA_USERSPACE:-yes}"
	[[ "${gpu}${npu}${media}" == *yes* ]] || return 0

	sun60iw2_fetch_vendor_packages
	local pkgs="${SUN60IW2_PACKAGES_DIR}"

	if [[ "${gpu}" == "yes" ]]; then
		display_alert "sun60iw2 GPU userspace" "PowerVR EGL/GLES/GBM/Vulkan/OpenCL + RGX firmware" "info"
		local gpu_tmp="$(mktemp -d)"
		run_host_command_logged dpkg-deb -x "${pkgs}"/bullseye/xserver/xserver-xorg-img-bxm_*_arm64.deb "${gpu_tmp}"
		# The deb ships a plain "lib/" dir (firmware only) next to "usr/lib/". The target rootfs has
		# /lib as a symlink to /usr/lib; merge "lib/" into "usr/lib/" here so rsync never sees a "lib"
		# entry to reconcile against that symlink (rsync -K tried this and hit ELOOP on a populated
		# target).
		if [[ -d "${gpu_tmp}/lib" ]]; then
			run_host_command_logged cp -a "${gpu_tmp}/lib/." "${gpu_tmp}/usr/lib/"
			run_host_command_logged rm -rf "${gpu_tmp}/lib"
		fi
		# The lightdm unit and /etc/environment only add LD_LIBRARY_PATH=/usr/local/lib; the ld.so.conf.d
		# file below does that system-wide instead. libxcvt ships with the patched Xorg.
		local -a gpu_excludes=(--exclude='/etc/environment' --exclude='/usr/lib/systemd')
		if [[ "${BUILD_DESKTOP}" != "yes" ]]; then
			# Headless: libraries, RGX firmware and pkg-config files only; no Xorg server, X modules, X config, libxcvt.
			gpu_excludes+=(--exclude='/etc' --exclude='/usr/bin' --exclude='/usr/lib/xorg' --exclude='/usr/lib/libxcvt*')
		fi
		# (run directly: the logging wrapper re-parses its arguments and would mangle the exclude globs)
		rsync -a --chown=root:root "${gpu_excludes[@]}" "${gpu_tmp}/" "${SDCARD}/" || exit_with_error "sun60iw2: installing GPU userspace failed"
		run_host_command_logged rm -rf "${gpu_tmp}"

		if [[ "${BUILD_DESKTOP}" == "yes" ]]; then
			display_alert "sun60iw2 desktop" "IMG-patched Xorg 1.21.1 + glamor on PowerVR" "info"
			# The patched Xorg (COMPOSITE enabled, IMG-aware glamor/modesetting) is ABI-tied to its own
			# modules; keep apt from swapping xserver-xorg-core underneath them.
			chroot_sdcard "apt-mark hold xserver-xorg-core"

			# This Xorg binary was built against bullseye and is dynamically linked against
			# libcrypto.so.1.1 (OpenSSL 1.1, EOL, dropped from trixie's own libssl3). Without it Xorg's
			# dynamic linker fails with "cannot open shared object file" and lightdm restarts it in a
			# crash loop. Fetch the exact bullseye-security build from Debian's snapshot archive, verify
			# it against its known sha1, and keep just the one .so in a directory of its own -- so it's
			# resolvable system-wide (this Xorg has no RPATH to point at it directly) without shadowing
			# the system's own (patched, OpenSSL 3) libcrypto for anything else that might look it up by
			# soname, since nothing else on a stock trixie image is linked against libcrypto.so.1.1.
			local ssl_deb="${SRC}/cache/sources/libssl1.1_1.1.1w-0+deb11u8_arm64.deb"
			local ssl_sha1="211e9b6e8030213a097192a1d3b83b99c71ceba3"
			if [[ ! -f "${ssl_deb}" ]] || [[ "$(sha1sum "${ssl_deb}" | cut -d' ' -f1)" != "${ssl_sha1}" ]]; then
				# mktemp, not a fixed "${ssl_deb}.tmp": concurrent builds share this cache dir, and a fixed
				# temp path would let them race on the same file.
				local ssl_tmp_deb
				ssl_tmp_deb="$(mktemp "${ssl_deb}.XXXXXX.tmp")" || exit_with_error "sun60iw2: could not create libssl1.1 temp file"
				run_host_command_logged curl -fsSL -o "${ssl_tmp_deb}" "https://snapshot.debian.org/file/${ssl_sha1}" || {
					run_host_command_logged rm -f "${ssl_tmp_deb}"
					exit_with_error "sun60iw2: could not download libssl1.1 (Xorg compat)"
				}
				if [[ "$(sha1sum "${ssl_tmp_deb}" | cut -d' ' -f1)" != "${ssl_sha1}" ]]; then
					run_host_command_logged rm -f "${ssl_tmp_deb}"
					exit_with_error "sun60iw2: libssl1.1 download does not match expected sha1 ${ssl_sha1}"
				fi
				run_host_command_logged mv "${ssl_tmp_deb}" "${ssl_deb}"
			fi
			local ssl_tmp="$(mktemp -d)"
			run_host_command_logged dpkg-deb -x "${ssl_deb}" "${ssl_tmp}"
			run_host_command_logged install -d "${SDCARD}/usr/lib/sun60iw2-xorg-compat"
			run_host_command_logged install -m 644 "${ssl_tmp}/usr/lib/aarch64-linux-gnu/libcrypto.so.1.1" "${SDCARD}/usr/lib/sun60iw2-xorg-compat/"
			run_host_command_logged rm -rf "${ssl_tmp}"
			echo "/usr/lib/sun60iw2-xorg-compat" > "${SDCARD}/etc/ld.so.conf.d/zz-sun60iw2-xorg-compat.conf"

			# lightdm expects this to already exist (it only enumerates it, never creates it); trixie's
			# lightdm postinst doesn't create it, so without this lightdm.service crash-loops on every
			# start ("Could not enumerate user data directory ... No such file or directory").
			# chroot_sdcard, not install -o/-g directly: the lightdm system user only exists inside the
			# target rootfs (created by lightdm's own postinst), not on the build host.
			chroot_sdcard "install -d -o lightdm -g lightdm -m 750 /var/lib/lightdm/data"
			[[ "${RELEASE}" =~ trixie|resolute|forky|sid ]] && echo 'GSK_RENDERER=cairo' >> "${SDCARD}/etc/environment"
			[[ "${RELEASE}" == "bullseye" ]] && echo 'QT_XCB_GL_INTEGRATION=none' >> "${SDCARD}/etc/environment"
			chroot_sdcard_apt_get_install libxcb-dri2-0 gstreamer1.0-x gstreamer1.0-alsa gstreamer1.0-plugins-bad mpv
		fi

		# The IMG libs sit in /usr/local/lib (Mesa-PVR EGL/GLES/GBM/Vulkan loader) and /usr/lib; they must win over the distro's.
		cat <<- 'EOF' > "${SDCARD}/etc/ld.so.conf.d/00-pvr-priority.conf"
			/usr/local/lib
			/usr/lib
		EOF
		mkdir -p "${SDCARD}/usr/share/vulkan/icd.d" "${SDCARD}/etc/OpenCL/vendors"
		cat <<- 'EOF' > "${SDCARD}/usr/share/vulkan/icd.d/img_icd.json"
			{
			    "file_format_version": "1.0.0",
			    "ICD": {
			        "library_path": "/usr/lib/libVK_IMG.so.1",
			        "api_version": "1.3.277"
			    }
			}
		EOF
		echo "/usr/lib/libPVROCL.so.1" > "${SDCARD}/etc/OpenCL/vendors/pvr.icd"

		chroot_sdcard_apt_get_install clinfo vulkan-tools
	fi

	if [[ "${npu}" == "yes" ]]; then
		display_alert "sun60iw2 NPU userspace" "VIPLite runtime + demos" "info"
		# The bundled libjpeg/libpng/opencv would shadow the distro's if put in /usr/lib, so they go in a
		# private dir that is searched *after* the system paths.
		run_host_command_logged mkdir -p "${SDCARD}/usr/lib/sun60iw2-npu" "${SDCARD}/usr/include" "${SDCARD}/opt"
		run_host_command_logged cp -a "${pkgs}"/npu/usr/lib/. "${SDCARD}/usr/lib/sun60iw2-npu/"
		run_host_command_logged cp -a "${pkgs}"/npu/usr/include/. "${SDCARD}/usr/include/"
		run_host_command_logged cp -a "${pkgs}"/npu/opt/. "${SDCARD}/opt/"
		echo "/usr/lib/sun60iw2-npu" > "${SDCARD}/etc/ld.so.conf.d/zz-sun60iw2-npu.conf"
	fi

	if [[ "${media}" == "yes" ]]; then
		display_alert "sun60iw2 media userspace" "CedarC (VE), AWIspApi, GStreamer OMX" "info"
		local -a media_debs=("${pkgs}"/bullseye/libcedarc/*.deb "${pkgs}"/bullseye/libAWIspApi/*.deb)
		local deb
		local -a media_in_chroot=()
		for deb in "${media_debs[@]}"; do
			[[ -f "${deb}" ]] || exit_with_error "sun60iw2: missing media package ${deb}"
			run_host_command_logged cp "${deb}" "${SDCARD}/tmp/"
			media_in_chroot+=("/tmp/$(basename "${deb}")")
		done
		# -o Dpkg::Options::=--force-overwrite: these vendor debs conflict on some already-installed files.
		chroot_sdcard_apt_get_install -o Dpkg::Options::=--force-overwrite "${media_in_chroot[@]}"
		run_host_command_logged rm -f "${SDCARD}"/tmp/libcedarc*.deb "${SDCARD}"/tmp/libAWIspApi*.deb

		# GStreamer OMX plugin backed by CedarC. Built against GStreamer 1.18 (bullseye); GStreamer only
		# requires a plugin's version to be <= the core's, so it loads on newer releases. Installed through
		# apt so the GStreamer runtime dependencies are pulled in.
		chroot_sdcard_apt_get_install gstreamer1.0-plugins-base gstreamer1.0-plugins-good
		local -a omx_debs=("${pkgs}"/bullseye/gst-omx-generic1.0/gstreamer1.0-omx-allwinner_*.deb
			"${pkgs}"/bullseye/gst-omx-generic1.0/gstreamer1.0-omx-allwinner-config_*.deb
			"${pkgs}"/bullseye/gst-omx-generic1.0/gst-omx-listcomponents_*.deb)
		local -a omx_in_chroot=()
		for deb in "${omx_debs[@]}"; do
			[[ -f "${deb}" ]] || exit_with_error "sun60iw2: missing media package ${deb}"
			run_host_command_logged cp "${deb}" "${SDCARD}/tmp/"
			omx_in_chroot+=("/tmp/$(basename "${deb}")")
		done
		chroot_sdcard_apt_get_install "${omx_in_chroot[@]}"
		run_host_command_logged rm -f "${SDCARD}"/tmp/gst*omx*.deb "${SDCARD}"/tmp/gst-omx*.deb

		[[ "${BUILD_DESKTOP}" == "yes" && -f "${SDCARD}/etc/cedarc.conf" ]] &&
			sed -i 's/enable_scaledown_while_4k = 1/enable_scaledown_while_4k = 0/' "${SDCARD}/etc/cedarc.conf"

		# Camera tools from orangepi-build: the CSI capture test and the libAWIspApi + OpenCV demo, shipped as
		# source (build it on the board after installing libopencv-dev). The X preview script needs a desktop.
		display_alert "sun60iw2 camera tools" "csi_test_mplane, v4l2_opencv_demo" "info"
		sun60iw2_fetch_opi_bsp
		local bsp="${SUN60IW2_OPI_BSP_DIR}/external/packages/bsp/sun60iw2"
		run_host_command_logged install -D -m 0755 "${bsp}/usr/bin/csi_test_mplane" "${SDCARD}/usr/bin/csi_test_mplane"
		run_host_command_logged cp -a "${bsp}/opt/v4l2_opencv_demo" "${SDCARD}/opt/"
		run_host_command_logged chown -R root:root "${SDCARD}/opt/v4l2_opencv_demo"
		[[ "${BUILD_DESKTOP}" == "yes" ]] &&
			run_host_command_logged install -D -m 0755 "${bsp}/usr/local/bin/test_camera.sh" "${SDCARD}/usr/local/bin/test_camera.sh"
	fi

	# Device node permissions so non-root users can use the GPU / NPU / VE / G2D.
	# GROUP="video"/"render", not MODE="0666": scope access to the groups the default desktop user is
	# already a member of, rather than every local account (both groups are always present on Debian).
	cat <<- 'EOF' > "${SDCARD}/etc/udev/rules.d/99-sun60iw2-permissions.rules"
		KERNEL=="system", SUBSYSTEM=="dma_heap", GROUP="video", MODE="0660"
		KERNEL=="reserved", SUBSYSTEM=="dma_heap", GROUP="video", MODE="0660"
		KERNEL=="sunxi_soc_info", GROUP="video", MODE="0660"
		KERNEL=="renderD128", SUBSYSTEM=="drm", GROUP="render", MODE="0660"
		KERNEL=="cedar_dev", GROUP="video", MODE="0660"
		KERNEL=="cedar_dev_ve2", GROUP="video", MODE="0660"
		KERNEL=="g2d", GROUP="video", MODE="0660"
		KERNEL=="vipcore", GROUP="video", MODE="0660"
	EOF

	chroot_sdcard ldconfig
}
