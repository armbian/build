ARCH=armhf
BOOTSOURCE="${MAINLINE_UBOOT_SOURCE}"
BOOTDIR='u-boot-odroid'
BOOTBRANCH='tag:v2026.07'
BOOTCONFIG='odroid_defconfig'
BOOTSCRIPT='boot-odroid-u2.cmd:boot.cmd'
BOOTENV_FILE='odroidu2.txt'
UBOOT_TARGET_MAP=";;bl1.HardKernel bl2.HardKernel u-boot-dtb.bin tzsw.HardKernel"

case $BRANCH in
	current)
		declare -g KERNEL_MAJOR_MINOR="6.18"
		;;

	edge)
		declare -g KERNEL_MAJOR_MINOR="7.3"
		;;
esac

KERNELPATCHDIR="archive/odroidu2-${KERNEL_MAJOR_MINOR}"
KERNEL_BTF="no"

CPUMIN=200000
CPUMAX=1704000
GOVERNOR=ondemand
SERIALCON=ttySAC1

function uboot_custom_postprocess() {
	# BL1, BL2 and the TrustZone software from Hardkernel, which the boot ROM
	# needs to start U-Boot
	local blobs_dir="${SRC}/cache/sources/odroidu2-blobs"
	local blobs_url="https://raw.githubusercontent.com/hardkernel/u-boot/136cae0717c9778dab5fb0cf6d35f65a0a9ec8c5/sd_fuse"
	declare -A blob_hashes=(
		["bl1.HardKernel"]="44d9ed14fbb3cc48080685aed658b6cba4d48458ee8bdeb97f4b23b659826b22"
		["bl2.HardKernel"]="11206900ff8a16b834eb22954ab027113671bc83d5ce0d8af64d13364461bd32"
		["tzsw.HardKernel"]="0865c9c82b0e4bb514bff393554d01aca2f38d72572a92dc08e49fa1d8d77ebc"
	)
	mkdir -p "${blobs_dir}"

	for blob in "${!blob_hashes[@]}"; do
		if ! echo "${blob_hashes[$blob]}  ${blobs_dir}/${blob}" | sha256sum -c --status 2>/dev/null; then
			display_alert "Downloading Exynos4412 boot blob" "${blob}" "info"
			curl -sLf -o "${blobs_dir}/${blob}" "${blobs_url}/${blob}" || exit_with_error "Failed to download ${blob}"
			echo "${blob_hashes[$blob]}  ${blobs_dir}/${blob}" | sha256sum -c --status || exit_with_error "SHA256 mismatch for ${blob}"
		fi
		cp -f "${blobs_dir}/${blob}" .
	done
}

function write_uboot_platform() {
	local src_dir=$1 device=$2 ro_file="" rc=0 blob
	# Block offsets from doc/README.odroid in U-Boot: the boot ROM reads BL1
	# from sector 1 of an SD card, but from sector 0 of the eMMC boot partition
	local bl1=1 bl2=31 uboot=63 tzsw=2111

	for blob in bl1.HardKernel bl2.HardKernel u-boot-dtb.bin tzsw.HardKernel; do
		if [[ ! -s $src_dir/$blob ]]; then
			echo "Missing ${src_dir}/${blob}, U-Boot is not written" >&2
			return 1
		fi
	done
	if (($(stat -c %s "$src_dir/u-boot-dtb.bin") > (tzsw - uboot) * 512)); then
		echo "${src_dir}/u-boot-dtb.bin would overwrite the TrustZone software, U-Boot is not written" >&2
		return 1
	fi

	if [[ $device == /dev/mmcblk* && -b ${device}boot0 ]]; then
		device=${device}boot0
		bl1=0 bl2=30 uboot=62 tzsw=2110
		# The kernel makes the boot partitions read-only
		ro_file=/sys/block/${device#/dev/}/force_ro
		if ! echo 0 > "$ro_file" || [[ $(< "$ro_file") != 0 ]]; then
			echo "Cannot make ${device} writable, U-Boot is not written" >&2
			return 1
		fi
	fi

	dd if="$src_dir/bl1.HardKernel" of="$device" bs=512 seek=$bl1 conv=fsync status=none &&
		dd if="$src_dir/bl2.HardKernel" of="$device" bs=512 seek=$bl2 conv=fsync status=none &&
		dd if="$src_dir/u-boot-dtb.bin" of="$device" bs=512 seek=$uboot conv=fsync status=none &&
		dd if="$src_dir/tzsw.HardKernel" of="$device" bs=512 seek=$tzsw conv=fsync status=none || rc=1

	[[ -n $ro_file ]] && echo 1 > "$ro_file"
	sync
	if ((rc != 0)); then
		echo "Writing U-Boot to ${device} failed, the board may not boot" >&2
	fi
	return $rc
}
