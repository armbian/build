# Seeed Studio reComputer RK3576 family configuration.
#
# Boards in this family: recomputer-rk3576-devkit, recomputer-rk3576-industrial.
# They share the same RK3576 SoM, so the shared vendor-branch tweaks and the
# mainline U-Boot machinery live here, parametrized by board-level variables:
#   RECOMPUTER_MAINLINE_BOOTCONFIG — defconfig name in patch/u-boot/v2026.07/defconfig/
#   RECOMPUTER_UBOOT_DTSI_BASE     — base name of the -u-boot.dtsi in patch/u-boot/v2026.07/dt_uboot/
#   BOOT_SUPPORT_SPI               — "yes": SPI NOR on board (env in SPI, SPI image, MTD writer);
#                                    unset: eMMC-only carrier (env in eMMC, block writer)
#   RECOMPUTER_GPU_STACK           — "panfrost" (default) or "mali" for the closed blob
#
# shellcheck source=config/sources/families/include/rockchip64_common.inc
source "${BASH_SOURCE%/*}/include/rockchip64_common.inc"

BOOTSOURCE='https://github.com/radxa/u-boot.git'
BOOTBRANCH='branch:next-dev-v2024.10'
BOOTPATCHDIR="legacy/u-boot-radxa-rk35xx legacy/u-boot-radxa-rk35xx-v2024.10" # v2024.10 dir: patches that need the newer Radxa branch (not 2024.03 boards)
OVERLAY_PREFIX='seeed-rk3576'

case $BRANCH in

	vendor)
		BOOTSCRIPT='boot-seeed-rk35xx.cmd:boot.cmd'
		BOOTDIR='u-boot-rockchip64'
		declare -g KERNEL_MAJOR_MINOR="6.1"    # Major and minor versions of this kernel.
		declare -g -i KERNEL_GIT_CACHE_TTL=120 # 2 minutes; this is a high-traffic repo
		KERNELSOURCE='https://github.com/armbian/linux-rockchip.git'
		KERNELBRANCH='branch:rk-6.1-rkr7.2'
		KERNELPATCHDIR='rk35xx-vendor-6.1'
		LINUXFAMILY=seeed-rk3576
		LINUXCONFIG=linux-seeed-rk3576-vendor
		;;

	*)
		# Mainline branches: both boards share the same SoM, so the same blobs.
		declare -g DDR_BLOB="rk35/rk3576_ddr_lp4_2112MHz_lp5_2736MHz_v1.12.bin"
		declare -g BL31_BLOB="rk35/rk3576_bl31_v1.24.elf"
		;;
esac

prepare_boot_configuration

pre_config_uboot_target__warn_modern_hosts() {
	# Check if building Radxa U-Boot on a host other than Ubuntu Jammy
	if [[ "${BOOTSOURCE}" == "https://github.com/radxa/u-boot.git" ]]; then
		if [[ "${HOSTRELEASE}" != "jammy" ]]; then
			display_alert "Building Rockchip BSP U-Boot from Radxa repository" "on Ubuntu ${HOSTRELEASE} (newer than Jammy) can lead to unintended bugs" "wrn"
		fi
	fi
}

family_tweaks_bsp() {
	:
}

#### vendor-branch tweaks shared by both boards ###################################################

# Install Mali-G52 userspace library for GPU hardware acceleration.
# Skipped when RECOMPUTER_GPU_STACK=panfrost: panfrost kernel driver exposes
# /dev/dri/renderDxxx directly and Mesa's libgl1-mesa-dri provides the DRI
# backend — libmali blob would only get in the way (intercepts libEGL.so.1
# symlink, deletes mesa's libEGL.so.1.1.0 .so file).
function pre_install_distribution_specific__recomputer_rk3576_install_libmali() {
	[[ "${BRANCH}" == "vendor" ]] || return 0 # only for BRANCH=vendor
	if [[ "${RECOMPUTER_GPU_STACK:-mali}" == "panfrost" ]]; then
		display_alert "Skipping Mali GPU libraries" "Using Panfrost/Mesa userspace" "info"
		return 0
	fi

	display_alert "Installing Mali GPU libraries from APT repo" "libmali-g52" "info"

	seeed_recomputer_install_from_apt libmali-bifrost-g52-g24p0-x11-wayland-gbm
	chroot_sdcard ldconfig
}

# Audio naming: HDMI0, DP0, ES8311 (same sound cards on both boards)
function post_family_tweaks__recomputer_rk3576_naming_audios() {
	[[ "${BRANCH}" == "vendor" ]] || return 0 # only for BRANCH=vendor
	display_alert "$BOARD" "Renaming recomputer-rk3576 audios" "info"

	mkdir -p "${SDCARD}/etc/udev/rules.d/"
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-hdmi0-sound", ENV{SOUND_DESCRIPTION}="HDMI0 Audio"' > "${SDCARD}/etc/udev/rules.d/90-naming-audios.rules"
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-dp0-sound", ENV{SOUND_DESCRIPTION}="DP0 Audio"' >> "${SDCARD}/etc/udev/rules.d/90-naming-audios.rules"
	echo 'SUBSYSTEM=="sound", ENV{ID_PATH}=="platform-es8311-sound", ENV{SOUND_DESCRIPTION}="ES8311 Audio"' >> "${SDCARD}/etc/udev/rules.d/90-naming-audios.rules"
}

# GDM — force X11 only when running the closed Mali blob (Mutter Wayland
# SIGSEGV with it). With panfrost + Mesa, Wayland works and is preferred.
function post_family_tweaks__recomputer_rk3576_gdm_config() {
	[[ "${BRANCH}" == "vendor" ]] || return 0 # only for BRANCH=vendor
	if [[ "${RECOMPUTER_GPU_STACK:-mali}" == "panfrost" ]]; then
		display_alert "$BOARD" "Skipping GDM X11 override (panfrost supports Wayland)" "info"
		return 0
	fi

	display_alert "$BOARD" "Configuring GDM for X11" "info"

	mkdir -p "${SDCARD}"/etc/gdm3/
	cat > "${SDCARD}"/etc/gdm3/custom.conf <<- 'EOF'
		[daemon]
		WaylandEnable=false

		[security]

		[xdmcp]

		[chooser]

		[debug]
	EOF
}

# Disable suspend and hibernation
# Even more important on the industrial carrier: it has an external SGM706B
# watchdog that resets the board within 1.6s if RST_WDI stops toggling.
function post_family_tweaks__recomputer_rk3576_disable_suspend() {
	display_alert "$BOARD" "Disabling suspend and hibernation" "info"

	mkdir -p "${SDCARD}"/etc/systemd/sleep.conf.d
	cat > "${SDCARD}"/etc/systemd/sleep.conf.d/nosuspend.conf <<- 'EOF'
		[Sleep]
		AllowSuspend=no
		AllowHibernation=no
		AllowSuspendThenHibernate=no
		AllowHybridSleep=no
	EOF
}

#### mainline u-boot for non-vendor branches <==--------------------------------------------------

# Mainline U-Boot. See the variables documented at the top of this file.
function post_family_config__recomputer_rk3576_use_mainline_uboot() {
	[[ "${BRANCH}" == "vendor" ]] && return 0 # only for mainline branches

	display_alert "$BOARD" "Using mainline U-Boot for $BOARD / $BRANCH" "info"

	[[ -n "${RECOMPUTER_MAINLINE_BOOTCONFIG}" ]] || exit_with_error "RECOMPUTER_MAINLINE_BOOTCONFIG is not set in the board config"
	declare -g BOOTCONFIG="${RECOMPUTER_MAINLINE_BOOTCONFIG}"
	declare -g BOOTDELAY=1
	declare -g BOOTSOURCE="https://github.com/u-boot/u-boot.git"
	declare -g BOOTBRANCH="tag:v2026.07"
	declare -g BOOTPATCHDIR="v2026.07"

	# Binman produces the eMMC/SD image; boards with SPI NOR also get the SPI image
	declare -g UBOOT_TARGET_MAP="BL31=${RKBIN_DIR}/${BL31_BLOB} ROCKCHIP_TPL=${RKBIN_DIR}/${DDR_BLOB};;u-boot-rockchip.bin"
	if [[ "${BOOT_SUPPORT_SPI}" == "yes" ]]; then
		declare -g UBOOT_TARGET_MAP="${UBOOT_TARGET_MAP} u-boot-rockchip-spi.bin"
	fi

	# Disable vendor-specific postprocessing; binman does all the work
	unset uboot_custom_postprocess write_uboot_platform write_uboot_platform_mtd

	# Just use the binman-provided u-boot-rockchip.bin, which is ready-to-go
	function write_uboot_platform() {
		dd "if=$1/u-boot-rockchip.bin" "of=$2" bs=32k seek=1 conv=notrunc status=none
	}

	# Boards with SPI NOR can also be flashed via MTD
	if [[ "${BOOT_SUPPORT_SPI}" == "yes" ]]; then
		function write_uboot_platform_mtd() {
			flashcp -v -p "$1/u-boot-rockchip-spi.bin" /dev/mtd0
		}
	fi
}

# Environment storage and misc extras for mainline U-Boot. Boards with SPI NOR
# keep the env in SPI flash; eMMC-only boards keep it in eMMC, in the gap
# between u-boot proper (ends well before 5 MiB) and the first partition
# (16 MiB, OFFSET=16).
function post_config_uboot_target__recomputer_rk3576_enable_env_and_fancy() {
	[[ "${BRANCH}" == "vendor" ]] && return 0 # only for mainline branches

	display_alert "mainline u-boot" "Extra mainline u-boot configs for ${BOARD}/${BRANCH}" "info"

	if [[ "${BOOT_SUPPORT_SPI}" == "yes" ]]; then
		display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: environment in SPI flash" "info"
		run_host_command_logged scripts/config --set-val CONFIG_ENV_IS_NOWHERE "n"
		run_host_command_logged scripts/config --set-val CONFIG_ENV_IS_IN_SPI_FLASH "y"
		run_host_command_logged scripts/config --set-val CONFIG_ENV_SECT_SIZE_AUTO "y"
		run_host_command_logged scripts/config --set-val CONFIG_ENV_OVERWRITE "y"
		run_host_command_logged scripts/config --set-val CONFIG_ENV_SIZE "0x20000"
		run_host_command_logged scripts/config --set-val CONFIG_ENV_OFFSET "0xc00000"
	else
		display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: environment in eMMC at 8 MiB" "info"
		run_host_command_logged scripts/config --set-val CONFIG_ENV_IS_NOWHERE "n"
		run_host_command_logged scripts/config --set-val CONFIG_ENV_IS_IN_MMC "y"
		run_host_command_logged scripts/config --set-val CONFIG_ENV_OVERWRITE "y"
		run_host_command_logged scripts/config --set-val CONFIG_ENV_SIZE "0x20000"
		run_host_command_logged scripts/config --set-val CONFIG_ENV_OFFSET "0x800000"
	fi

	# LED nodes come from the SoM gpio-expander (directly in the devkit DT,
	# inherited via the include on the industrial overlay)
	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable preboot & flash user LED in preboot" "info"
	run_host_command_logged scripts/config --enable CONFIG_USE_PREBOOT
	run_host_command_logged scripts/config --set-str CONFIG_PREBOOT "'led red:indicator on; sleep 0.1; led red:indicator off; led blue:heartbeat on; sleep 0.1; led blue:heartbeat off; led green:indicator on; sleep 0.1; led green:indicator off;'" # double quotes required due to run_host_command_logged's quirks

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable EFI debugging commands" "info"
	run_host_command_logged scripts/config --enable CMD_EFIDEBUG
	run_host_command_logged scripts/config --enable CMD_NVEDIT_EFI

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable more filesystems support" "info"
	run_host_command_logged scripts/config --enable CONFIG_CMD_BTRFS

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable more compression support" "info"
	run_host_command_logged scripts/config --enable CONFIG_LZO
	run_host_command_logged scripts/config --enable CONFIG_BZIP2
	run_host_command_logged scripts/config --enable CONFIG_ZSTD

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable gpio LED support" "info"
	run_host_command_logged scripts/config --enable CONFIG_LED
	run_host_command_logged scripts/config --enable CONFIG_LED_GPIO

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable networking cmds" "info"
	run_host_command_logged scripts/config --enable CONFIG_CMD_NFS
	run_host_command_logged scripts/config --enable CONFIG_CMD_WGET
	run_host_command_logged scripts/config --enable CONFIG_CMD_DNS
	run_host_command_logged scripts/config --enable CONFIG_PROT_TCP
	run_host_command_logged scripts/config --enable CONFIG_PROT_TCP_SACK

	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable LWIP (new networking stack)" "info"
	run_host_command_logged scripts/config --enable CONFIG_CMD_MII
	run_host_command_logged scripts/config --enable CONFIG_NET_LWIP

	# UMS, RockUSB, gadget stuff
	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: enable UMS/RockUSB gadget" "info"
	declare -a enable_configs=("CONFIG_CMD_USB_MASS_STORAGE" "CONFIG_USB_GADGET" "USB_GADGET_DOWNLOAD" "CONFIG_USB_FUNCTION_ROCKUSB" "CONFIG_USB_FUNCTION_ACM" "CONFIG_CMD_ROCKUSB")
	for config in "${enable_configs[@]}"; do
		run_host_command_logged scripts/config --enable "${config}"
	done
	# Auto-enabled by the above, force off...
	run_host_command_logged scripts/config --disable USB_FUNCTION_FASTBOOT

	return 0
}

function pre_config_uboot_target__recomputer_rk3576_patch_uboot_dtsi_for_ums() {
	[[ "${BRANCH}" == "vendor" ]] && return 0 # Not for 'vendor' branch, which uses 2017.09 vendor u-boot from Radxa

	[[ -n "${RECOMPUTER_UBOOT_DTSI_BASE}" ]] || exit_with_error "RECOMPUTER_UBOOT_DTSI_BASE is not set in the board config"
	display_alert "u-boot for ${BOARD}" "u-boot: add to u-boot dtsi for UMS" "info" # avoid a patch, just append to the dtsi file
	# Append to the board's u-boot dtsi file with stuff for enabling gadget/otg/peripheral mode
	cat <<- EOD >> "arch/arm/dts/${RECOMPUTER_UBOOT_DTSI_BASE}-u-boot.dtsi"
		&usb_drd0_dwc3 {
			dr_mode = "peripheral";
			maximum-speed = "high-speed";
			phys = <&u2phy0_otg>;
			phy-names = "usb2-phy";
			status = "okay";
		};
	EOD
}

# "rockchip-common: boot eMMC first, then NVMe, then USB, then NET"
# mmc0 is the board's primary boot medium: the SD slot on the devkit, the
# eMMC on the industrial carrier (alias remapped in its DT — no SD slot);
# both carriers have an M.2 NVMe slot.
function pre_config_uboot_target__recomputer_rk3576_boot_order() {
	[[ "${BRANCH}" == "vendor" ]] && return 0 # only for mainline branches

	declare -a rockchip_uboot_targets=("mmc0" "nvme" "usb" "pxe" "dhcp")
	display_alert "u-boot for ${BOARD}/${BRANCH}" "u-boot: adjust boot order to '${rockchip_uboot_targets[*]}'" "info"
	sed -i -e "s/#define BOOT_TARGETS.*/#define BOOT_TARGETS \"${rockchip_uboot_targets[*]}\"/" include/configs/rockchip-common.h
	regular_git diff -u include/configs/rockchip-common.h || true
}

# Include fw_setenv, configured to point to the env storage chosen above
function post_family_tweaks__recomputer_rk3576_fw_env_config() {
	[[ "${BRANCH}" == "vendor" ]] && return 0 # Not for 'vendor' branch, which uses 2017.09 vendor u-boot from Radxa
	display_alert "Configuring fw_printenv and fw_setenv" "for ${BOARD} and u-boot ${BOOTBRANCH}" "info"
	# Addresses below come from CONFIG_ENV_OFFSET and CONFIG_ENV_SIZE set in
	# post_config_uboot_target__recomputer_rk3576_enable_env_and_fancy
	if [[ "${BOOT_SUPPORT_SPI}" == "yes" ]]; then
		cat <<- 'FW_ENV_CONFIG' > "${SDCARD}"/etc/fw_env.config
			# MTD/SPI u-boot env for the reComputer RK3576 boards
			# MTD device name Device offset Env. size Flash sector size Number of sectors
			/dev/mtd0         0xc00000      0x20000
		FW_ENV_CONFIG
	else
		# eMMC is the only MMC device on the industrial board, so it is always /dev/mmcblk0
		cat <<- 'FW_ENV_CONFIG' > "${SDCARD}"/etc/fw_env.config
			# eMMC u-boot env for the reComputer Industrial RK3576
			# Block device  Device offset  Env. size
			/dev/mmcblk0    0x800000       0x20000
		FW_ENV_CONFIG
	fi
}
