# Altera Agilex 5 SoC FPGA (Cortex-A55 + Cortex-A76 HPS)
#
# SD boot matches the Altera HPS Linux boot guide for the E-Series Premium
# Development Kit: the Secure Device Manager loads U-Boot SPL from QSPI
# (spl/u-boot-spl-dtb.hex merged into the .sof/.jic), and SPL then loads
# u-boot.itb from the FAT boot partition. The image does not contain a
# raw SPL. Program QSPI with Quartus before the SD card will boot.
#

declare -g ARCH="arm64"
declare -g LINUXFAMILY="agilex5"
declare -g KERNEL_IMAGE_TYPE="Image"
declare -g BOOTDELAY=1
declare -g BOOTFS_TYPE="fat"
declare -g BOOTSIZE="512"
declare -g IMAGE_PARTITION_TABLE="msdos"
declare -g EXTRAWIFI="no"

# QPDS 26.1 validated trio: ATF socfpga_v2.14.0, U-Boot socfpga_v2026.01,
# Linux socfpga-6.18.2-lts. Tags are the release markers, not the branch names.
declare -g ATFSOURCE="https://github.com/altera-fpga/arm-trusted-firmware"
declare -g ATFDIR="arm-trusted-firmware-agilex5"
declare -g ATFBRANCH="tag:QPDS26.1_REL_GSRD_PR"
declare -g ATFPATCHDIR="atf-agilex5"
declare -g ATF_TARGET_MAP="PLAT=agilex5 bl31;;build/agilex5/release/bl31.bin"

declare -g BOOTSOURCE="https://github.com/altera-fpga/u-boot-socfpga"
declare -g BOOTDIR="u-boot-socfpga"
declare -g BOOTBRANCH="tag:QPDS26.1_REL_GSRD_PR"
declare -g BOOTPATCHDIR="u-boot-agilex5"
declare -g BOOTCONFIG="${BOOTCONFIG:-socfpga_agilex5_defconfig}"
declare -g UBOOT_TARGET_MAP=";;u-boot.itb spl/u-boot-spl-dtb.hex:u-boot-spl-dtb.hex"
declare -g BOOTSCRIPT="boot-agilex5.cmd:boot.cmd"
declare -g BOOTENV_FILE="agilex5.txt"

case "${BRANCH}" in
	current)
		declare -g KERNELSOURCE="https://github.com/altera-fpga/linux-socfpga"
		declare -g KERNELBRANCH="tag:QPDS26.1_REL_GSRD_PR"
		declare -g KERNEL_MAJOR_MINOR="6.18"
		declare -g KERNELPATCHDIR="archive/agilex5-${KERNEL_MAJOR_MINOR}"
		declare -g LINUXCONFIG="linux-${LINUXFAMILY}-${BRANCH}"
		;;
esac

# Distro boot's default load addresses sit below Agilex 5 DRAM (0x80000000).
# Source the Armbian script from a DRAM address instead, and do not probe NAND.
function post_config_uboot_target__agilex5_sd_boot() {
	display_alert "Agilex 5 U-Boot" "SD boot script, NAND/UBI disabled" "info"

	local -a disable_opts=(
		DISTRO_DEFAULTS
		NAND_BOOT
		SPL_NAND_SUPPORT
		CMD_NAND_TRIMFFS
		CMD_NAND_LOCK_UNLOCK
		NAND_DENALI_DT
		SYS_NAND_U_BOOT_LOCATIONS
		SPL_NAND_FRAMEWORK
		CMD_NAND
		MTD_RAW_NAND
		CMD_UBI
		CMD_UBIFS
		MTD_UBI
		ENV_IS_IN_UBI
		UBI_SILENCE_MSG
		UBIFS_SILENCE_MSG
	)
	local opt
	for opt in "${disable_opts[@]}"; do
		./scripts/config --disable "${opt}"
	done

	./scripts/config --enable HUSH_PARSER
	./scripts/config --enable USE_BOOTCOMMAND
	./scripts/config --set-str BOOTCOMMAND "load mmc 0:1 0x81000000 boot.scr; source 0x81000000"
	./scripts/config --set-str BOOTARGS "console=ttyS0,115200 earlycon"
	./scripts/config --enable CMD_FAT
	./scripts/config --enable CMD_FS_GENERIC
	./scripts/config --enable DOS_PARTITION
	./scripts/config --enable SPL_DOS_PARTITION
	./scripts/config --enable CMD_PART
	./scripts/config --enable ENV_IS_IN_FAT
}

function post_create_partitions() {
	display_alert "Agilex 5" "mark FAT boot partition bootable" "debug"
	run_host_command_logged parted "${SDCARD}".raw set 1 boot on
}

function write_uboot_platform() {
	# SPL (in QSPI) reads these from the FAT boot partition. $2 is the whole
	# disk and is not a raw SPL target. During image build, MOUNT is the
	# loop mount; on a running board, copy onto /boot.
	local dest="${MOUNT:+${MOUNT}/boot}"
	[[ -z "${dest}" || ! -d "${dest}" ]] && dest="/boot"
	[[ -d "${dest}" ]] || {
		echo "write_uboot_platform: boot directory not found" >&2
		return 1
	}
	[[ -f "$1/u-boot.itb" ]] || {
		echo "write_uboot_platform: missing $1/u-boot.itb" >&2
		return 1
	}
	cp "$1/u-boot.itb" "${dest}/u-boot.itb"
	[[ -f "$1/u-boot-spl-dtb.hex" ]] && cp "$1/u-boot-spl-dtb.hex" "${dest}/u-boot-spl-dtb.hex"
}
