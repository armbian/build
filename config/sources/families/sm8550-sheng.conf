# Xiaomi Pad 6S Pro (sheng) customized sub-family config

declare -g LINUXFAMILY="sm8550-sheng"
declare -g OVERLAY_DIR="/boot/dtb/qcom/overlay"
declare -g ARCH="arm64"
declare -g BOOTENV_FILE="qcom-abl.txt"
enable_extension "image-output-abl"

# Kernel is maintained in a separate tree.
declare -g KERNELSOURCE="https://github.com/map220v/sm8550-mainline.git"

case $BRANCH in
	edge)
		declare -g KERNELSOURCE="https://github.com/ianchb/sm8550-mainline.git"
		declare -g KERNELBRANCH='branch:sheng-7.1.8'
		declare -g KERNEL_MAJOR_MINOR="7.1"
		declare -g LINUXCONFIG="linux-sm8550-sheng-edge"
		;;

	bleedingedge)
		declare -g KERNELSOURCE="https://github.com/map220v/sm8550-mainline.git"
		declare -g KERNELBRANCH='branch:sheng-7.2'
		declare -g KERNEL_MAJOR_MINOR="7.2"
		declare -g LINUXCONFIG="linux-sm8550-sheng-bleedingedge"
		;;

esac

# Build the kernel with clang/LLVM. Use KERNEL_COMPILER (scoped to the kernel
# make, passed as LLVM=1 under `env -i`) rather than exporting CC/LLVM globally:
# a global export leaks into the image-assembly chroot, where the linux-headers
# postinst's `make scripts` then invokes clang (not installed in the rootfs -
# the headers package Depends on gcc) and fails with "clang: not found".
declare -g KERNEL_COMPILER="clang"
