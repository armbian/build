source "${BASH_SOURCE%/*}/include/sunxi64_common.inc"

# A527 and T527 boards get both SoC prefixes, their own first; see config/boards/README.md.
case "${OVERLAY_PREFIX}" in
	sun55i-a527) OVERLAY_PREFIX="sun55i-a527 sun55i-t527" ;;
	sun55i-t527 | "") OVERLAY_PREFIX="sun55i-t527 sun55i-a527" ;;
esac

declare -g ATFSOURCE='https://github.com/jernejsk/arm-trusted-firmware'
declare -g ATF_TARGET_MAP="PLAT=sun55i_a523 DEBUG=1;;build/sun55i_a523/debug/bl31.bin"
declare -g ATFBRANCH="branch:a523-v4"
