source "${BASH_SOURCE%/*}/include/sunxi64_common.inc"

declare -g ATFSOURCE='https://github.com/jernejsk/arm-trusted-firmware'
declare -g ATF_TARGET_MAP="PLAT=sun55i_a523 DEBUG=1;;build/sun55i_a523/debug/bl31.bin"
declare -g ATFBRANCH="branch:a523-v4"

# The DE33 RCQ backend stages the primary UI channel; the cursor plane
# (channel 8, per-channel OVL/blender) framebuffer fetch returns black, so a
# hardware cursor on boards with video output renders as a black square and
# the pointer is invisible (it still works). Force a software cursor via
# modesetting until the channel-8 fetch is fixed. See https://github.com/armbian/build/pull/10587
post_family_tweaks_bsp__sun55iw3_swcursor() {
	[[ "${HAS_VIDEO_OUTPUT:-no}" == "yes" ]] || return 0
	display_alert "$BOARD" "Installing Xorg SWcursor tweaks (DE33 RCQ brings up a black cursor plane)" "info"
	mkdir -p "${destination}"/etc/X11/xorg.conf.d
	cat > "${destination}"/etc/X11/xorg.conf.d/90-sun55iw3-swcursor.conf <<- EOT
		# sun55iw3 DE33: the hardware cursor plane (channel 8) fetches black,
		# rendering an invisible cursor plus a black square around the pointer.
		# Force a software cursor until the channel-8 framebuffer fetch is fixed.
		Section "Device"
		        Identifier "card0"
		        Driver "modesetting"
		        Option "SWcursor" "true"
		EndSection
	EOT
}
