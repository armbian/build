# OnePlus 10 Pro (negroni) customized SM8450 sub-family config

declare -g LINUXFAMILY="sm8450-negroni"
declare -g ARCH="arm64"

case $BRANCH in
	edge)
		# Kernel is maintained in a separate SM8450 mainline tree.
		declare -g KERNELSOURCE="https://github.com/withsalt/linux.git"
		declare -g KERNELBRANCH="commit:6732cbb2b0b1559f0551329047a30bcca4d27883"
		declare -g KERNEL_MAJOR_MINOR="7.3"
		;;

esac

# The boot image must end before the stock AVB metadata in boot_b; BTF makes it too large.
declare -g KERNEL_BTF="${KERNEL_BTF:-no}"
