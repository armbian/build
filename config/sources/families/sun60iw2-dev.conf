# Allwinner A733 (sun60iw2) development family.
# Keep this family separate until mainline support moves to a common family.

declare -g LINUXFAMILY="sun60iw2-dev"
declare -g ARCH="arm64"
declare -g ATFSOURCE='https://github.com/jernejsk/arm-trusted-firmware'
declare -g ATFBRANCH='branch:a733'
declare -g ATFDIR='arm-trusted-firmware-sun60iw2-dev'
declare -g ATFPATCHDIR='atf-sun60iw2-dev'
declare -g ATF_TARGET_MAP="PLAT=sun60i_a733 DEBUG=1 bl31;;build/sun60i_a733/debug/bl31.bin"
declare -g ATF_COMPILE="yes"
declare -g INSTALL_HEADERS="yes"

declare -g INITRD_ARCH="arm"
declare -g SERIALCON="ttyS0"
declare -g BOOTSCRIPT="boot-sun60iw2-dev.cmd:boot.cmd"
declare -g BOOTENV_FILE="sun60iw2.txt"
declare -g OFFSET=32

KERNEL_DRIVERS_SKIP+=(driver_rtl8723cs)

# The in-tree AIC8800 driver provides the BSP symbols. An out-of-tree DKMS
# driver would shadow them and break fdrv with "Unknown symbol".
[[ -z "${MODULES}" ]] && declare -g MODULES="aic8800_bsp aic8800_fdrv aic8800_btlpm"

# Use Jernej Skrabec's A733 tree as the source of truth. Local patches add
# only Cubie A7A board fixups. Keep dcdc8 as described in the base DTS.
declare -g KERNELSOURCE="https://github.com/jernejsk/linux-1.git"
declare -g KERNELBRANCH="branch:a733-display-wip"
declare -g KERNEL_MAJOR_MINOR="7.3"
declare -g LINUXCONFIG="linux-sun60iw2-dev-7.3"
declare -g KERNELPATCHDIR="sun60iw2-dev"
declare -g OVERLAY_PREFIX="sun60i-a733"

declare -g BOOTSOURCE="https://source.denx.de/u-boot/u-boot.git"
declare -g BOOTBRANCH="tag:v2026.07"
declare -g BOOTDIR="u-boot-sun60iw2-dev"
declare -g BOOTPATCHDIR="v2026.07-sun60iw2-dev"
declare -g BOOTCONFIG="${BOOTCONFIG_DEV:-orangepi_4_pro_defconfig}"
declare -g UBOOT_COMPILER="aarch64-linux-gnu-"
declare -g UBOOT_TARGET_MAP="BINMAN_ALLOW_MISSING=1 BL31=bl31.bin;;u-boot-sunxi-with-spl.bin"

declare -g OVERLAY_DIR="/boot/dtb/allwinner/overlay"

# Video output works without GPU acceleration, but no mainline HDMI driver
# exists yet. HAS_VIDEO_OUTPUT="no" stays in the board config.
declare -g FULL_DESKTOP="no"

function add_host_dependencies__sun60iw2_dev_uboot_xxd() {
	declare -g EXTRA_BUILD_DEPS="${EXTRA_BUILD_DEPS} xxd"
}

# Literal offsets: this function also runs board-side via armbian-install.
# Family variables and exit_with_error are unavailable in that context.
function write_uboot_platform() {
	local SCRIPT_DIR="$1" DEVICE="$2"
	if [[ -f "${SCRIPT_DIR}/boot0_sdcard.fex" && -f "${SCRIPT_DIR}/boot_package.fex" ]]; then
		dd conv=notrunc,fsync status=none if="${SCRIPT_DIR}/boot0_sdcard.fex" of="${DEVICE}" bs=1k seek=8 ||
			{ echo "write_uboot_platform: boot0_sdcard.fex write to ${DEVICE} failed" >&2; return 1; }
		dd conv=notrunc,fsync status=none if="${SCRIPT_DIR}/boot_package.fex" of="${DEVICE}" bs=1k seek=16400 ||
			{ echo "write_uboot_platform: boot_package.fex write to ${DEVICE} failed" >&2; return 1; }
		sync "${DEVICE}" || return $?
		return 0
	elif [[ -f "${SCRIPT_DIR}/u-boot-sunxi-with-spl.bin" ]]; then
		dd conv=notrunc,fsync status=none if="${SCRIPT_DIR}/u-boot-sunxi-with-spl.bin" of="${DEVICE}" bs=1k seek=8 ||
			{ echo "write_uboot_platform: u-boot-sunxi-with-spl.bin write to ${DEVICE} failed" >&2; return 1; }
		sync "${DEVICE}" || return $?
		return 0
	elif [[ -f "${SCRIPT_DIR}/u-boot.bin" ]]; then
		dd conv=notrunc,fsync status=none if="${SCRIPT_DIR}/u-boot.bin" of="${DEVICE}" bs=1k seek=40 ||
			{ echo "write_uboot_platform: u-boot.bin write to ${DEVICE} failed" >&2; return 1; }
		sync "${DEVICE}" || return $?
		return 0
	fi
	echo "write_uboot_platform: no recognized u-boot image in ${SCRIPT_DIR}" >&2
	return 1
}

function post_family_tweaks__sun60iw2_dev() {
	display_alert "sun60iw2-dev rootfs tweaks" "${BOARD}" "info"

	# The in-tree driver expects a flat lowercase firmware path.
	if [[ -d "${SDCARD}/lib/firmware/aic8800/SDIO/aic8800D80" ]]; then
		ln -sfn aic8800/SDIO/aic8800D80 "${SDCARD}/lib/firmware/aic8800d80"
	else
		display_alert "aic8800D80 firmware not found in rootfs" "WiFi may not work; check armbian-firmware" "warn"
	fi

	chroot_sdcard_apt_get_install mtd-utils

	# The boot script selects the earlycon format from this value.
	if [[ -f "${SDCARD}/boot/armbianEnv.txt" ]]; then
		if grep -q "^branch=" "${SDCARD}/boot/armbianEnv.txt"; then
			sed -i "s/^branch=.*/branch=${BRANCH}/" "${SDCARD}/boot/armbianEnv.txt"
		else
			echo "branch=${BRANCH}" >> "${SDCARD}/boot/armbianEnv.txt"
		fi
	fi

	# Keep the root device UUID in extlinux.conf after armbian-config rewrites.
	if [[ -f "${SDCARD}/usr/lib/armbian-config/config.functions.sh" ]]; then
		sed -i '/install_rewrite_bootenv "\$env_file" "\$root_uuid" "\$fs"/a \\t\t\t\tlocal extlinux="$mp/boot/extlinux/extlinux.conf"\\n\t\t\t\t[[ -f "$extlinux" ]] && sed -i -E "s|root=[^[:space:]]+|root=${root_uuid}|g" "$extlinux"' "${SDCARD}/usr/lib/armbian-config/config.functions.sh"
	fi

	# Lock the serial console at 115200 baud. Avoid agetty fallback speeds.
	local sercon="${SERIALCON:-ttyS0}"
	mkdir -p "${SDCARD}/etc/systemd/system/serial-getty@${sercon}.service.d"
	cat <<- 'EOD' > "${SDCARD}/etc/systemd/system/serial-getty@${sercon}.service.d/10-baud.conf"
		[Service]
		ExecStart=
		ExecStart=-/sbin/agetty -o '-- \u' --noreset --noclear 115200 %I $TERM
	EOD
	chroot_sdcard systemctl --no-reload enable "serial-getty@${sercon}.service"

	if [[ "${SUN60IW2_UART_BT:-no}" == "yes" ]]; then
		chroot_sdcard_apt_get_install bluez rfkill
		run_host_command_logged install -m 644 "${SRC}/packages/bsp/sunxi/aic8800-bluetooth.service" "${SDCARD}/lib/systemd/system/aic8800-bluetooth.service"
		chroot_sdcard systemctl --no-reload enable aic8800-bluetooth.service
	fi

	if [[ -d "${SRC}/packages/bsp/sun60iw2" ]]; then
		display_alert "Installing sun60iw2 NPU BSP packages" "${BOARD}" "info"
		run_host_command_logged cp -rp "${SRC}/packages/bsp/sun60iw2/." "${SDCARD}/"
	fi
}

function pre_package_kernel_headers__sun60iw2_dev_bsp_include() {
	[[ -d "${kernel_work_dir}/bsp/include" ]] || return 0
	run_host_command_logged cp -rp "${kernel_work_dir}/bsp/include" "${headers_target_dir}/bsp/include"
}
