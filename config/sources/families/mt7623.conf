BOOTSCRIPT='boot-mt7623.cmd:boot.cmd'
BOOTENV_FILE='mt7623.txt'
UBOOT_TARGET_MAP=";;$SRC/packages/blobs/mt7623n/BPI-R2-HEAD440-0k.img $SRC/packages/blobs/mt7623n/BPI-R2-HEAD1-512b.img $SRC/packages/blobs/mt7623n/BPI-R2-preloader-2k.img $SRC/packages/blobs/mt7623n/BPI-R2-EMMC-boot0-0K-0905.img u-boot.bin"
# u-boot on v2026.07 (mainline). Known limitation: modern mainline u-boot boots
# the BPI-R2 from SD but hangs in early board_init_f on eMMC (only an old vendor
# u-boot ever booted eMMC). v2024.07 and v2026.07 fail there identically, so it
# looks like a toolchain/build-env difference (GCC 14?), not the u-boot version.
# SD boot is the supported path; eMMC boot is unfixed - a separate follow-up.
BOOTPATCHDIR='v2026.07'
BOOTBRANCH='tag:v2026.07'
ARCH=armhf
ATF_COMPILE="no"
EXTRAWIFI="no"

case $BRANCH in

	# BananaPi R2 (mt7623) is supported by mainline, so both targets build straight
	# from mainline with no mt7623 kernel patch dir: 'current' tracks the LTS, 'edge'
	# the latest. KERNELPATCHDIR is left default (archive/${BOARDFAMILY}-${KERNEL_MAJOR_MINOR}).
	current)
		KERNEL_MAJOR_MINOR="6.18" # Major and minor versions of this kernel.
		;;

	edge)
		KERNEL_MAJOR_MINOR="7.1" # Major and minor versions of this kernel.
		;;

esac

CPUMIN=98000
CPUMAX=1300000
GOVERNOR="ondemand"

# No family network preconfiguration: the board uses Armbian's default networking
# (NetworkManager, or systemd-networkd + the default DHCP-all netplan for minimal).
# The MT7530 switch ports (wan, lan0-3) come up as normal DSA netdevs and DHCP on
# carrier; configure a bridge/router setup in userspace if desired.

write_uboot_platform() {
	if [[ $2 == /dev/mmcblk* && -b ${2}boot0 ]]; then
		local device=${2}boot0
		echo 0 > /sys/block/$(basename $device)/force_ro
		local is_emmc=1
	else
		local device=${2}
	fi

	if [[ $is_emmc == 1 ]]; then
		dd if=$1/BPI-R2-EMMC-boot0-0K-0905.img of=$2boot0 bs=1024 seek=0 status=noxfer > /dev/null 2>&1
		dd if=$1/u-boot.bin of=$2 bs=1k seek=320 status=noxfer > /dev/null 2>&1
		mmc bootpart enable 1 1 $2

	else
		dd if=$SRC/packages/blobs/mt7623n/BPI-R2-HEAD440-0k.img of=$2 bs=440 seek=0 count=1 status=noxfer > /dev/null 2>&1
		dd if=$SRC/packages/blobs/mt7623n/BPI-R2-HEAD1-512b.img of=$2 bs=512 seek=1 status=noxfer > /dev/null 2>&1
		dd if=$SRC/packages/blobs/mt7623n/BPI-R2-preloader-2k.img of=$2 bs=1k seek=2 status=noxfer > /dev/null 2>&1
		dd if=$1/u-boot.bin of=$2 bs=1k seek=320 status=noxfer > /dev/null 2>&1
	fi
}
