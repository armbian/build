# shellcheck source=config/sources/families/include/meson64_common.inc
source "${BASH_SOURCE%/*}/include/meson64_common.inc"
ASOUND_STATE="${ASOUND_STATE:-"asound.state.meson64"}"

CPUMIN=1000000
CPUMAX=1800000
GOVERNOR=ondemand

uboot_custom_postprocess() {
	if [[ $BOARD == radxa-zero ]]; then
		uboot_g12_postprocess "$SRC"/cache/sources/amlogic-boot-fip/radxa-zero g12a
	fi
}

function post_family_tweaks_bsp__meson_g12a_mutter_ignore_etnaviv() {
	# See post_family_tweaks_bsp__meson_g12b_mutter_ignore_etnaviv in meson-g12b.conf.
	mkdir -p "${destination}/etc/udev/rules.d"
	cat <<- 'EOF' > "${destination}/etc/udev/rules.d/61-mutter-ignore-etnaviv.rules"
		SUBSYSTEM=="drm", ENV{DEVTYPE}=="drm_minor", KERNEL=="card[0-9]*", DRIVERS=="etnaviv", TAG+="mutter-device-ignore"
	EOF
}
