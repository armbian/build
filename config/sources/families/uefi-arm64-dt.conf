declare -g LINUXFAMILY="uefi-arm64-dt"
declare -g ARCH="arm64"
enable_extension "grub"
declare -g KERNEL_DO_STUBBLE="yes"
# Attach to a specific commit (is tag:v14, 2026-09-27; please update when
# updating the ref). On a branch every upstream commit changes the UKI, and
# with it the kernel artifact version, so all uefi-arm64-dt kernels rebuild for hwid
# entries we do not ship. A commit ref also needs no ls-remote, so OFFLINE_WORK
# keeps working.
declare -g STUBBLE_GIT_BRANCH="commit:2af62ba955219fe461ab5d9b04ecea0715021d2b"
# DTBs not yet in stubble's hwids; finddtbs.py will not include these automatically.
declare -g -a EXTRA_STUBBLE_DEVICETREES=("cix/sky1-orion-o6.dtb")

case $BRANCH in

	current)
		declare -g KERNEL_MAJOR_MINOR="6.18" # Major and minor versions of this kernel.
		;;

	edge)
		declare -g KERNEL_MAJOR_MINOR="7.3"    # Major and minor versions of this kernel.
		declare -g -i KERNEL_GIT_CACHE_TTL=120 # 2 minutes; this is a high-traffic repo
		;;
esac

# Tegra (Jetson Nano): let mutter render on nouveau, not on the tegra Gallium
# driver. Mesa >= 26 tegra passes its own resources to nouveau, and
# gnome-shell crashes on the first frame. Platform nouveau only: a PCIe
# NVIDIA GPU does not match.
function post_family_tweaks_bsp__uefi_arm64_dt_tegra_mutter_primary_gpu() {
	display_alert "Adding udev rule" "mutter primary GPU on Tegra nouveau" "info"
	install -d -m755 "${destination}/etc/udev/rules.d"
	cat > "${destination}/etc/udev/rules.d/61-armbian-tegra-mutter-primary.rules" <<-'EOF_RULE'
		SUBSYSTEM=="drm", KERNEL=="card*", SUBSYSTEMS=="platform", DRIVERS=="nouveau", TAG+="mutter-device-preferred-primary"
	EOF_RULE
}

# Mesa 25.0.7 (trixie) makes the Tegra210 GPU reject draws (nouveau DATA_ERROR),
# and the desktop stays black. Use Mesa from trixie-backports. Desktop only.
function post_family_tweaks__uefi_arm64_dt_mesa_backports_pin() {
	if [[ "${DISTRIBUTION}" != "Debian" || "${RELEASE}" != "trixie" || "${BUILD_DESKTOP}" != "yes" ]]; then
		display_alert "Skipping Mesa backports pin" "${DISTRIBUTION} ${RELEASE} desktop=${BUILD_DESKTOP}" "info"
		return 0
	fi

	display_alert "Pinning Mesa to trixie-backports" "${BOARD}" "info"

	install -d -m755 "${SDCARD}/etc/apt/preferences.d"
	cat > "${SDCARD}/etc/apt/preferences.d/armbian-mesa-from-backports" <<-'EOF_PIN'
		Package: src:mesa
		Pin: release n=trixie-backports
		Pin-Priority: 990
	EOF_PIN

	do_with_retries 3 chroot_sdcard_apt_get_update
	do_with_retries 3 chroot_sdcard_apt_get full-upgrade
}

# Tegra (Jetson Nano): the APE (AHUB/I2S) card has no codec on the board, so
# PipeWire picks a silent default output. Hide it from PipeWire; HDMI becomes
# the default. Raw ALSA access to the APE card is not affected.
function post_family_tweaks_bsp__uefi_arm64_dt_tegra_hide_ape_audio() {
	display_alert "Adding WirePlumber rule" "hide Tegra APE audio card" "info"
	install -d -m755 "${destination}/etc/wireplumber/wireplumber.conf.d"
	cat > "${destination}/etc/wireplumber/wireplumber.conf.d/51-armbian-tegra-ape.conf" <<-'EOF_WP'
		monitor.alsa.rules = [
		  {
		    matches = [
		      { api.alsa.card.name = "~NVIDIA Jetson .* APE" }
		    ]
		    actions = {
		      update-props = {
		        device.disabled = true
		      }
		    }
		  }
		]
	EOF_WP
}
