#
# New family — not upstream as of this PR. Added for the Raspberry Pi 2
# Model B (BCM2836, quad-core Cortex-A7, 32-bit ARMv7). At the time of
# writing, armbian/build has no bcm2836/bcm2837-class family at all --
# only bcm2711 (Pi 4-class, see rpi4b.conf). This file is modeled
# directly on that upstream bcm2711.conf: same "no U-Boot, boot via the
# Pi's own GPU firmware + config.txt/cmdline.txt" convention, same
# postinst hooks that copy the kernel/initrd/dtbs into /boot/firmware.
# The two load-bearing differences from bcm2711.conf, called out
# explicitly because getting either wrong produces a board that won't
# boot at all:
#   1. ARCH=armhf, not arm64 -- this is a 32-bit-only SoC.
#   2. config.txt below has NO `arm_64bit=1` line. That line tells the
#      firmware to boot the ARM cores in AArch64 mode; leaving it in
#      (as bcm2711.conf's does, correctly, for its 64-bit kernel) would
#      make the firmware try to enter 64-bit mode against a 32-bit
#      kernel and fail to boot at all.
#
# Verified booting end-to-end under QEMU (raspi2b machine): kernel
# compiles, packages, boots, mounts its ext4 root filesystem and reaches
# init -- see scripts/run-qemu-rpi2.sh. This required a kernel devicetree
# fix (patch/kernel/bcm2836-current/) for a dma-ranges gap that broke
# root-fs mounting; see that patch's commit message and
# https://github.com/raspberrypi/linux/issues/7136 for the full story.
# NOT yet verified on real Raspberry Pi 2 hardware -- treat this as
# QEMU-validated only until someone confirms it on a real board.
#
# This is a part of the Armbian Build Framework
# https://github.com/armbian/build/
#
declare -g LINUXFAMILY=bcm2836
declare -g ARCH=armhf
declare -g KERNEL_IMAGE_TYPE="zImage"
# Off by default here (unlike upstream's bcm2711.conf, which doesn't set
# this at all): a real build on a RAM-constrained CI runner hit Armbian's
# own guard ("Not enough RAM available ... for BTF build") on a 6GB VM.
# This board is QEMU-validation-only, not a debugging target, so skipping
# BTF entirely is the right default regardless of runner RAM.
declare -g KERNEL_BTF="no"
declare -g OVERLAY_DIR="/boot/dtb/broadcom/overlay"
declare -g UEFI_FS_LABEL="RPICFG" # Windows/Mac users will see this if they mount the SD card.
declare -g CPUMIN=600000
declare -g CPUMAX=900000 # Pi 2 B stock (non-overclocked) max.
declare -g GOVERNOR=ondemand
declare -g INSTALL_ARMBIAN_FIRMWARE=no
declare -g UEFISIZE=512                      # in MiB. Not really UEFI, but partition layout is the same.
declare -g BOOTSIZE=0                        # No separate /boot; instead we have /boot/firmware fat32 partition
declare -g BOOTCONFIG=none                   # No U-boot for Raspberry Pi boards -- boots via GPU firmware + config.txt
declare -g UEFI_MOUNT_POINT="/boot/firmware" # mount uefi partition at /boot/firmware
declare -g LINUXCONFIG="linux-${LINUXFAMILY}-${BRANCH}"

# Same upstream kernel repo/branches bcm2711.conf uses -- Raspberry Pi
# Foundation maintains one branch per kernel release across all their
# supported chips, config-selected by defconfig, not by per-chip branch.
# Only "current" is supported for now (matches rpi2b.wip's
# KERNEL_TARGET="current") -- deliberately not offering legacy/edge cases
# here without the matching config/kernel/linux-bcm2836-{legacy,edge}.config
# files to back them. Selecting either would hit the same "kernel config
# doesn't exist" failure this board's own bring-up started from; add the
# branch case back here only alongside a real generated config for it.
case "${BRANCH}" in
	current)
		declare -g KERNELSOURCE='https://github.com/raspberrypi/linux'
		declare -g KERNEL_MAJOR_MINOR="6.18"
		declare -g KERNELBRANCH="branch:rpi-6.18.y"
		;;
esac

function post_family_config__mark_bsp_as_firmware_containing() {
	if [[ "${SKIP_ARMBIAN_REPO}" != "yes" ]]; then
		declare -g -r RASPI_FIRMWARE_DIR="/usr/lib/linux-firmware-raspi"
		display_alert "SKIP_ARMBIAN_REPO is set to" "${SKIP_ARMBIAN_REPO} - not adding rpi firmware to bsp" "info"
		return 0
	fi
	display_alert "Marking BSP name as firmware-containing" "bcm2836" "info"
	declare -g EXTRA_BSP_NAME="${EXTRA_BSP_NAME}-raspifw" # Unique bsp name.
	declare -g -r RASPI_FIRMWARE_DIR="/usr/lib/armbian-firmware-raspi"
}

function post_family_config__add_rpi_packages() {
	display_alert "Preparing bcm2836" "${RELEASE}" "info"
	unset BOOTSOURCE                                # To try and convince lib/ to not build or install u-boot.
	declare -g SERIALCON="${RASPI_SERIALCON:-tty1}" # HDMI etc, not serial. most people don't have UART on rpi

	# those older releases are not working as we don't provide binaries for libraspberrypi-bin
	local not_usable_releases="bullseye|buster|focal"

	if [[ -n "${RELEASE}" ]]; then
		if [[ "$RELEASE" =~ ^(${not_usable_releases})$ ]]; then
			exit_with_target_not_supported_error "Can't use release '${RELEASE}' for ${BOARD}. Invalid releases: '${not_usable_releases}'" "'${RELEASE}' not supported"
		fi
	fi
}

# Make sure we don't try to install or remove /boot/dtb-$kvers directory.
# Identical to bcm2711.conf's version of this hook -- the kernel postinst's
# own "/boot/Image then /boot/vmlinuz-${abi}" fallback already handles the
# 32-bit zImage-based Debian kernel package naming correctly with no changes.
function post_family_tweaks_bsp__add_hooks_to_move_kernel_initrd_and_dtb() {
	run_host_command_logged mkdir -p "${destination}"/etc/kernel/post{inst,rm}.d

	display_alert "Setting up z51-raspi-firmware" "bcm2836 - from ${RASPI_FIRMWARE_DIR}" "info"
	run_host_command_logged cat <<- z51-raspi-firmware > "${destination}"/etc/kernel/postinst.d/z51-raspi-firmware
		#!/bin/bash -e

		[[ -d ${RASPI_FIRMWARE_DIR} ]] || exit 0

		if grep -q '^ID=debian' /etc/os-release; then
		   exit 0
		fi

		exec </dev/null >&2

		mkdir -p /boot/firmware

		for file in ${RASPI_FIRMWARE_DIR}/*
		do
			file=\$( basename "\$file" )
			cp "${RASPI_FIRMWARE_DIR}/\$file" "/boot/firmware/\$file"
			sync -f "/boot/firmware/\$file" || true
		done

		exit 0
	z51-raspi-firmware

	run_host_command_logged cat <<- 'zzz-copy-new-files' > "${destination}"/etc/kernel/postinst.d/zzz-copy-new-files
		#!/bin/bash -e

		exec </dev/null >&2

		abi=$1
		target=/boot/firmware
		dtb_dir=/usr/lib/linux-image-$abi/

		if [[ -f /boot/Image ]]; then
		    cp /boot/Image ${target}/vmlinuz
		elif [[ -f /boot/vmlinuz-${abi} ]]; then
		    cp /boot/vmlinuz-${abi} ${target}/vmlinuz
		else
		    echo "Error: No kernel file (Image or vmlinuz-${abi}) found in /boot!"
		    exit 1
		fi

		# Unlike bcm2711.conf's arm64 build (DTBs nested under a
		# broadcom/ subdir), this armhf/current build's linux-image
		# package installs DTBs flat directly under dtb_dir, and
		# ships no overlays/ directory at all -- confirmed by
		# inspecting the actual built .deb on 2026-08-05 after a
		# real CI run failed on the broadcom/-subdir assumption
		# copied over from bcm2711.conf. Guard the overlays copy
		# since the source directory may not exist for this family.
		cp ${dtb_dir}/*.dtb ${target}/
		[[ -d ${dtb_dir}/overlays ]] && cp -r ${dtb_dir}/overlays ${target}/
		sync -f ${target}/vmlinuz || true

		exit 0
	zzz-copy-new-files

	run_host_command_logged cat <<- 'zzz-remove-old-files' > "${destination}"/etc/kernel/postrm.d/zzz-remove-old-files
		#!/bin/bash -e

		exec </dev/null >&2

		abi=$1
		target=/boot/firmware

		rm ${target}/vmlinuz
		rm ${target}/*.dtb
		rm -r ${target}/overlays

		exit 0
	zzz-remove-old-files

	run_host_command_logged chmod a+rx "${destination}"/etc/kernel/postinst.d/z51-raspi-firmware
	run_host_command_logged chmod a+rx "${destination}"/etc/kernel/postinst.d/zzz-copy-new-files
	run_host_command_logged chmod a+rx "${destination}"/etc/kernel/postrm.d/zzz-remove-old-files

	run_host_command_logged rm "${destination}"/etc/initramfs/post-update.d/99-uboot

	run_host_command_logged cat <<- 'zzz-update-initramfs' > "${destination}"/etc/initramfs/post-update.d/zzz-update-initramfs
		#!/bin/bash -e

		exec </dev/null >&2

		abi=$1
		initrd_file=$2
		target=/boot/firmware

		cp ${initrd_file} ${target}/initrd.img
		sync -f ${target}/initrd.img || true

		exit 0
	zzz-update-initramfs

	run_host_command_logged chmod a+x "${destination}"/etc/initramfs/post-update.d/zzz-update-initramfs
}

function post_family_tweaks_bsp__add_x11_config() {
	display_alert "rpi2b" "Adding X11 configuration" "info"
	run_host_command_logged mkdir -p "${destination}"/etc/X11/xorg.conf.d/
	run_host_command_logged cat <<- '99-vc4.conf' > "${destination}"/etc/X11/xorg.conf.d/99-vc4.conf
		Section "OutputClass"
		  Identifier "vc4"
		  MatchDriver "vc4"
		  Driver "modesetting"
		  Option "PrimaryGPU" "true"
		EndSection
	99-vc4.conf
}

function post_family_tweaks__populate_boot_firmware_directory() {
	display_alert "Populating /boot/firmware directory" "bcm2836" "info"
	modules_dir="$(find "${SDCARD}/lib/modules"/ -maxdepth 1 -type d -name "*${IMAGE_INSTALLED_KERNEL_VERSION}*")"
	kern_ver="$(basename "$modules_dir")"
	run_host_command_logged mkdir -p "${SDCARD}"/boot/firmware
	chroot_sdcard /etc/kernel/postinst.d/z51-raspi-firmware "${kern_ver}"
	chroot_sdcard /etc/kernel/postinst.d/zzz-copy-new-files "${kern_ver}"
	display_alert "Populating /boot/firmware directory" "bcm2836 - done" "info"
}

function post_family_tweaks_bsp__rpi_firmware_in_bsp() {
	if [[ "${SKIP_ARMBIAN_REPO}" != "yes" ]]; then
		display_alert "SKIP_ARMBIAN_REPO is set to" "${SKIP_ARMBIAN_REPO} - not adding rpi firmware to bsp" "info"
		return 0
	fi

	display_alert "Using in-BSP firmware files for" "bcm2836::${BOARD}" "info"
	declare firmware_commit_sha1="9cafcd85f8aed1ec0c0f609b98af591fae367ba2" # Keep this inside this file, so hashing detect changes and bumps the version of the bsp package

	declare destdir="${destination}/usr/lib/armbian-firmware-raspi"
	run_host_command_logged mkdir -p "${destdir}"
	fetch_from_repo "https://salsa.debian.org/debian/raspi-firmware.git" "debian-raspi-firmware" "commit:${firmware_commit_sha1}" "yes"
	declare srcdir="${SRC}/cache/sources/debian-raspi-firmware/${firmware_commit_sha1}"
	run_host_command_logged cp -prv "${srcdir}/boot/"* "${destdir}"/
}

function pre_install_distribution_specific__add_rpi_packages() {
	if [[ "${SKIP_ARMBIAN_REPO}" == "yes" ]]; then
		display_alert "SKIP_ARMBIAN_REPO is set to" "${SKIP_ARMBIAN_REPO} - no Armbian repo packages will be installed" "info"
		if [[ "${DISTRIBUTION}" == "Debian" ]]; then
			display_alert "Installing Debian-sourced Wifi/BT firmware packages" "Debian::bcm2836::${BOARD}" "info"
			do_with_retries 3 chroot_sdcard_apt_get_update
			chroot_sdcard_apt_get_install firmware-brcm80211 firmware-misc-nonfree bluez-firmware bluetooth
		fi
		if [[ "${DISTRIBUTION}" == "Ubuntu" ]]; then
			display_alert "Installing Ubuntu-sourced Wifi/BT firmware packages plus raspi-config and raspi-eeprom" "Ubuntu::bcm2836::${BOARD}" "info"
			do_with_retries 3 chroot_sdcard_apt_get_update
			chroot_sdcard_apt_get_install rpi-eeprom pi-bluetooth busybox raspi-config bluetooth
		fi
	else
		mv "${SDCARD}"/etc/apt/sources.list.d/armbian.sources.disabled "${SDCARD}"/etc/apt/sources.list.d/armbian.sources
		do_with_retries 3 chroot_sdcard_apt_get_update
		if [[ "${DISTRIBUTION}" == "Debian" ]]; then
			chroot_sdcard_apt_get_install firmware-brcm80211 rpi-eeprom raspi-firmware raspberrypi-sys-mods bluez-firmware bluez pi-bluetooth busybox raspi-config
		else
			chroot_sdcard_apt_get_install rpi-eeprom linux-firmware-raspi pi-bluetooth libraspberrypi-bin busybox raspi-config
		fi
		mv "${SDCARD}"/etc/apt/sources.list.d/armbian.sources "${SDCARD}"/etc/apt/sources.list.d/armbian.sources.disabled
	fi
}

function pre_install_distribution_specific__unblock_rfkill() {
	cat > "${SDCARD}/etc/systemd/system/unblock-rfkill.service" <<- EOT
		[Unit]
		Description=Unblock rfkill manually (no rfkill binary)
		After=multi-user.target

		[Service]
		Type=oneshot
		ExecStart=/bin/bash -c 'for f in /sys/class/rfkill/*/state; do echo 1 > "\$f"; done'
		RemainAfterExit=true

		[Install]
		WantedBy=multi-user.target
	EOT
	display_alert "Enabling unblock-rfkill service" "bcm2836" "info"
	chroot_sdcard systemctl enable unblock-rfkill.service
}

# Rpi3-class boards are the ones with an ESP-flag partition issue upstream;
# harmless to strip it here too, keeps this family consistent with bcm2711.
function pre_umount_final_image__remove_esp() {
	display_alert "Removing ESP flag from FAT partition" "rpi2" "info"
	run_host_command_logged parted -s "${LOOP}" set 1 esp off
}

# write the default config.txt config -- NOTE: deliberately has no
# `arm_64bit=1` line (see file header) and no [cm4]/[cm5] sections
# (compute-module-specific, not applicable to a Pi 2 Model B).
function pre_umount_final_image__write_raspi_config() {
	cat <<- EOD > "${MOUNT}"/boot/firmware/config.txt
		# For more options and information see
		# http://rptl.io/configtxt
		# Some settings may impact device functionality. See link above for details

		# Uncomment some or all of these to enable the optional hardware interfaces
		#dtparam=i2c_arm=on
		#dtparam=i2s=on
		#dtparam=spi=on

		# Enable audio (loads snd_bcm2835)
		dtparam=audio=on

		# Additional overlays and parameters are documented
		# /boot/firmware/overlays/README

		# Automatically load overlays for detected cameras
		camera_auto_detect=1

		# Automatically load overlays for detected DSI displays
		display_auto_detect=1

		# Automatically load initramfs files, if found
		auto_initramfs=1

		# Enable DRM VC4 V3D driver
		dtoverlay=vc4-kms-v3d
		max_framebuffers=2

		# Don't have the firmware create an initial video= setting in cmdline.txt.
		# Use the kernel's default instead.
		disable_fw_kms_setup=1

		# Disable compensation for displays with overscan
		disable_overscan=1

		[all]
		kernel=vmlinuz
		initramfs initrd.img followkernel
	EOD
}

function pre_umount_final_image__write_raspi_cmdline() {
	cat <<- EOD > "${MOUNT}"/boot/firmware/cmdline.txt
		console=serial0,115200 console=tty1 loglevel=1 root=LABEL=${ROOT_FS_LABEL} rootfstype=${ROOTFS_TYPE} fsck.repair=yes rootwait logo.nologo cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory
	EOD

	if [[ "${SHOW_DEBUG}" == "yes" ]]; then
		display_alert "Showing /boot/firmware as mounted" "bcm2836" "debug"
		run_host_command_logged tree "${MOUNT}"/boot/firmware
	fi
}
