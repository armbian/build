# Sophgo SG2000 / SG2002 (CV181x) family - ARM mode
#
# These SoCs pair an ARM Cortex-A53 with a T-Head C906 RISC-V core, and only one
# of them runs. On the Milk-V Duo S a slide switch picks it, and the fip.bin on
# the card has to have been built for the same one. This family covers the ARM
# side. For RISC-V mode see sophgo-sg200x-riscv64.conf.
#
# Everything else is shared with that family and lives in
# include/sophgo-sg200x_common.inc - kernel branches and patch series, the
# U-Boot and FSBL pins, the image layout, the SOPHGO_CVI_* set. Even the vendor
# SDK's per-core project naming is there, as a case on the ARCH set below. What
# is left here is the identity of the core: which one Linux runs on, and what
# that implies for the toolchain and the boot environment.
#
# ARCH needs no KERNEL_COMPILER: aarch64 is Armbian's default cross toolchain.
#

declare -g ARCH="arm64"
declare -g LINUXFAMILY="sophgo-sg200x-arm64"

# Same boot.cmd on both architectures; only the earlycon spelling differs, and
# that lives in armbianEnv.txt. The Cortex-A53 takes plain "earlycon" from the
# device tree stdout-path.
declare -g BOOTENV_FILE="sophgo-sg200x-arm64.txt"

# Reads ARCH and LINUXFAMILY, so it goes last.
# shellcheck source=config/sources/families/include/sophgo-sg200x_common.inc
source "${SRC}/config/sources/families/include/sophgo-sg200x_common.inc"
