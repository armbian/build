# shellcheck source=config/sources/families/include/imx8_common.inc
source "${BASH_SOURCE%/*}/include/imx8_common.inc"
OFFSET=32

# i.MX8Mx families needs for boot:
# - atf
# - hdmi firmware (some)
# - ddr firmware
# - uboot

# make some board specific adjustments
case $BOARD in
	mba8mpxl* | tq-smarc2-*)
		ATFSOURCE='https://github.com/tq-systems/atf' # required for ram
		ATFBRANCH="branch:TQM-lf_v2.10"
		ATFPATCHDIR='atf-tq'
		BOOTSOURCE='https://github.com/tq-systems/u-boot-tqmaxx.git' # u-boot mainlining is hard and has low-priority
		BOOTBRANCH='commit:b92657862fbc744ac4c4c9746e3ce53c9a1a1f23'
		BOOTPATCHDIR="u-boot-tqma" # could be removed when distro boot patches are integrated
		;;
	debix-model-a)
		[[ "${BRANCH}" == "edge" ]] && KERNEL_MAJOR_MINOR="7.3"
		;;
esac

# bootloader related.
# Use `<hook>__<purpose>` so the framework registers this alongside
# other extensions' hooks at the same stage; a bare
# `pre_config_uboot_target()` would suppress every other registration.
pre_config_uboot_target__imx8m_firmware() {
	# get the firmware
	rm -rf ${IMX_FIRMWARE}*
	curl -fL "https://github.com/armbian/nxp-firmware/raw/firmware-imx/${IMX_FIRMWARE}.bin" -o "${IMX_FIRMWARE}.bin" || {
		echo "download of IMX_FIRMWARE failed"
		rm -f "${IMX_FIRMWARE}.bin"
		exit 1
	}
	chmod +x ${IMX_FIRMWARE}.bin
	./${IMX_FIRMWARE}.bin --auto-accept

	# copy needed files for uboot (used by all imx8m cpu's)
	cp ${IMX_FIRMWARE}/firmware/hdmi/cadence/signed_hdmi_imx8m.bin .
	cp ${IMX_FIRMWARE}/firmware/hdmi/cadence/signed_dp_imx8m.bin .
	cp ${IMX_FIRMWARE}/firmware/ddr/synopsys/lpddr4*.bin .
}

# Boards with IMX8M_EMMC_BOOT_USER_AREA="yes" also make the eMMC boot ROM
# read the user area, so a boot0 image from factory flashing does not win.
if [[ "${IMX8M_EMMC_BOOT_USER_AREA:-no}" == "yes" ]]; then
	write_uboot_platform() {
		local disk="${2#/dev/}" msg rc=0
		[[ "${disk}" =~ ^(mmcblk[0-9]+)p[0-9]+$ ]] && disk="${BASH_REMATCH[1]}"
		dd if="$1/flash.bin" of="$2" bs=1K seek=32 status=noxfer conv=fsync > /dev/null 2>&1 || return 1
		[[ "${disk}" == mmcblk* && -e "/sys/block/${disk}boot0" ]] || return 0
		if ! command -v mmc > /dev/null 2>&1; then
			msg="mmc-utils missing: run 'mmc bootpart enable 7 1 /dev/${disk}'"
			rc=1
		elif mmc bootpart enable 7 1 "/dev/${disk}" > /dev/null 2>&1; then
			msg="eMMC /dev/${disk} boots from the user area"
		else
			msg="Cannot set the eMMC boot area of /dev/${disk} to the user area"
			rc=1
		fi
		echo "${msg}" >&2
		logger -t armbian-uboot "${msg}" 2> /dev/null || true
		return "${rc}"
	}
else
	write_uboot_platform() {
		dd if=$1/flash.bin of=$2 bs=1K seek=32 status=noxfer conv=fsync > /dev/null 2>&1
	}
fi

# bsp related
family_tweaks_bsp() {
	:
}
