# Sophgo SG2000 / SG2002 (CV181x) family - RISC-V mode
#
# These SoCs pair a T-Head C906 RISC-V core with an ARM Cortex-A53; which one
# runs Linux is picked by a slide switch on the Milk-V Duo S, and the fip.bin on
# the card has to have been built for the same core. This family covers the
# RISC-V side. For ARM mode see sophgo-sg200x-arm64.conf.
#
# Everything else is shared with that family and lives in
# include/sophgo-sg200x_common.inc - kernel branches and patch series, the
# U-Boot and FSBL pins, the image layout, the SOPHGO_CVI_* set. Even the vendor
# SDK's per-core project naming is there, as a case on the ARCH set below. What
# is left here is the identity of the core: which one Linux runs on, and what
# that implies for the toolchain, the boot environment and the userspace.
#

declare -g ARCH="riscv64"
declare -g LINUXFAMILY="sophgo-sg200x-riscv64"

# Same boot.cmd on both architectures; only the earlycon spelling differs, and
# that lives in armbianEnv.txt. The C906 has no memory-mapped earlycon before
# the SBI console, so it needs earlycon=sbi rather than a bare earlycon.
declare -g BOOTENV_FILE="sophgo-sg200x-riscv64.txt"

declare -g KERNEL_COMPILER="riscv64-linux-gnu-"

# Ubuntu moved its riscv64 baseline to the RVA23 profile in 25.10, and RVA23
# mandates Zba, Zbb, Zbs and more. The C906 in the SG2000 is plain RV64GC and
# has none of them, so an Ubuntu 25.10-or-later userspace cannot run here at
# all: the dynamic linker reaches a Zba instruction (sh3add) and PID 1 dies
# before anything else happens.
#
#   init[1]: unhandled signal 4 code 0x1 ... in ld-linux-riscv64-lp64d.so.1
#   ... cause: 0000000000000002        <- illegal instruction
#   Kernel panic - not syncing: Attempted to kill init! exitcode=0x00000004
#
# Fail during configuration rather than after a full image build and a serial
# console session. Only the RISC-V family needs this; the Cortex-A53 side runs
# any arm64 userspace.
function extension_prepare_config__sophgo_sg200x_riscv_reject_rva23_userspace() {
	[[ "${DISTRIBUTION}" == "Ubuntu" ]] || return 0

	# Compare by config/distributions/<release>/order rather than by name, so a
	# future Ubuntu is caught too - which is the entire point of the guard.
	# questing (25.10) is order 11 and is the first RVA23 release. The orders
	# interleave Debian and Ubuntu, hence the DISTRIBUTION check above.
	declare order_file="${SRC}/config/distributions/${RELEASE}/order"
	declare order=0
	[[ -r "${order_file}" ]] && order="$(cat "${order_file}")"
	[[ "${order}" =~ ^[0-9]+$ ]] || order=0

	if [[ "${order}" -ge 11 ]]; then
		display_alert "Milk-V Duo S" "RELEASE=${RELEASE} is Ubuntu 25.10 or newer" "err"
		display_alert "Milk-V Duo S" "its riscv64 userspace needs RVA23; the C906 is RV64GC" "err"
		exit_with_error "Ubuntu ${RELEASE} cannot boot on ${BOARD}" \
			"use a Debian release (trixie), or Ubuntu noble"
	fi
}

# Reads ARCH and LINUXFAMILY, so it goes last.
# shellcheck source=config/sources/families/include/sophgo-sg200x_common.inc
source "${SRC}/config/sources/families/include/sophgo-sg200x_common.inc"
