# Unisoc UMS512 / T618 (sharkl5pro) family.
#
# Boot chain on this SoC is nothing like Rockchip/Allwinner, so this family
# deliberately does NOT source any of the existing *_common.inc includes:
#
#   BootROM -> SPL (eMMC "splloader", signature-bypass patched, flashed once
#   with spd_dump) -> U-Boot (from the SD GPT partition named "uboot")
#   -> extlinux scan on mmc 1:2 -> kernel
#
# The SPL keeps loading the secure world (sml/trustos/teecfg) from the stock
# eMMC, so images built here only ever own the SD card.

declare -g LINUXFAMILY="sprd-ums512"
declare -g ARCH="arm64"

# No ARM Trusted Firmware to build. The secure world (sml / trustos / teecfg) is
# loaded by the SPL from the stock eMMC, so there is no BL31 for us to produce.
# Without this, arm64.conf's default ATFSOURCE kicks in and the build tries to
# compile upstream ATF for its default "fvp" platform, which then fails.
# ATF_COMPILE stops arm64.conf from setting the defaults; ATFSOURCE="none" is
# what compile_atf() and artifact_uboot_build_from_sources() actually test, so
# set both and stay independent of the config sourcing order.
declare -g ATF_COMPILE="no"
declare -g ATFSOURCE="none"

# U-Boot hands off through extlinux, not boot.scr.
declare -g SRC_EXTLINUX="yes"

# The partition table is not Armbian-shaped: partition 1 has to be a raw
# GPT-labelled "uboot" slot that the SPL looks up by name. See
# create_partition_table() below.
declare -g USE_HOOK_FOR_PARTITION="yes"
declare -g UBOOT_PART_MB="${UBOOT_PART_MB:-16}"
# Start of the raw "uboot" slot, in MiB. create_partition_table() places the
# partition here and write_uboot_platform() dd's to the same offset, so it has
# to be one number. 1 MiB leaves room for the primary GPT.
declare -g UBOOT_PART_START_MB="${UBOOT_PART_START_MB:-1}"

case $BRANCH in

	edge)
		declare -g KERNEL_MAJOR_MINOR="7.1"
		# Mirror of beebono/linux-mainline-sprd (branch rg-rotate), pinned to the
		# commit rg-rotate itself ships as its submodule - i.e. the exact tree
		# validated on hardware. Own fork + fixed commit so the board stays
		# buildable and reproducible if the upstream branch moves or goes away.
		declare -g KERNELSOURCE="https://github.com/crackerjacques/linux-mainline-sprd.git"
		declare -g KERNELBRANCH="commit:464b3e7bf45bb300e190339977abba36c8078e1f"
		# The fork already carries the bulk of the sprd/ums512 support (drm,
		# wifi, bt, audio/AGDSP, panfrost match, cpufreq). What the patch dir
		# adds on top is this board's DT plus fixes to the vendor ASoC, DMA and
		# Wi-Fi code the fork inherited unchanged from the Android BSP.
		declare -g KERNELPATCHDIR="archive/sprd-ums512-${KERNEL_MAJOR_MINOR}"
		declare -g LINUXCONFIG="linux-sprd-ums512-edge"
		;;

esac

# Custom partition table: p1 raw "uboot" (SPL reads it by GPT name), p2 boot
# (U-Boot's extlinux scan is hardcoded to mmc 1:2), p3 rootfs.
#
# NOTE: bootpart/rootpart are locals of the caller (prepare_partitions) that it
# already numbered 1/2 assuming no u-boot slot. Bash dynamic scoping lets us
# renumber them here, which is what keeps the later mount/fstab logic correct.
function create_partition_table() {
	local uboot_start="${UBOOT_PART_START_MB:-1}"
	local boot_start=$((uboot_start + UBOOT_PART_MB))
	local root_start=$((boot_start + BOOTSIZE))

	# shellcheck disable=SC2154 # bootpart/rootpart are the caller's locals
	bootpart=2
	rootpart=3

	display_alert "Partitioning for ${BOARD}" \
		"p1 uboot ${UBOOT_PART_MB}MiB @${uboot_start}MiB, p2 boot ${BOOTSIZE}MiB, p3 rootfs" "info"

	{
		echo "label: gpt"
		# Type is Linux reserved; only the *name* matters to the SPL.
		echo "1 : name=\"uboot\", start=${uboot_start}MiB, size=${UBOOT_PART_MB}MiB, type=8DA63339-0007-60C0-C436-083AC8230908"
		echo "2 : name=\"bootfs\", start=${boot_start}MiB, size=${BOOTSIZE}MiB, type=BC13C2FF-59E6-4262-A352-B275FD6F7172"
		echo "3 : name=\"rootfs\", start=${root_start}MiB, type=${PARTITION_TYPE_UUID_ROOT}"
	} | run_host_command_logged sfdisk "${SDCARD}".raw || exit_with_error "Create partition table fail"
}

# --- Vendor U-Boot 2015.07 quirks: ARCH and DEVICE_TREE ------------------
#
# ARCH=arm has to reach *every* make invocation, including the configure pass,
# because Kconfig itself is arch-dependent here:
#
#   Makefile:     DIRARCH := $(ARCH)      (ARCH ?= $(HOSTARCH))
#                 export ARCH ... DIRARCH
#   arch/Kconfig: config SRCARCH
#                     option env="DIRARCH"
#                 source "arch/$SRCARCH/Kconfig"
#
# So without ARCH the defconfig pass runs as the host's x86_64, sources
# arch/x86/Kconfig and writes an x86-flavoured .config. The build pass then
# re-evaluates it against arch/arm/Kconfig, and silentoldconfig stops at an
# interactive "Restart config... / ARM architecture" prompt, hanging forever on
# stdin. ("arm" is right for this 64-bit SoC: U-Boot keeps arm64 under arch/arm
# and board/spreadtrum/Kconfig does `select ARM64`.)
#
# It cannot be exported. ARCH is Armbian's own global (arm64 for this family)
# and stamps the u-boot .deb; overwriting it yields a package dpkg rejects with
#   package architecture (arm) does not match system (arm64)
#
# It also cannot be passed through the environment: once include/config/auto.conf
# exists the tree pulls in config.mk, whose `ARCH := $(CONFIG_SYS_ARCH:"%"=%)` is
# a hard assignment that beats any environment value (and lands on an empty ARCH
# while the config is mid-regeneration - the giveaway is the doubled slash in
# "ln: failed to create symbolic link 'arch//include/asm/arch'"). Only a make
# command-line variable outranks that.
#
# So it goes in on the command line, in TWO places, because Armbian splits the
# work across make invocations that do not share one stanza:
#
#   configure passes (uboot.sh:104/182/217) - appended to ${cross_compile} here
#   build pass       (uboot.sh:277)         - the board's UBOOT_TARGET_MAP
#
# Both are needed: uboot.sh:263 rebuilds ${cross_compile} from scratch just
# before the build pass, so anything added here never reaches it. Getting only
# one of the two produces a config written under one arch and re-evaluated under
# another, and silentoldconfig then stops at an interactive "Restart config..."
# prompt that hangs the build on stdin forever.
#
# `cross_compile` is a local of the caller; bash dynamic scoping is what lets a
# hook reach it, the same way create_partition_table() renumbers bootpart.
#
# DEVICE_TREE is only consulted when dts/dt.dtb is built, so it rides along in
# UBOOT_TARGET_MAP only (the mvebu64 idiom).
function pre_config_uboot_target__sprd_ums512_arch() {
	# shellcheck disable=SC2154 # cross_compile is the caller's local
	cross_compile="${cross_compile} ARCH=arm"
	display_alert "${BOARD}" "pinning ARCH=arm for every u-boot make pass" "info"
	return 0
}

# Wrap the built U-Boot in a Unisoc DHTB container.
#
# No vendor template image is needed. The SPL's GPT path
# (load_partition_with_header) only reads mImgSize out of the 512-byte header
# and then reads that many bytes; its RSA verify is NOPed by the signature
# bypass patch. The raw-sector fallback additionally checks the "DHTB" magic.
# So a synthesized header with magic + payload SHA256 + size covers both, and
# nothing proprietary has to be redistributed.
#
# Layout confirmed against the SPL's own sys_img_header
# (chipram/include/security/sprdsec_header.h):
#   0x000  uint32 mMagicNum      "DHTB"
#   0x004  uint32 mVersion       1
#   0x008  uint8  mPayloadHash[32]
#   0x028  uint64 mImgAddr       unused (the SPL loads to CONFIG_SYS_NAND_U_BOOT_DST)
#   0x030  uint32 mImgSize
#   0x200  payload
function uboot_custom_postprocess() {
	local payload="u-boot-dtb.bin"
	[[ -f "${payload}" ]] || exit_with_error "U-Boot payload not found" "${payload}"

	display_alert "Wrapping U-Boot in DHTB container" "${BOARD}" "info"
	python3 - "${payload}" "uboot_dhtb.img" <<- 'DHTB_WRAP'
		import hashlib, struct, sys

		src, dst = sys.argv[1], sys.argv[2]
		payload = open(src, "rb").read()
		# The SPL reads in 512-byte sectors; pad so the declared size is a whole
		# number of them. The hash covers the padding, which is fine since we
		# compute it here.
		pad = (-len(payload)) % 512
		payload += b"\x00" * pad

		hdr = bytearray(512)
		hdr[0x00:0x04] = b"DHTB"
		hdr[0x04:0x08] = struct.pack("<I", 1)               # mVersion
		hdr[0x08:0x28] = hashlib.sha256(payload).digest()
		hdr[0x30:0x34] = struct.pack("<I", len(payload))    # mImgSize

		open(dst, "wb").write(bytes(hdr) + payload)
		print(f"DHTB: {len(payload)} byte payload ({pad} pad), sha256 {hdr[0x08:0x28].hex()}")
	DHTB_WRAP
}

# Write the DHTB-wrapped U-Boot into the raw "uboot" partition (p1).
function write_uboot_platform() {
	local uboot_img="$1/uboot_dhtb.img"
	[[ -f "${uboot_img}" ]] || exit_with_error "Missing DHTB-wrapped U-Boot" "${uboot_img}"

	# This also runs on the target, from armbian-install, where the family
	# config has not been sourced - so fall back to the same defaults.
	local start_mb="${UBOOT_PART_START_MB:-1}" size_mb="${UBOOT_PART_MB:-16}"
	local img_size
	img_size="$(stat -c %s "${uboot_img}")"
	# p2 begins right after the slot; a silent overrun would corrupt /boot and
	# only show up as an unbootable card.
	((img_size <= size_mb * 1024 * 1024)) ||
		exit_with_error "DHTB-wrapped U-Boot is larger than the ${size_mb}MiB uboot slot" "${img_size} bytes"

	dd "if=${uboot_img}" "of=$2" bs=1M "seek=${start_mb}" conv=notrunc status=none
}
