# Unisoc UMS512 / T618 (sharkl5pro) family. The boot chain shares nothing with the
# other families, so none of the *_common.inc includes are sourced:
#
#   BootROM -> SPL (eMMC boot area, flashed once by the user)
#   -> U-Boot (SD GPT partition named "uboot") -> extlinux on mmc 1:2 -> kernel
#
# The SPL still loads the secure world from the stock eMMC, so images built here
# only ever own the SD card.

declare -g LINUXFAMILY="sprd-ums512"
declare -g ARCH="arm64"

# No ATF: the SPL loads the secure world, so there is no BL31 to produce. This
# alone is enough - arm64.conf only sets the ATF defaults when it is not "no",
# and the family config is sourced before it.
declare -g ATF_COMPILE="no"

# U-Boot hands off through extlinux, not boot.scr.
declare -g SRC_EXTLINUX="yes"

# p1 has to be a raw GPT-labelled "uboot" slot that the SPL looks up by name.
declare -g USE_HOOK_FOR_PARTITION="yes"
declare -g UBOOT_PART_MB="${UBOOT_PART_MB:-16}"
# create_partition_table() and write_uboot_platform() must agree on this offset.
declare -g UBOOT_PART_START_MB="${UBOOT_PART_START_MB:-1}"

case $BRANCH in

	edge)
		declare -g KERNEL_MAJOR_MINOR="7.1"
		# Mirror of beebono/linux-mainline-sprd (branch rg-rotate), pinned to the
		# commit it ships as its submodule - the tree validated on hardware.
		declare -g KERNELSOURCE="https://github.com/crackerjacques/linux-mainline-sprd.git"
		declare -g KERNELBRANCH="commit:464b3e7bf45bb300e190339977abba36c8078e1f"
		declare -g KERNELPATCHDIR="archive/sprd-ums512-${KERNEL_MAJOR_MINOR}"
		declare -g LINUXCONFIG="linux-sprd-ums512-edge"
		;;

esac

# Keep the vendor defconfig's DEBUG_INFO_REDUCED=y; BTF_MODULES would give every
# module a .BTF section this kernel has never been run with.
declare -g KERNEL_BTF="${KERNEL_BTF:-no}"

# Two kernel options the config file cannot express, because the generic arm64
# hooks run after it is read and would undo them. Family level, not board level:
# the kernel package is per family+branch.
#
# ARM64_VA_BITS_39 is what the vendor defconfig asks for, but
# armbian_kernel_config__force_pa_va_48_bits_on_arm64() appends ARM64_VA_BITS_48
# to opts_y for every arm64 build. Editing opts_y is the only thing that works -
# the apply pass walks opts_n first, so an opts_n entry would just be re-enabled.
#
# With the sysfs firmware fallback on, each request_firmware() for a file that is
# not in the initramfs blocks 60s on udev instead of failing with -ENOENT, and the
# built-in WCN core asks from there.
function custom_kernel_config__sprd_ums512_vendor_defconfig_shape() {
	declare -a kept=()
	declare opt

	# shellcheck disable=SC2154 # opts_y is the caller's local
	for opt in "${opts_y[@]}"; do
		case "${opt}" in
			ARM64_VA_BITS_48 | CONFIG_ARM64_VA_BITS_48) continue ;;
		esac
		kept+=("${opt}")
	done

	kept+=("ARM64_VA_BITS_39")
	opts_y=("${kept[@]}")

	# shellcheck disable=SC2154 # opts_n is the caller's local
	opts_n+=("FW_LOADER_USER_HELPER_FALLBACK")

	display_alert "${LINUXFAMILY}" "39-bit VAs, no sysfs firmware fallback" "info"
}

# p1 raw "uboot" (the SPL finds it by GPT name), p2 boot, p3 rootfs. bootpart and
# rootpart are the caller's locals, numbered assuming no u-boot slot; renumbering
# them here is what keeps the later mount/fstab logic correct.
function create_partition_table() {
	local uboot_start="${UBOOT_PART_START_MB:-1}"
	local boot_start=$((uboot_start + UBOOT_PART_MB))
	local root_start=$((boot_start + BOOTSIZE))

	# shellcheck disable=SC2154 # bootpart/rootpart are the caller's locals
	bootpart=2
	rootpart=3

	display_alert "Partitioning for ${BOARD}" \
		"p1 uboot ${UBOOT_PART_MB}MiB @${uboot_start}MiB, p2 boot ${BOOTSIZE}MiB, p3 rootfs" "info"

	{
		echo "label: gpt"
		# Type is Linux reserved; only the *name* matters to the SPL.
		echo "1 : name=\"uboot\", start=${uboot_start}MiB, size=${UBOOT_PART_MB}MiB, type=8DA63339-0007-60C0-C436-083AC8230908"
		echo "2 : name=\"bootfs\", start=${boot_start}MiB, size=${BOOTSIZE}MiB, type=BC13C2FF-59E6-4262-A352-B275FD6F7172"
		echo "3 : name=\"rootfs\", start=${root_start}MiB, type=${PARTITION_TYPE_UUID_ROOT}"
	} | run_host_command_logged sfdisk "${SDCARD}".raw || exit_with_error "Create partition table fail"
}

# This vendor tree's Kconfig is arch-dependent, so without ARCH=arm on every make
# the configure pass writes an x86 .config and silentoldconfig then hangs on an
# interactive prompt. It cannot be exported (ARCH stamps the .deb) or passed in the
# environment (config.mk hard-assigns it), so it goes on the command line - here
# and again in UBOOT_TARGET_MAP. "arm" is right: U-Boot keeps arm64 under arch/arm.
function pre_config_uboot_target__sprd_ums512_arch() {
	# shellcheck disable=SC2154 # cross_compile is the caller's local
	cross_compile="${cross_compile} ARCH=arm"
	display_alert "${BOARD}" "pinning ARCH=arm for every u-boot make pass" "info"
	return 0
}

# Wrap U-Boot in a Unisoc DHTB container. No vendor template needed: the SPL only
# reads the magic, mImgSize and that many bytes. Layout from its sys_img_header:
#
#   0x000 "DHTB" | 0x004 version 1 | 0x008 sha256(payload) | 0x030 size | 0x200 payload
function uboot_custom_postprocess() {
	local payload="u-boot-dtb.bin"
	[[ -f "${payload}" ]] || exit_with_error "U-Boot payload not found" "${payload}"

	display_alert "Wrapping U-Boot in DHTB container" "${BOARD}" "info"
	python3 - "${payload}" "uboot_dhtb.img" <<- 'DHTB_WRAP'
		import hashlib, struct, sys

		src, dst = sys.argv[1], sys.argv[2]
		payload = open(src, "rb").read()
		# The SPL reads in 512-byte sectors; pad so the declared size is a whole
		# number of them. The hash covers the padding, which is fine since we
		# compute it here.
		pad = (-len(payload)) % 512
		payload += b"\x00" * pad

		hdr = bytearray(512)
		hdr[0x00:0x04] = b"DHTB"
		hdr[0x04:0x08] = struct.pack("<I", 1)               # mVersion
		hdr[0x08:0x28] = hashlib.sha256(payload).digest()
		hdr[0x30:0x34] = struct.pack("<I", len(payload))    # mImgSize

		open(dst, "wb").write(bytes(hdr) + payload)
		print(f"DHTB: {len(payload)} byte payload ({pad} pad), sha256 {hdr[0x08:0x28].hex()}")
	DHTB_WRAP
}

# Write the DHTB-wrapped U-Boot into the raw "uboot" slot (p1). This also runs on
# the target, from the package postinst, where exit_with_error does not exist and
# the caller is under "set +e" - so the guards return instead. They matter: p2
# begins right after the slot and an unchecked dd would corrupt /boot.
function write_uboot_platform() {
	local uboot_img="$1/uboot_dhtb.img"
	local start_mb="${UBOOT_PART_START_MB:-1}" size_mb="${UBOOT_PART_MB:-16}"
	local img_size

	if [[ ! -f "${uboot_img}" ]]; then
		echo "write_uboot_platform: missing ${uboot_img}" >&2
		return 1
	fi
	if ! img_size="$(stat -c %s "${uboot_img}")"; then
		echo "write_uboot_platform: cannot stat ${uboot_img}" >&2
		return 1
	fi
	if ((img_size > size_mb * 1024 * 1024)); then
		echo "write_uboot_platform: ${uboot_img} is ${img_size} bytes, larger than the ${size_mb}MiB uboot slot" >&2
		return 1
	fi

	dd "if=${uboot_img}" "of=$2" bs=1M "seek=${start_mb}" conv=notrunc status=none
}
