# shellcheck source=config/sources/families/include/rockchip64_common.inc
source "${BASH_SOURCE%/*}/include/rockchip64_common.inc"
enable_extension "boardcon-extension"
declare -g ASOUND_STATE="asound.state.boardcon-sbc3568"

BOOTSOURCE='https://github.com/radxa/u-boot.git'
BOOTBRANCH='branch:next-dev-v2024.10' # Always use same version as rk3588, they share a patch dir
BOOTPATCHDIR="legacy/u-boot-radxa-rk35xx legacy/u-boot-radxa-rk35xx-v2024.10" # v2024.10 dir: patches that need the newer Radxa branch (not 2024.03 boards)
OVERLAY_PREFIX='rk35xx'

if [[ "$BOOT_SOC" == "rk3576" ]]; then
	BOOTSCRIPT='boot-rk3576.cmd:boot.cmd'
else
	BOOTSCRIPT='boot-rk35xx.cmd:boot.cmd'
fi

case $BRANCH in
	vendor)
		BOOTDIR='u-boot-rockchip64'
		declare -g KERNEL_MAJOR_MINOR="6.1"    # Major and minor versions of this kernel.
		declare -g -i KERNEL_GIT_CACHE_TTL=120 # 2 minutes; this is a high-traffic repo
		KERNELSOURCE='https://github.com/boardcon-arm/linux-rockchip.git'
		KERNELBRANCH='branch:rk-6.1-rkr7.2'
		KERNELPATCHDIR='rk35xx-vendor-6.1'
		;;
esac

prepare_boot_configuration

function pre_config_uboot_target__warn_modern_hosts() {
	# Check if building Radxa U-Boot on a host other than Ubuntu Jammy
	if [[ "${BOOTSOURCE}" == "https://github.com/radxa/u-boot.git" ]]; then
		if [[ "${HOSTRELEASE}" != "jammy" ]]; then
			display_alert "Building Rockchip BSP U-Boot from Radxa repository" "on Ubuntu ${HOSTRELEASE} (newer than Jammy) can lead to unintended bugs" "wrn"
		fi
	fi
}

function post_family_config__boardcon_stage_kernel_patches()
{
	local ext_patch_dir="${SRC}/extensions/boardcon_armbian_extension/userpatches/kernel/${KERNELPATCHDIR}/sbc3568/rv2-v4"
	local user_patch_dir="${SRC}/userpatches/kernel/${KERNELPATCHDIR}"

	[[ ! -d "${ext_patch_dir}" ]] && return 0

	install -d -m 0755 "${user_patch_dir}"

	cp -a "${ext_patch_dir}/." "${user_patch_dir}/"
}

function post_family_config__boardcon_install_asound_state()
{
	local src_state="${SRC}/extensions/boardcon_armbian_extension/userpatches/kernel/${KERNELPATCHDIR}/sbc3568/rv2-v4/misc/asound.state"
	local dst_dir="${SRC}/packages/blobs/asound.state"

	[[ ! -f "${src_state}" ]] && return 0

	install -d "${dst_dir}"

	cp -f "${src_state}" \
	      "${dst_dir}/asound.state.boardcon-sbc3568"

	display_alert "$BOARD" "Installing Boardcon asound.state blob" "info"

	return 0
}

function post_family_tweaks__boardcon_sbc3568_bt_firmware()
{
	display_alert "$BOARD" "Installing RTL8723DU Bluetooth firmware" "info"

	local fw_dir="${SRC}/extensions/boardcon_armbian_extension/userpatches/kernel/${KERNELPATCHDIR}/sbc3568/rv2-v4/firmware"

	[[ ! -d "${fw_dir}" ]] && return 0

	install -d "${SDCARD}/lib/firmware"

	if [[ -f "${fw_dir}/rtl8723du_fw" ]]; then
		install -m 0644 \
			"${fw_dir}/rtl8723du_fw" \
			"${SDCARD}/lib/firmware/rtl8723du_fw"
	fi

	if [[ -f "${fw_dir}/rtl8723du_config" ]]; then
		install -m 0644 \
			"${fw_dir}/rtl8723du_config" \
			"${SDCARD}/lib/firmware/rtl8723du_config"
	fi

	return 0
}


function check_uboot_produced_binary_file__check_vendor_uboot_for_0_byte_dtb() {
	# this hook is called with those two variables
	: "${base_binfile:?base_binfile is not set}"
	: "${binfile:?binfile is not set}"

	[[ "${BOOTSOURCE}" != "https://github.com/radxa/u-boot.git" ]] && return 0 # Check if building Radxa U-Boot
	[[ "${base_binfile}" != "u-boot.itb" ]] && return 0                        # Only check 'u-boot.itb' file
	display_alert "u-boot for ${BOARD}::${BRANCH} built on ${HOSTRELEASE}" "Checking for 0-byte DTB: ${base_binfile}" "info"

	# Run dumpimage -l, grep it for string 'Data Size:    0 Bytes', if found, exit_with_error
	if dumpimage -l "${binfile}" | grep -q "Data Size:    0 Bytes"; then
		exit_with_error "u-boot for ${BOARD}::${BRANCH}::${base_binfile}: ERROR: The produced u-boot.itb file contains a 0-byte DTB; built on ${HOSTRELEASE} (${RUNNER_NAME}::${RUNNER_ENVIRONMENT}::${RUNNER_ARCH})"
	else
		display_alert "u-boot for ${BOARD}::${BRANCH}::${base_binfile}" "OK, produced u-boot.itb does NOT have 0-byte-dtb; built on ${HOSTRELEASE} (${RUNNER_NAME}::${RUNNER_ENVIRONMENT}::${RUNNER_ARCH})" "notice" # logs to CI log
	fi

	return 0
}

family_tweaks_bsp() {
	:
}
