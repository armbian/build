ARCH=arm64
# u-boot: the 2016.01 rafaello7 nanopi3 fork - the known-good bootloader that
# boots this SoC cold+warm at EL2 (what runs on the board today). The boot.img
# (NSIH + BL1 + u-boot.bin) is assembled in the hook below; TEXT_BASE 0x43c00000
# matches the NSIH launch address.
#
# The mainline v2026.07 port (patch/u-boot/v2026.07-s5p6818) is kept in-tree for
# future work but is NOT used: it runs on a warm reboot yet RESET-LOOPS on a COLD
# boot (an unresolved 2026-u-boot/GCC-15 early-environment issue, not the nexell
# code - see that port's README). Switch back once the cold-boot crash is fixed.
BOOTSOURCE='https://github.com/rafaello7/u-boot-nanopi-m3.git'
BOOTBRANCH='tag:v1.2'
BOOTDIR='u-boot-nanopi-m3'
BOOTPATCHDIR='u-boot-nanopi3-2016.01'
BOOTCONFIG='nanopim3_defconfig'
BOOTSCRIPT='boot-s5p6818.cmd:boot.cmd'
BOOTENV_FILE='s5p6818.txt'
UBOOT_TARGET_MAP=";;boot.img bootemmc.img"
ATF_COMPILE="no"
case $BRANCH in
	# CURRENT: from-scratch revival of the Nexell S5P6818 platform on mainline.
	# Mainline never carried this SoC (verified absent through v7.2), so the
	# nexell platform (Kconfig, clk, pinctrl, serial, timer, dw_mmc glue,
	# GbE/USB/I2C/RTC/PWM/thermal and device trees) is supplied entirely by the
	# KERNELPATCHDIR below (archive/s5p6818-7.2), ported from the rafaello7 4.14
	# BSP and validated on hardware. The old 4.14 vendor kernel (legacy) is
	# retired - mainline 7.2 is now the default (current) kernel.
	current)
		declare -g KERNEL_MAJOR_MINOR="7.2" # Major and minor versions of this kernel.
		;;
esac

CPUMIN="400000"
CPUMAX="1400000"
GOVERNOR=ondemand

write_uboot_platform() {
	if [[ "$2" != /dev/mmcblk0 ]]; then
		dd if=$1/boot.img of=$2 seek=1 status=noxfer > /dev/null 2>&1
	else
		dd if=$1/bootemmc.img of=$2 seek=1 status=noxfer > /dev/null 2>&1
	fi
}

uboot_custom_postprocess() {
	# 2GB differnt bl1 https://github.com/friendlyarm/linux-3.4.y/issues/3#issuecomment-387214487
	if [[ $BOARD == nanopct3plus ]]; then
		cp $SRC/packages/blobs/nanopi/2g-bl1-nanopi.bin boot.img
	else
		cp $SRC/packages/blobs/nanopi/1g-bl1-nanopi.bin boot.img
	fi
	i=0
	merge=""
	while [ $i -lt 512 ]; do
		val="00000000"
		[ $i -eq 68 ] && val="00100000"  # 0x44  load size (1 MiB, covers u-boot.bin)
		[ $i -eq 72 ] && val="43bffe00"  # 0x48  load address (BL places image at
		                                 #       load+0x200, so _start@0 lands on launch)
		[ $i -eq 76 ] && val="43c00000"  # 0x4c  launch address (CONFIG_TEXT_BASE)
		[ $i -eq 504 ] && val="68180300" # 0x1f8 version
		[ $i -eq 508 ] && val="4849534E" # 0x1fc "NSIH"
		# put in little endian
		vallo=${val#????}
		valhi=${val%????}
		merge=$merge"${vallo#??}${vallo%??}${valhi#??}${valhi%??}"
		i=$((i + 4))
	done
	# Convert the hex string to raw bytes without xxd (absent in some build
	# environments; when it is, the NSIH is silently dropped and the truncating
	# dd leaves boot.img headerless -> the board can never boot this u-boot).
	# conv=notrunc keeps boot.img at 64 sectors so u-boot.bin appends at sector 64.
	printf "$(printf '%s' "$merge" | sed 's/../\\x&/g')" | dd of=boot.img seek=63 conv=notrunc status=none
	cat u-boot.bin >> boot.img
	cp boot.img bootemmc.img
	printf "\2" | dd of=bootemmc.img bs=1 seek=80 conv=notrunc
}

family_tweaks() {
	:
}
