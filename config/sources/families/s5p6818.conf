ARCH=arm64
# u-boot: PREBUILT boot region shipped as a blob (packages/blobs/nanopi/
# boot-nanopi3-2g.img). It is BL1 + NSIH + u-boot "2016.01-armbian", captured
# verbatim from a known-good on-board install - the bootloader that actually
# boots this S5P6818 cold+warm at EL2. The hook below only stamps the SD/eMMC
# selector byte; write_uboot_platform() dd's it at sector 1.
#
# Why prebuilt: (1) the mainline v2026.07 port (patch/u-boot/v2026.07-s5p6818,
# kept in-tree for future work) RESET-LOOPS on a COLD boot; (2) the 2016.01 fork
# does not build from source on a modern host - its host tools (fdtgrep/mkimage
# via lib/libfdt) collide with the system libfdt-dev. Both a hand-assembled
# BL1+NSIH+u-boot.bin and the rafaello7 v1.2 prebuilt differed from the working
# binaries and would not boot; the captured blob is the proven article.
# TODO: build from source once the host-tools/libfdt issue (or the v2026.07
# cold-boot crash) is fixed; capture a 1 GiB BL1 for the M3/Fire3.
#
# BOOTSOURCE is still fetched so the u-boot artifact flow has a tree to version
# against; UBOOT_TARGET_MAP's make target is the no-op 'ubootversion' (builds
# nothing), and the postprocess produces boot.img/bootemmc.img from the blob.
BOOTSOURCE='https://github.com/rafaello7/u-boot-nanopi-m3.git'
BOOTBRANCH='tag:v1.2'
BOOTDIR='u-boot-nanopi-m3'
BOOTPATCHDIR='u-boot-nanopi3-2016.01'
BOOTCONFIG='nanopim3_defconfig'
BOOTSCRIPT='boot-s5p6818.cmd:boot.cmd'
BOOTENV_FILE='s5p6818.txt'
UBOOT_TARGET_MAP="ubootversion;;boot.img bootemmc.img"
ATF_COMPILE="no"
case $BRANCH in
	# EDGE: from-scratch revival of the Nexell S5P6818 platform on mainline.
	# Mainline never carried this SoC (verified absent through v7.2), so the
	# nexell platform (Kconfig, clk, pinctrl, serial, timer, dw_mmc glue,
	# GbE/USB/I2C/RTC/PWM/thermal and device trees) is supplied entirely by the
	# KERNELPATCHDIR below (archive/s5p6818-7.2), ported from the rafaello7 4.14
	# BSP and validated on hardware. The old 4.14 vendor kernel (legacy) is
	# retired. It rides the edge branch because 7.2 is a non-LTS kernel ahead of
	# the latest LTS (there is no current/LTS target for this SoC yet).
	edge)
		declare -g KERNEL_MAJOR_MINOR="7.2" # Major and minor versions of this kernel.
		;;
esac

CPUMIN="400000"
CPUMAX="1400000"
GOVERNOR=ondemand

write_uboot_platform() {
	# Only the on-board eMMC gets the eMMC-selector blob (bootemmc.img, selector
	# byte = 2). On this SoC the DT aliases map SD to mmc0 (/dev/mmcblk0) and
	# eMMC to mmc2 (/dev/mmcblk2); image creation targets a loop device. So the
	# eMMC is the single case for bootemmc.img - everything else (SD card, the
	# image loop device) gets the SD-selector boot.img.
	if [[ "$2" == /dev/mmcblk2 ]]; then
		dd if=$1/bootemmc.img of=$2 seek=1 status=noxfer > /dev/null 2>&1
	else
		dd if=$1/boot.img of=$2 seek=1 status=noxfer > /dev/null 2>&1
	fi
}

uboot_custom_postprocess() {
	# Ship the proven boot region (BL1 + NSIH + u-boot "2016.01-armbian"),
	# extracted verbatim from a known-good on-board install - byte-identical to
	# what boots this SoC. It is written to the target at sector 1 (seek=1) by
	# write_uboot_platform() above, so it already contains BL1 at its sector 0.
	#
	# We do NOT hand-assemble BL1+NSIH+u-boot.bin any more: both the old BL1 blob
	# and the from-source/prebuilt u-boot.bin differed from the working binaries
	# and the board would not boot. See git history / the port README.
	#
	# The only per-board difference is DRAM init, which lives in the BL1 inside
	# these blobs, so there are two: 2 GiB (NanoPC-T3+) and 1 GiB (NanoPi M3 /
	# Fire3 / NanoPC-T3). Both carry the same "2016.01-armbian" u-boot. The 2 GiB
	# blob was captured from a NanoPC-T3+ eMMC; the 1 GiB one from the last known
	# good Armbian Fire3 image (21.02.1). BOARD picks which.
	if [[ $BOARD == nanopct3plus ]]; then
		cp "$SRC/packages/blobs/nanopi/boot-nanopi3-2g.img" boot.img
	else
		cp "$SRC/packages/blobs/nanopi/boot-nanopi3-1g.img" boot.img
	fi

	# Byte at offset 0x50 (80) selects the boot device the ROM/2ndboot uses:
	# 0 = SD, 2 = eMMC. The captured blob is from eMMC (=2); force SD for boot.img
	# and eMMC for bootemmc.img so each medium auto-boots without the BOOT button.
	printf '\0' | dd of=boot.img bs=1 seek=80 conv=notrunc status=none
	cp boot.img bootemmc.img
	printf '\2' | dd of=bootemmc.img bs=1 seek=80 conv=notrunc status=none
}

family_tweaks() {
	:
}
