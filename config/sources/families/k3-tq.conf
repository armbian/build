source "${BASH_SOURCE%/*}/include/k3_common.inc"

declare -g LINUXFAMILY="k3-tq" # Separate kernel package from the regular `k3` family - TQ-Systems vendor kernel/u-boot
declare -g ATFSOURCE="https://github.com/ARM-software/arm-trusted-firmware"
declare -g SRC_EXTLINUX="yes"
declare -g ASOUND_STATE="asound.state.tqma"
# TQ's own u-boot fork
declare -g BOOTSOURCE="https://github.com/tq-systems/u-boot-tqmaxx"
declare -g BOOTBRANCH="commit:5c778312688bd46835a93b811c51f1510e0b3cb9" # TQMaxx-u-boot-v2026.01
# artifact-uboot.sh doesn't hash TIBOOT3_FILE; fold it in for reliable cache-busting.
declare -g UBOOT_HASH_EXTRA="TQMaxx-u-boot-v2026.01-${TIBOOT3_FILE}"

case "${BRANCH}" in

	vendor | vendor-rt)

		declare -g KERNELSOURCE="https://github.com/tq-systems/linux-tqmaxx"
		declare -g KERNEL_MAJOR_MINOR="6.18"
		declare -g KERNELBRANCH="commit:d1f6c258293a1c6cf568c78e4ce0207a002823f8" # TQMaxx-ti-linux-6.18.y
		declare -g KERNEL_DESCRIPTION="TQ-Systems TQMaxx vendor kernel (TI Processor SDK based)"
		# ATF/OP-TEE are generic K3-architecture builds, same commits as plain k3.
		declare -g ATFBRANCH="commit:76500ceaeefcda967d8a1f4e30bb04f9fe0425a2"
		declare -g OPTEE_BRANCH="commit:f2a7ad0638aeff5243593b33cc56ad064cae7615"
		declare -g TI_LINUX_FIRMWARE_BRANCH="tag:12.00.00.07"
		EXTRAWIFI="no"
		;;

esac

# CONFIG_SPL is unset in TQ's own a53 defconfigs (both tqma62xx and tqma67xx) - no separate
# A53-SPL/tispl.bin stage, ATF+OP-TEE+DM+DTB are bundled straight into u-boot.img instead.
# Override the k3_common.inc defaults accordingly (which unconditionally expect tispl.bin).
function post_family_config__k3_tq_no_tispl_stage() {
	declare -g UBOOT_TARGET_MAP="BL31=bl31.bin ${EXTRA_BOOT_ARGS} TEE=${SRC}/cache/sources/optee-os/out/arm-plat-k3/core/tee-pager_v2.bin BINMAN_INDIRS=${SRC}/cache/sources/ti-linux-firmware all;;tiboot3.bin ${UBOOT_FILE:-u-boot.img}:u-boot.img"

	function write_uboot_platform() {
		cp "$1/tiboot3.bin" "${MOUNT}/boot"
		cp "$1/u-boot.img" "${MOUNT}/boot"
	}
}

function post_config_uboot_target__k3_tq_legacy_image_format() {
	run_host_command_logged scripts/config --enable CONFIG_LEGACY_IMAGE_FORMAT
}
