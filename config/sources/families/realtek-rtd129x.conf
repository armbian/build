# Realtek RTD1295/RTD1296: mainline kernel and mainline u-boot.
# Kernel patches: https://github.com/JalenLin/BPI-W2-linux
#
declare -g ARCH="arm64"
declare -g LINUXFAMILY="realtek-rtd129x"
declare -g LINUXCONFIG="linux-${LINUXFAMILY}-${BRANCH}"
declare -g SERIALCON="ttyS0:115200"

# Mainline u-boot. The Realtek loader starts it from SD sector 80 (40 KiB).
declare -g BOOTBRANCH="tag:v2026.10"
declare -g BOOTPATCHDIR="v2026.10-rtd129x"
# RTD1295/RTD1296 boards boot from the eMMC boot area. RTD1395 boards do not.
declare -g RTD129X_EMMC_BOOTAREA="${RTD129X_EMMC_BOOTAREA:-yes}"
if [[ ${RTD129X_EMMC_BOOTAREA} == yes ]]; then
	declare -g UBOOT_TARGET_MAP=";;u-boot.bin rtd129x-emmc-boot.bin"
else
	declare -g UBOOT_TARGET_MAP=";;u-boot.bin"
fi
declare -g BOOTSCRIPT="boot-realtek-rtd129x.cmd:boot.cmd"
declare -g BOOTENV_FILE="realtek-rtd129x.txt"
# No ATF: U-Boot and Linux start at EL3/EL2 from the Realtek loader.
declare -g ATF_COMPILE="no"

# Audio firmware from packages/blobs/rtd129x. U-Boot starts it before Linux.
# It runs the audio and the HDMI output.
declare -g RTD129X_AUDIO_FW="${RTD129X_AUDIO_FW:-yes}"
declare -g RTD129X_AUDIO_FW_FILE="${RTD129X_AUDIO_FW_FILE:-bluecore-rtd1296.audio}"

case "${BRANCH}" in

	current)
		declare -g KERNEL_MAJOR_MINOR="6.18"
		;;

	edge)
		declare -g KERNEL_MAJOR_MINOR="7.3"
		;;

esac

declare -g KERNELPATCHDIR="archive/${LINUXFAMILY}-${KERNEL_MAJOR_MINOR}"

# The eMMC boot area: the factory boot parts (packages/blobs/rtd129x) with
# this U-Boot. The Realtek SPI loader reads it from eMMC byte 0x20000.
function uboot_custom_postprocess() {
	[[ ${RTD129X_EMMC_BOOTAREA} == yes ]] || return 0
	run_host_command_logged python3 "${SRC}/packages/blobs/rtd129x/mkbootarea.py" \
		"${SRC}/packages/blobs/rtd129x" u-boot.bin rtd129x-emmc-boot.bin
}

# SD card: U-Boot at 40 KiB. eMMC: the whole boot area at 0x20000, or
# U-Boot at 40 KiB without a boot area (RTD1395).
# The RTD1395 SPI loader cannot read U-Boot raw from the eMMC. It loads
# u-boot-bpi-m4.bin from FAT partition 1. Keep that partition in the 16 MiB
# gap before the root and make it entry 1. The root keeps its UUID.
function write_uboot_platform() {
	if [[ $2 == /dev/mmcblk* && -b ${2}boot0 && -f $1/rtd129x-emmc-boot.bin ]]; then
		dd if="$1/rtd129x-emmc-boot.bin" of="$2" bs=512 seek=256 conv=notrunc,fsync status=none
		return
	fi
	dd if="$1/u-boot.bin" of="$2" bs=1024 seek=40 conv=notrunc,fsync status=none
	[[ $2 == /dev/mmcblk* && -b ${2}boot0 && -f /proc/device-tree/compatible ]] || return 0
	grep -q "realtek,rtd1395" /proc/device-tree/compatible || return 0

	local fat_start=8192 fat_size=24576 table loop mnt rc=0
	table=$(sfdisk -d "$2") || return 1
	if ! grep -qE "^${2}p1 *: start= *${fat_start}, size= *${fat_size}, type=c" <<< "${table}"; then
		# only an MBR with the gap free and a free entry
		grep -q "^label: dos" <<< "${table}" || return 1
		[[ $(grep -c "^${2}p" <<< "${table}") -lt 4 ]] || return 1
		awk -v end=$((fat_start + fat_size)) '/^\/dev\// {
			split($0, f, "start="); if (f[2] + 0 < end) exit 1 }' <<< "${table}" || return 1
		{
			grep -E "^(label|label-id|unit):" <<< "${table}"
			echo "start=${fat_start}, size=${fat_size}, type=c"
			grep "^${2}p" <<< "${table}" | sed 's/^[^:]*: *//'
		} | sfdisk --quiet --no-reread --no-tell-kernel "$2" || return 1
	fi

	loop=$(losetup -f --show -o $((fat_start * 512)) --sizelimit $((fat_size * 512)) "$2") || return 1
	blkid -p -s TYPE -o value "${loop}" | grep -q vfat || mkfs.vfat -n BPI-BOOT "${loop}" > /dev/null || rc=1
	mnt=$(mktemp -d)
	if [[ $rc == 0 ]] && mount "${loop}" "${mnt}"; then
		cp "$1/u-boot.bin" "${mnt}/u-boot-bpi-m4.bin" || rc=1
		umount "${mnt}"
	else
		rc=1
	fi
	rmdir "${mnt}"
	losetup -d "${loop}"
	sync
	return $rc
}

function post_family_tweaks_bsp__rtd129x_audio_firmware() {
	[[ ${RTD129X_AUDIO_FW} == yes ]] || return 0
	display_alert "${BOARD}" "Add audio firmware" "${RTD129X_AUDIO_FW_FILE}"
	run_host_command_logged mkdir -p "${destination}/boot"
	run_host_command_logged cp -v "${SRC}/packages/blobs/rtd129x/${RTD129X_AUDIO_FW_FILE}" \
		"${destination}/boot/bluecore.audio"
}
