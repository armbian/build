[pytest]
minversion = 6.0
testpaths = boardfamily board
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -v --strict-markers
markers =
    boardfamily: tests exercising SoC/boardfamily on-chip hardware/subsystems
    soc: alias for boardfamily
    board: tests exercising board-level circuitry and peripherals
    hardware: tests requiring external hardware connected (drives, network cables, etc.)
    interactive: tests requiring human interaction or visual confirmation
    slow: tests that take more than a few seconds to run
    timeout: per-test execution timeout duration

