# Left to itself PipeWire opens this card MMAP_NONINTERLEAVED / S24_LE with a
# 1040 frame period and wedges: the period is not a whole number of the 80
# frame VBC fifo fragments the DMA moves, and the non-interleaved path is a
# different code path in the driver than the one this hardware is exercised
# on. Interleaved S16_LE at 48 kHz with a 1280 frame period is what plays.
# The capture front end (hw:0,2, FE_ST_CAPTURE_DSP) sits on the same DMA
# transport, so it gets the same constraints.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" }, { node.name = "~alsa_input.*" } ]
    actions = {
      update-props = {
        audio.format          = "S16LE"
        audio.rate            = 48000
        api.alsa.disable-mmap = true
        api.alsa.period-size  = 1280
        api.alsa.headroom     = 4096
      }
    }
  }
]
