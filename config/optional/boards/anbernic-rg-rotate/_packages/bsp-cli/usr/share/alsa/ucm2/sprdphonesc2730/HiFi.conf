# Speaker path: codec DAC -> HPL/HPR headphone mixers -> HP pins -> external
# AW87391 PA (driven over i2c2 from inside the codec driver, no mixer control).
# The SC2730 class-D SPK pin is not used, so SPKL Gain / SPKL Mixer stay off.
#
# Values come from the stock Android mixer capture (idle -> playing delta in
# beebono/rg-rotate-linux docs/stock_mixer_{idle,during}.txt) plus
# "DSP VBC Profile Select", which is silent at its mainline default.
#
# agdsp_access_en has to come first: codec digital register writes are gated
# on agdsp_can_access() and are silently dropped while the audio DSP is
# asleep, so anything sequenced before it is a no-op.

SectionVerb {
	EnableSequence [
		cset "name='agdsp_access_en' on"
		cset "name='agdsp_access_a2dp_en' on"
		cset "name='DSP VBC Profile Select' 961216512"
		cset "name='VBC DAC0 AUD MDG Set' 1,1024"
		cset "name='VBC_DAC0_DP_EN' enable"
		cset "name='VBC_MIXER0_DAC0' HALF_ADD"
		cset "name='VBC DAC0 DG Set' 25,25"
		cset "name='DAC LRCLK Select' invert"
		cset "name='HP mix mode' 0"
	]

	DisableSequence [
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal speaker"

	# S_FAST_P_CODEC is the scene switch for FE_ST_FAST (device 3); without
	# it the PCM cannot be opened at all (snd_pcm_open returns -EIO).
	EnableSequence [
		cset "name='S_FAST_P_CODEC SWITCH' on"
		cset "name='HPL Mixer DACLHPL Switch' on"
		cset "name='HPR Mixer DACRHPR Switch' on"
		cset "name='HPL EAR Sel' HPL"
		cset "name='Speaker Function' on"
		cset "name='Speaker1 Function' on"
		cset "name='Inter PA Config' 303"
		cset "name='DAC Gain DAC Playback Volume' 3"
		cset "name='HPL Gain HPL Playback Volume' 4"
		cset "name='HPR Gain HPR Playback Volume' 4"
	]

	DisableSequence [
		cset "name='Speaker Function' off"
		cset "name='Speaker1 Function' off"
		cset "name='S_FAST_P_CODEC SWITCH' off"
	]

	# ${CardId} is not defined on the lookup path this profile is found
	# through, so the card number is spelled out. This board has exactly one
	# sound card and it is always 0.
	Value {
		PlaybackPCM "hw:0,3"
		PlaybackChannels 2
		PlaybackRate 48000
		PlaybackPriority 100
	}
}

SectionDevice."Mic" {
	Comment "Internal microphone"

	# Capture is device 2, FE_ST_CAPTURE_DSP - the DSP-mediated record front
	# end, the capture counterpart of FE_ST_FAST. The path is the codec's
	# main mic (MICBIAS1) -> ADCL mixer -> ADC0 -> codec ADC IIS -> ag_iis1 ->
	# VBC ADC0 -> AUDRCD01 -> FE. The mic is mono and lands on the left
	# channel (VBC_DSP_MAINMIC_PATH_SEL = MAINMIC_FROM_LEFT); the right
	# channel is silent. ag_iis1_ext_sel is the ADC-side twin of the AG_IIS0
	# route the codec driver enables at probe for playback; nothing turns it
	# on for capture, so it is done here.
	EnableSequence [
		cset "name='Mic Function' on"
		cset "name='MICBIAS1 Power' on"
		cset "name='ADCL Mixer MainMICADCL Switch' on"
		cset "name='AUD ADC0L Switch' on"
		cset "name='AUD ADC0R Switch' on"
		cset "name='ADC LRCLK Select' normal"
		cset "name='ag_iis1_ext_sel' enable"
		cset "name='ag_iis1_ext_sel_v1' top_adc_iis0"
		cset "name='VBC_MUX_ADC0_SOURCE' ADC_SOURCE_IIS"
		cset "name='VBC_MUX_ADC0' ADC_IN_IIS0_ADC"
		cset "name='VBC_MUX_ADC0_IIS_PORT_SEL' VBC_IIS_PORT_IIS1"
		cset "name='VBC_MUX_AUDRCD01' AUDRCD_IN_ADC0"
		cset "name='VBC ADC0 DG Set' 25,25"
		cset "name='VBC_ADC0_DP_EN' enable"
		cset "name='VBC_DSP_MAINMIC_PATH_SEL' MAINMIC_FROM_LEFT"
		cset "name='S_CAPTURE_DSP_CODEC SWITCH' on"
		cset "name='ADCL Gain ADCL Capture Volume' 8"
		cset "name='ADCR Gain ADCR Capture Volume' 8"
	]

	DisableSequence [
		cset "name='S_CAPTURE_DSP_CODEC SWITCH' off"
		cset "name='Mic Function' off"
		cset "name='MICBIAS1 Power' off"
	]

	Value {
		CapturePCM "hw:0,2"
		CaptureChannels 2
		CaptureRate 48000
		CapturePriority 100
	}
}
