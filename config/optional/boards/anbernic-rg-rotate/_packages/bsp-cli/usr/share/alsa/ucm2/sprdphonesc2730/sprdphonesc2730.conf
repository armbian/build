Syntax 6

# UCM profile for the Unisoc UMS512 (T618) on-PMIC codec as wired on the
# Anbernic RG Rotate.
#
# The card exposes twelve DSP front ends and no plain "analog out", so without
# a profile the ALSA card profile fallback probes front:0 / surround40:0 and
# so on, finds none of them, and PipeWire ends up with only a Dummy sink.
#
# Speaker playback is device 3, FE_ST_FAST - the DSP/MCDT-mediated fast
# playback front end. Device 0 (FE_ST_NORMAL_AP01) is the AP-direct VBC FIFO
# path and is NOT usable on this board: its converter runs at half the rate
# the FIFO is drained at, so playback comes out an octave low with a click on
# every period boundary. Microphone capture is device 2, FE_ST_CAPTURE_DSP,
# the DSP-mediated record front end. Everything else is voice/FM/loopback/A2DP.
#
# Directory/file naming: alsa-lib only found this profile through the
# "${OpenName}" lookup, i.e. the card id (sprdphonesc2730) - not the
# conf.d/${CardDriver}/${CardLongName}.conf layout. Note the card's driver
# string is truncated to sprdphone-sc273 because struct snd_card::driver is
# 16 bytes and the name is exactly 16 characters long.
#
# This file and HiFi.conf next to it are the only real files. alsa-lib tries
# several names for this card, and which one it settles on has varied between
# releases, so the other spellings it can ask for are shipped as symlinks back
# here rather than as copies:
#
#   sprdphone-sc2730/{HiFi,sprdphone-sc2730}.conf
#   sprdphone-sc273/{HiFi,sprdphone-sc273,sprdphone-sc2730}.conf
#   conf.d/sprdphone-sc273/{HiFi,sprdphone-sc273,sprdphone-sc2730}.conf
#
# Edit this file; the rest follow.

Comment "Anbernic RG Rotate (Unisoc UMS512 / SC2730)"

SectionUseCase."HiFi" {
	File "HiFi.conf"
	Comment "Speaker playback and microphone capture"
}
