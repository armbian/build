# RG Vita Pro: the built-in codec (speakers + headphone jack) and HDMI show up
# as two sinks with the same name ("Built-in Audio Stereo") and the same
# priority, so WirePlumber may pick HDMI and the unit stays silent. Prefer the
# codec and give both sinks telling names. Speaker/headphone switching on jack
# insertion is done by vita-jack-switch.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        alsa.card_name = "rockchip,es8388-codec"
      }
    ]
    actions = {
      update-props = {
        node.description = "Speakers / Headphones"
        priority.session = 1100
        priority.driver = 1100
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        alsa.card_name = "HDMI"
      }
    ]
    actions = {
      update-props = {
        node.description = "HDMI"
      }
    }
  }
]
