config:
  name: rk35xx-6.1
  kind: kernel
  type: vendor
  branch: rk-6.1-rkr7.2
  last-known-good-tag: v6.1.115

  # The RK3506 vendor kernel uses the 32-bit ARM DT directory.
  dts-directories:
    - { source: "dt", target: "arch/arm64/boot/dts/rockchip" }
    - { source: "dt-arm", target: "arch/arm/boot/dts" }

  auto-patch-dt-makefile:
    - { incremental: true, directory: "arch/arm64/boot/dts/rockchip", config-var: "CONFIG_ARCH_ROCKCHIP" }
    - { incremental: true, directory: "arch/arm/boot/dts", config-var: "CONFIG_ARCH_ROCKCHIP" }

  patches-to-git:
    do-not-commit-files:
      - "MAINTAINERS"
      - "Documentation/devicetree/bindings/arm/rockchip.yaml"
    do-not-commit-regexes:
      - "^arch/([a-zA-Z0-9]+)/boot/dts/([a-zA-Z0-9]+)/Makefile$"
