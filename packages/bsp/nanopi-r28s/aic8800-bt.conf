# Load the AIC8800 SDIO BSP before binding the Bluetooth HCI UART.
# The delay avoids the firmware-initialization race during cold boot.
install hci_uart /bin/sh -c '\
    if modprobe -n -q aic8800_bsp 2>/dev/null; then \
        /sbin/modprobe aic8800_bsp && /bin/sleep 2; \
    fi; \
    /sbin/modprobe --ignore-install hci_uart \
'
