# Ask for the DHCPv4 lease under the MAC address rather than under a DUID.
#
# systemd-networkd's default, ClientIdentifier=duid, puts an RFC 4361 identifier
# on the wire: ff <iaid> <duid>, where the IAID is a hash of the interface's
# persistent name - or, with no ID_NET_NAME_* to hash, of its hardware address.
# On the ethernet that already comes out stable, because
# /lib/udev/sg200x-stable-mac derives the address from the chip's efuse serial
# and nothing renames the interface, so both halves end up being functions of
# the SoC's serial number.
#
# Stable is not the same as recognisable, though. A dhcp-host= reservation
# written against the MAC is matched on the chaddr, while the lease itself is
# filed under the identifier - a distinction that only ever surfaces as an
# evening spent wondering why a reservation is being ignored. Sending the MAC as
# the identifier removes the question, and costs nothing here: it is the same
# address either way.
#
# A drop-in rather than an edit to the netplan YAML on purpose.
# extensions/network/config-networkd/netplan/10-dhcp-all-interfaces.yaml is
# shared by every board in the tree, and netplan's merge semantics for a device
# id defined in two files are not something to build on. A drop-in is purely
# additive: if that file ever renames the device id this quietly stops applying,
# which is the right failure. Images built with NetworkManager have no netplan
# and ignore it either way.
#
# The Wi-Fi is not covered here - its netplan device id is whatever the person
# who configured the network called it, so there is no drop-in directory to
# aim at. It does not need to be: patch/misc/aic8800 fixes the perm_addr the
# Wi-Fi IAID is derived from, at the source. To pin it from the config side as
# well, add `dhcp-identifier: mac` to the wifis: block in /etc/netplan.

[DHCPv4]
ClientIdentifier=mac
