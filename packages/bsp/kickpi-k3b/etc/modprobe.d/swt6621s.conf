# KICKPI K3B's firmware is installed by armbian/firmware in /lib/firmware/seekwave.
# The new driver no longer requires a specific module loading order, but keep
# the softdep entries below to preserve an explicit loading order.
options skw_sdio_lite firmware_dir=seekwave
options swt6621s_wifi firmware_dir=seekwave
options skwbt firmware_dir=seekwave
softdep swt6621s_wifi pre: skw_sdio_lite
softdep skwbt pre: swt6621s_wifi
