# WirePlumber config for Xiaomi Pad 6S Pro (sheng)
#
# The sm8550 DSP sound card has a single PCM (hw:0,0) that carries the
# secondary I2S (speakers). ACP (audio card profile) probing fails on this
# card (no useful profiles), which made WirePlumber fall back to the Dummy
# Output and thus no sound. Using the card directly (no ACP) makes
# WirePlumber create real ALSA sinks for hw:0,0 / hw:0,1 / hw:0,2.

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
      }
    }
  }
]