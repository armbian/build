SectionDevice."Headphones" {
	Comment "Headphones"

	# Not left to the BootSequence: that only runs when alsactl
	# initialises the card, which does not happen on a fresh image.
	EnableSequence [
		cset "name='Left Mixer Left Playback Switch' on"
		cset "name='Right Mixer Right Playback Switch' on"
		cset "name='OUT1 Switch' on"
		cset "name='hp switch' on"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId}"
		PlaybackMixerElem "Output 1"
		PlaybackMasterElem "PCM"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='Left PGA Mux' 'Line 2L'"
		cset "name='ADC Data Select' 'Left Left'"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId}"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='Headset Mic Switch' on"
		cset "name='Right PGA Mux' 'Line 2R'"
		cset "name='ADC Data Select' 'Right Right'"
	]

	DisableSequence [
		cset "name='Headset Mic Switch' off"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId}"
		JackControl "Headset Mic Jack"
	}
}
