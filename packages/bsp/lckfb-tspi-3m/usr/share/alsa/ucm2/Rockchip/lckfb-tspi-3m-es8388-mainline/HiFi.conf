SectionDevice."Headphones" {
	Comment "Headphones"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId}"
		PlaybackMixerElem "Output 1"
		PlaybackMasterElem "PCM"
		JackControl "Headphones Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		cset "name='Left PGA Mux' 'Line 2'"
		cset "name='Right PGA Mux' 'Line 2'"
		# Fixed +24 dB preamp. Not exposed as the capture volume: its
		# scale starts at 0 dB, which a sound server takes as 100 %
		# and the microphone is then far too quiet.
		cset "name='Mic PGA Volume' 8"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId}"
		CaptureMixerElem "Capture Digital"
	}
}
