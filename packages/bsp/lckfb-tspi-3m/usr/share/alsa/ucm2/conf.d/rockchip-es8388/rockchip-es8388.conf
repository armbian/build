Syntax 3

# LCKFB TaishanPi 3M: ES8388 codec on the vendor kernel's rk-multicodecs card.
# Headphone on LOUT1/ROUT1, onboard microphone on LINPUT2, headset
# microphone on RINPUT2, with jack detection for both.

SectionUseCase."HiFi" {
	File "/Rockchip/lckfb-tspi-3m-es8388/HiFi.conf"
	Comment "Play HiFi quality Music"
}

BootSequence [
	# Playback: DAC to the output mixers, OUT1 enabled, 0 dB
	cset "name='Left Mixer Left Playback Switch' on"
	cset "name='Right Mixer Right Playback Switch' on"
	cset "name='OUT1 Switch' on"
	cset "name='PCM Volume' 192"
	cset "name='Output 1 Playback Volume' 30"
	cset "name='hp switch' on"

	# Capture: microphone preamp +24 dB, ADC 0 dB, no ALC
	cset "name='ALC Capture Function' 0"
	cset "name='Capture Digital Volume' 192"
	cset "name='Left Channel Capture Volume' 8"
	cset "name='Right Channel Capture Volume' 8"
	cset "name='Capture Mute' off"
	cset "name='Main Mic Switch' on"
]
