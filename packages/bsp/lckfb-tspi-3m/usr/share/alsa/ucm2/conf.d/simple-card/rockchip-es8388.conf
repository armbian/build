Syntax 3

# LCKFB TaishanPi 3M: ES8388 codec with the mainline es8328 driver on a
# simple-audio-card (card long name "rockchip-es8388").
# Headphones on LOUT1/ROUT1 with jack detection, onboard microphone on
# LINPUT2.

SectionUseCase."HiFi" {
	File "/Rockchip/lckfb-tspi-3m-es8388-mainline/HiFi.conf"
	Comment "Play HiFi quality Music"
}

BootSequence [
	# Playback at 0 dB
	cset "name='PCM Volume' 192"
	cset "name='Output 1 Playback Volume' 30"

	# Capture: onboard microphone, preamp +24 dB, ADC 0 dB
	cset "name='Left PGA Mux' 'Line 2'"
	cset "name='Right PGA Mux' 'Line 2'"
	cset "name='Mic PGA Volume' 8"
	cset "name='Capture Digital Volume' 192"
]
