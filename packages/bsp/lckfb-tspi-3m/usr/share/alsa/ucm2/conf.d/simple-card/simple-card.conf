Syntax 3

# LCKFB TaishanPi 3M: ES8388 codec with the mainline es8328 driver on a
# simple-audio-card named "rockchip-es8388".
# Headphones on LOUT1/ROUT1 with jack detection, onboard microphone on
# LINPUT2.
#
# UCM looks for conf.d/simple-card/<card long name>.conf first and then for
# this file. The long name is not stable: it is the card name on a U-Boot
# boot, but under UEFI firmware ASoC builds it from the SMBIOS (DMI)
# strings, and every simple-audio-card on the board (ES8388, HDMI, DP) gets
# the same one. So match the card name, which does not change, and leave the
# other cards without a profile, as before.

If.lckfb_tspi_3m_es8388 {
	Condition {
		Type String
		String1 "${CardName}"
		String2 "rockchip-es8388"
	}
	True {
		SectionUseCase."HiFi" {
			File "/Rockchip/lckfb-tspi-3m-es8388-mainline/HiFi.conf"
			Comment "Play HiFi quality Music"
		}

		BootSequence [
			# Playback at 0 dB
			cset "name='PCM Volume' 192"
			cset "name='Output 1 Playback Volume' 30"

			# Capture: onboard microphone, preamp +24 dB, ADC 0 dB
			cset "name='Left PGA Mux' 'Line 2'"
			cset "name='Right PGA Mux' 'Line 2'"
			cset "name='Mic PGA Volume' 8"
			cset "name='Capture Digital Volume' 192"
		]
	}
}
