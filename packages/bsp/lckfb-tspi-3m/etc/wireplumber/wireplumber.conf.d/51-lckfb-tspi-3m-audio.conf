# LCKFB TaishanPi 3M sound devices.
#
# WirePlumber calls every card "Built-in Audio" and prefers DP (USB-C), or
# the 4G module's call-audio device once that is enabled. Name them and
# make the onboard ES8388 the default output and input.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-es8388-sound.*" } ]
    actions = { update-props = { node.description = "Onboard Headphones (ES8388)", priority.session = 2000, priority.driver = 2000 } }
  }
  {
    matches = [ { node.name = "~alsa_input.platform-es8388-sound.*" } ]
    # above the headphone sink: WirePlumber also counts the sink monitor
    # as a capture candidate, and on a tie it picked the monitor
    actions = { update-props = { node.description = "Onboard Microphone (ES8388)", priority.session = 2100, priority.driver = 2100 } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-hdmi-sound.*" } ]
    actions = { update-props = { node.description = "HDMI" } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-dp0-sound.*" } ]
    actions = { update-props = { node.description = "DisplayPort (USB-C)" } }
  }
  {
    # Quectel EC20/EC25 USB audio: carries phone call audio only
    matches = [ { node.name = "~alsa_(input|output).usb-Quectel_.*" } ]
    actions = { update-props = { node.description = "4G Modem (call audio)", priority.session = 100, priority.driver = 100 } }
  }
]
