# bluez's unit asks systemd for ConfigurationDirectory=bluetooth with mode
# 0555, but the Debian/Ubuntu bluez package ships /etc/bluetooth as 0755, so
# bluetoothd logs at every start:
#   bluetooth.service: ConfigurationDirectory 'bluetooth' already exists but
#   the mode is different. (File system: 755 ConfigurationDirectoryMode: 555)
# Match the mode the package installs; nothing else about the unit changes.
[Service]
ConfigurationDirectoryMode=0755
