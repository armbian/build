# Debian/Ubuntu cron.service runs "cron -f -P $EXTRA_OPTS" and only sources
# /etc/default/cron, where EXTRA_OPTS is commented out by default. systemd
# therefore logs at every boot:
#   cron.service: Referenced but unset environment variable evaluates to an
#   empty string: EXTRA_OPTS
# Define it (empty) so the unit is well-formed; a value set in
# /etc/default/cron still takes precedence (EnvironmentFile= is applied
# after Environment=).
[Service]
Environment=EXTRA_OPTS=
