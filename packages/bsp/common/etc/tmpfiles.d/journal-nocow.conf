# Armbian override of systemd's /usr/lib/tmpfiles.d/journal-nocow.conf.
#
# armbian-ramlog mounts a tmpfs/zram volume on /var/log and replaces
# /var/log/journal with a symlink to the persistent copy under /var/log.hdd.
# systemd's stock file then tries to set the btrfs NOCOW attribute on the
# symlink and logs at every boot:
#   systemd-tmpfiles: Setting file flags is only supported on regular files
#   and directories, cannot set on '/var/log/journal'.
# Apply the (btrfs-only, best effort) attribute to the real directories
# instead. Paths that do not exist (ramlog disabled, non-btrfs) are ignored.
h /var/log.hdd/journal - - - - +C
h /var/log.hdd/journal/%m - - - - +C
h /var/log.hdd/journal/remote - - - - +C
