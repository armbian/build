	True.SectionDevice."HDMI5" {
		Comment "HDMI/DP 5"
		Value {
			PlaybackPriority 1096
			PlaybackPCM "hw:${CardId},4"
			JackControl "HDMI/DP,pcm=4 Jack"
		}
	}
