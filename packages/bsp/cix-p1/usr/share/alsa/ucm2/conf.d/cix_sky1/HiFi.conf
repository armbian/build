# CIX Sky1 (CD8180/CD8160) HDMI/DP audio. Boards expose different outputs,
# so each device exists only when its jack control exists.

SectionVerb {
	EnableSequence []
	DisableSequence []
	Value {
		TQ "HiFi"
	}
}

If.hdmi0 {
	Condition {
		Type ControlExists
		Control "iface=CARD,name='HDMI/DP,pcm=0 Jack'"
	}
	True.SectionDevice."HDMI1" {
		Comment "HDMI/DP 1"
		Value {
			PlaybackPriority 1100
			PlaybackPCM "hw:${CardId},0"
			JackControl "HDMI/DP,pcm=0 Jack"
		}
	}
}

If.hdmi1 {
	Condition {
		Type ControlExists
		Control "iface=CARD,name='HDMI/DP,pcm=1 Jack'"
	}
	True.SectionDevice."HDMI2" {
		Comment "HDMI/DP 2"
		Value {
			PlaybackPriority 1099
			PlaybackPCM "hw:${CardId},1"
			JackControl "HDMI/DP,pcm=1 Jack"
		}
	}
}

If.hdmi2 {
	Condition {
		Type ControlExists
		Control "iface=CARD,name='HDMI/DP,pcm=2 Jack'"
	}
	True.SectionDevice."HDMI3" {
		Comment "HDMI/DP 3"
		Value {
			PlaybackPriority 1098
			PlaybackPCM "hw:${CardId},2"
			JackControl "HDMI/DP,pcm=2 Jack"
		}
	}
}

If.hdmi3 {
	Condition {
		Type ControlExists
		Control "iface=CARD,name='HDMI/DP,pcm=3 Jack'"
	}
	True.SectionDevice."HDMI4" {
		Comment "HDMI/DP 4"
		Value {
			PlaybackPriority 1097
			PlaybackPCM "hw:${CardId},3"
