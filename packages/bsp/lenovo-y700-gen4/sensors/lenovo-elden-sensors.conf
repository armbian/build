[Unit]
ConditionPathExists=/usr/share/lenovo-elden-sensors/libexec/iio-sensor-proxy
Requires=lenovo-elden-sensors-rpc.service
PartOf=lenovo-elden-sensors-rpc.service
After=lenovo-elden-sensors-rpc.service

[Service]
ExecStart=
ExecStart=/usr/share/lenovo-elden-sensors/libexec/iio-sensor-proxy
Environment=LD_LIBRARY_PATH=/usr/share/lenovo-elden-sensors/lib
RestrictAddressFamilies=AF_QIPCRTR
