SectionVerb {
	Value {
		TQ "HiFi"
	}

	EnableSequence [
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 1"
		# Connect the capture backend before PipeWire probes the HiFi PCM devices.
		# Without this route, opening the capture PCM fails and HiFi is rejected.
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
		cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."Mic" {
	Comment "Built-in microphones"

	EnableSequence [
		# AMIC1 and AMIC4 are routed through ADC1 and ADC3 respectively.
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC3 MUX' CH3_AMIC4"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC3 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC3_MIXER Switch' 1"
		cset "name='ADC1 Volume' 10"
		cset "name='ADC3 Volume' 10"
		cset "name='TX0 MODE' ADC_LP"
		cset "name='TX2 MODE' ADC_LP"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX SMIC MUX1' SWR_MIC2"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		# Unity digital gain; desktop capture volume remains software-controlled.
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX_DEC1 Volume' 84"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC3_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC3 Switch' 0"
		cset "name='ADC1 MUX' CH1_AMIC_DISABLE"
		cset "name='ADC3 MUX' CH3_AMIC_DISABLE"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 2
	}
}

SectionDevice."Speakers" {
	Comment "Built-in speakers"

	EnableSequence [
		cset "name='Left Playback Volume' 950"
		cset "name='Right Playback Volume' 950"
	]

	DisableSequence [
		cset "name='Left Playback Volume' 0"
		cset "name='Right Playback Volume' 0"
	]

	# software volume now
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
