# The root filesystem fills the vendor userdata partition. Grow ext4 only.
[Service]
ExecCondition=/bin/sh -ec 'test "$(findmnt -nro FSTYPE /)" = ext4; test "$(lsblk -dnro PARTLABEL "$(findmnt -nro SOURCE /)")" = userdata'
ExecStart=
# Honour the standard opt-out marker of armbian-resize-filesystem.
ExecStart=/bin/sh -ec 'test -f /root/.no_rootfs_resize || resize2fs "$(findmnt -nro SOURCE /)"'
ExecStartPost=/usr/bin/systemctl disable armbian-resize-filesystem.service
