# SeekWave SWT6621S WiFi/BT SDIO driver (KickPi K2B V2)
# Load the SDIO HAL first: it probes SDIO 1ffe:6621, boots the chip and
# allocates the "sv6621s_wireless1" / "skwbt" platform devices.
# swt6621s_wifi and skwbt are loaded explicitly because the platform device
# sysfs name gets a ".N.auto" suffix (PLATFORM_DEVID_AUTO), so the kernel's
# module-autoloader modalias never matches the driver name on 6.18 - loading
# them here is the reliable path (manual modprobe binds fine).
skw_sdio_lite
swt6621s_wifi
skwbt
