name: "Maintenance: Pull request dependencies"

# Holds a PR while its Depends-on: lines are not met, and comments when its Notify-when: lines are.
# The syntax of the lines: https://github.com/armbian/actions/tree/main/depends-on

on:
  # We never check out the PR code; the action reads the PR only through the API.
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, closed]
  # Dependencies in other repositories change without an event here.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: depends-on-${{ github.event.pull_request.number || 'all' }}
  cancel-in-progress: false

jobs:
  # Reads the PR bodies and the dependencies with a read-only token.
  evaluate:
    name: "Evaluate"
    if: ${{ github.repository == 'armbian/build' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      result: ${{ steps.evaluate.outputs.result }}
    steps:
      - id: evaluate
        uses: armbian/actions/depends-on@72cf80c592193ba43056219c9e657bb4738b82bc # main
        with:
          mode: evaluate

  # Writes statuses, comments and labels from the decisions of evaluate.
  apply:
    name: "Apply"
    needs: evaluate
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      pull-requests: write
    steps:
      - uses: armbian/actions/depends-on@72cf80c592193ba43056219c9e657bb4738b82bc # main
        with:
          mode: apply
          result: ${{ needs.evaluate.outputs.result }}
