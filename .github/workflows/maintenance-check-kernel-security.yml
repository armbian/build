name: "Maintenance: Analyze kernel security"
run-name: 'Check kernel security options - PR #${{ github.event.pull_request.number }} ("${{ github.event.pull_request.title }}")'
#
#  Check the Linux kernel options against security hardening
#
#  Attention! Changing security parameters may also affect system performance and functionality of userspace software!
#  More info:
#  https://github.com/a13xp0p0v/kernel-hardening-checker

on:
  workflow_dispatch:

  pull_request:
    types: [ready_for_review, opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pipeline-security-${{github.event.pull_request.number}}
  cancel-in-progress: true

jobs:
  Analysis:
    name: Check kernel security options
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Armbian' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v46.0.5

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: a13xp0p0v/kconfig-hardened-check
          path: kconfig-hardened-check

      - name: Install kconfig build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq flex bison

      - name: Check kernel config for security issues
        # Kernel configs are defconfigs. The checker needs a full .config, so expand each one first.
        # sed explanation: 1) Put spaces in front of every line 2) replace colored output with emojis since GitHub Actions job summaries don't support colored output
        # shell: bash sets pipefail, so a checker failure gives the warning
        shell: bash
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
              [[ "${file}" == config/kernel/*.config ]] || continue
              full="${RUNNER_TEMP}/$(basename "${file}")"
              echo "### ${file}" >> $GITHUB_STEP_SUMMARY
              if ! .github/expand_kernel_defconfig.sh "${file}" "${full}"; then
                  echo "⚠️ Cannot expand to a full config, not checked" >> $GITHUB_STEP_SUMMARY
                  continue
              fi
              kconfig-hardened-check/bin/kernel-hardening-checker -m show_fail -c "${full}" | sed 's/^/     /; s/\x1b\[32m/✅ /; s/\x1b\[31m/❌ /; s/\x1b\[0m//' >> $GITHUB_STEP_SUMMARY ||
                  echo "⚠️ Checker failed (architecture not supported?)" >> $GITHUB_STEP_SUMMARY
          done
