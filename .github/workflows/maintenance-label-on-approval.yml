name: "Maintenance: Label PR on approval"
on:
  workflow_run:
    workflows: ["Maintenance: Listen PR review"]
    types: [completed]

permissions:
  contents: read

jobs:
  label:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Download PR number artifact from upstream run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-number-${{ github.event.workflow_run.id }}   # same unique name
          path: .
          run-id: ${{ github.event.workflow_run.id }}           # ← CRITICAL: fetch from the upstream run
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Validate here, at the point the value enters the job: everything below
      # consumes it and then reads and writes labels. A check further down
      # would run after those writes.
      - id: pr
        run: |
          number="$(tr -d '[:space:]' < pr.txt)"
          case "${number}" in
            '' | *[!0-9]*) echo "::error::pr.txt is not a PR number: '${number}'"; exit 1 ;;
            0*)            echo "::error::pr.txt is not a canonical PR number: '${number}'"; exit 1 ;;
          esac
          echo "number=${number}" >> "$GITHUB_OUTPUT"

      # "Ready to merge" follows the review state: a committer approval adds it,
      # a withdrawn approval or a change request removes it.
      - name: Label when approved
        id: approval
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = Number(process.env.PR_NUMBER);
            const LABEL = "Ready to merge";

            // Latest approval or change request of each committer (write or admin).
            // An approval counts only for the current head: a push removes the label.
            // A dismissal clears the reviewer's state; an older approval does not return.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number, per_page: 100 });
            const permission = {};
            const state = {};
            for (const r of reviews) {
              if (!r.user || !["APPROVED", "CHANGES_REQUESTED", "DISMISSED"].includes(r.state)) continue;
              const login = r.user.login;
              if (!(login in permission)) {
                const { data } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: login });
                permission[login] = ["admin", "write"].includes(data.permission);
              }
              if (!permission[login]) continue;
              if (r.state === "DISMISSED") delete state[login];
              else if (r.state === "APPROVED" && r.commit_id !== pr.head.sha) delete state[login];
              else state[login] = r.state;
            }
            const states = Object.values(state);
            const approved = states.includes("APPROVED") && !states.includes("CHANGES_REQUESTED");
            core.info(`Committer reviews: ${JSON.stringify(state)} -> approved=${approved}`);
            core.setOutput("isApproved", String(approved));

            const { data: labels } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number: pull_number, per_page: 100 });
            const has = labels.some(l => l.name === LABEL);
            if (approved && !has) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pull_number, labels: [LABEL] });
              await github.rest.issues.createComment({ owner, repo, issue_number: pull_number,
                body: "✅ This PR has been reviewed and approved — all set for merge!" });
            } else if (!approved && has) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: pull_number, name: LABEL });
            }

      - name: Remove review-related labels
        # Not just success(): the step exits 0 with isApproved=false when no
        # committer approves, and anyone with read access can approve a PR on a
        # public repo. Without this gate a drive-by approval clears the
        # review-tracking labels below.
        if: ${{ success() && steps.approval.outputs.isApproved == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        with:
          script: |
            const { owner, repo } = context.repo;
            // Belt and braces: the `pr` step above already rejects anything that
            // is not canonical digits. Kept because Number.parseInt takes the
            // longest valid prefix, so "123abc" and "1e3" would coerce to 123 and
            // 1 and sail past an isInteger check if that gate ever moved.
            const raw = (process.env.PR_NUMBER || "").trim();
            if (!/^[1-9][0-9]*$/.test(raw)) {
              core.setFailed(`Invalid PR number in PR_NUMBER: ${JSON.stringify(raw)}`);
              return;
            }
            const issue_number = Number(raw);
            // "Work in progress" is owned by maintenance-label-wip.yml (synced from
            // review decision + unresolved conversations), so it is not removed here.
            const labelsToRemove = ["Needs review", "Backlog", "Can be closed?", "Help needed", "Needs Documentation"];

            for (const name of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
                core.info(`Removed label "${name}"`);
              } catch (e) {
                core.warning(`Could not remove label "${name}": ${e.message}`);
              }
            }