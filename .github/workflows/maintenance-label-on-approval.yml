name: "Maintenance: Label PR on approval"
on:
  workflow_run:
    workflows: ["Maintenance: Listen PR review"]
    types: [completed]

permissions:
  contents: read

jobs:
  pr:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      number: ${{ steps.pr.outputs.number }}

    steps:
      # The listener runs on pull_request_review (fork-controlled), so its
      # artifact is untrusted: download it into RUNNER_TEMP, never the checkout.
      - name: Download PR number artifact from upstream run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-number-${{ github.event.workflow_run.id }}   # same unique name
          path: ${{ runner.temp }}/listener
          run-id: ${{ github.event.workflow_run.id }}           # ← CRITICAL: fetch from the upstream run
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Validate here, at the point the value enters the job: everything below
      # consumes it and then reads and writes labels. A check further down
      # would run after those writes.
      - id: pr
        run: |
          number="$(tr -d '[:space:]' < "${RUNNER_TEMP}/listener/pr.txt")"
          case "${number}" in
            '' | *[!0-9]*) echo "::error::pr.txt is not a PR number: '${number}'"; exit 1 ;;
            0*)            echo "::error::pr.txt is not a canonical PR number: '${number}'"; exit 1 ;;
          esac
          echo "number=${number}" >> "$GITHUB_OUTPUT"

  label:
    needs: pr
    # Same group as the push job in maintenance-auto-label.yml: one
    # "Ready to merge" sync per PR at a time, so each sync reads the state
    # after the earlier sync has written its label. A newer pending sync
    # replaces an older one; it reads the live state, so nothing is lost.
    concurrency:
      group: ready-label-${{ needs.pr.outputs.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      # Default branch (trusted): the shared label logic is never PR-authored code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # "Ready to merge" follows the review state: a committer approval of the
      # current head adds it, a withdrawn approval or a change request removes it.
      # A committer approval also removes the review labels ("Needs review" etc).
      - name: Label when approved
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.pr.outputs.number }}
        with:
          script: |
            const { syncOne } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ready-label.js`);
            await syncOne({ github, core, owner: context.repo.owner, repo: context.repo.repo,
              number: Number(process.env.PR_NUMBER) });

