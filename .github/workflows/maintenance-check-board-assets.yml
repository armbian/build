name: "Maintenance: Check board assets"

on:
  pull_request_target:
    paths:
      - "config/boards/**"

env:
  WEBSITE_REPO: "armbian/armbian.github.io"
  WEBSITE_REF: "main"

  BOARDS_PATH: "config/boards"
  BOARD_IMAGES_DIR: "board-images"
  VENDOR_LOGOS_DIR: "board-vendor-logos"

  # Optional assets. A missing one is reported, but never fails the check.
  PINOUTS_DIR: "board-pinouts"
  SCHEMATICS_DIR: "board-schematics"
  INSTRUCTIONS_DIR: "board-instructions"

permissions:
  contents: read

jobs:
  Check:
    name: "Verify assets for newly added boards"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # Security: this runs as pull_request_target (trusted token/secrets). We do
      # NOT check out the fork's head into the working tree - checkout@v7 refuses
      # that as a "pwn request" risk. Instead we check out the trusted base and
      # fetch the PR head as bare objects; the steps below only read data from it
      # (git diff + git show), never execute fork code, so no unsafe opt-in is needed.
      - name: "Checkout build repo (base)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          # Defense-in-depth for pull_request_target: don't leave the privileged
          # GITHUB_TOKEN in .git/config. The PR-head fetch below is anonymous
          # (public repo) and the comment step uses secrets.GITHUB_TOKEN directly.
          persist-credentials: false

      - name: "Fetch PR head objects (no checkout)"
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/pr/head"

      - name: "Checkout armbian.github.io (images repo)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.WEBSITE_REPO }}
          ref: ${{ env.WEBSITE_REF }}
          path: website
          fetch-depth: 1
          persist-credentials: false # read-only checkout; don't retain the token in .git/config

      - name: "Find newly added board configs in PR"
        id: added
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          git diff --name-status "${BASE_SHA}" "${HEAD_SHA}" -- "${BOARDS_PATH}" \
            | awk '$1=="A"{print $2}' \
            | grep -E '\.(conf|csc|wip|tvb)$' \
            > added-files.txt || true

          echo "New board config files:"
          cat added-files.txt || true

          if [[ ! -s added-files.txt ]]; then
            echo "No new board configs detected."
            echo "none=true" >> "$GITHUB_OUTPUT"
          else
            echo "none=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Validate board assets exist on website repo"
        id: validate
        if: ${{ steps.added.outputs.none != 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          missing_any=0
          optional_missing=0
          comment_file="$(mktemp)"
          optional_file="$(mktemp)"

          {
            echo "This PR adds new board configuration(s). Required assets must already exist in [github/${WEBSITE_REPO}](https://github.com/${WEBSITE_REPO})."
            echo "They are required by [Armbian Imager](https://github.com/armbian/imager) to ensure all boards are displayed with proper images."
            echo ""
            echo "- Board images: \`${BOARD_IMAGES_DIR}/<board>.png\` (1920x1080 px transparent)"
            echo "- Vendor logos: \`${VENDOR_LOGOS_DIR}/<vendor>-logo.png\` (512x512 px transparent)"
            echo ""
            echo "### Missing items"
            echo ""
          } > "$comment_file"

          : > "$optional_file"

          while IFS= read -r cfg; do
            [[ -z "${cfg}" ]] && continue

            file="$(basename "$cfg")"
            board="${file%.*}"

            vendor="$(
              git show "${HEAD_SHA}:${cfg}" 2>/dev/null \
              | grep -E '^[[:space:]]*(export[[:space:]]+|declare[[:space:]]+-g[[:space:]]+)?BOARD_VENDOR[[:space:]]*=' -m1 \
              | sed -E 's/^[[:space:]]*(export[[:space:]]+|declare[[:space:]]+-g[[:space:]]+)?BOARD_VENDOR[[:space:]]*=[[:space:]]*//; s/^"//; s/"$//' \
              | tr '[:upper:]' '[:lower:]' \
              | tr '_' '-' \
              | awk 'NF{print; exit}' \
              || true
            )"

            board_img_match="$(find "website/${BOARD_IMAGES_DIR}" -maxdepth 1 -type f -iname "${board}.png" | head -n1 || true)"

            if [[ -z "${board_img_match}" ]]; then
              {
                echo "- ❌ **Board image missing** for \`${board}\`"
                echo "  - Expected: \`${BOARD_IMAGES_DIR}/${board}.png\`"
                echo "  - Fix: add the file to **${WEBSITE_REPO}** (folder \`${BOARD_IMAGES_DIR}/\`)"
                echo ""
              } >> "$comment_file"
              missing_any=1
            fi

            if [[ -z "${vendor}" ]]; then
              {
                echo "- ❌ **BOARD_VENDOR not found** in \`${cfg}\`"
                echo "  - Fix: add e.g. \`BOARD_VENDOR=\"radxa\"\` (lowercase recommended)"
                echo ""
              } >> "$comment_file"
              missing_any=1
              continue
            fi

            found_logo="$(find "website/${VENDOR_LOGOS_DIR}" -maxdepth 1 -type f \
              \( -iname "${vendor}-logo.png" -o -iname "${vendor}-logo.jpg" -o -iname "${vendor}-logo.jpeg" -o -iname "${vendor}-logo.svg" \) \
              | head -n1 || true)"

            if [[ -z "${found_logo}" ]]; then
              {
                echo "- ❌ **Vendor logo missing** for vendor \`${vendor}\` (used by board \`${board}\`)"
                echo "  - Expected: \`${VENDOR_LOGOS_DIR}/${vendor}-logo.png\`"
                echo "  - Fix: add the file to **${WEBSITE_REPO}** (folder \`${VENDOR_LOGOS_DIR}/\`)"
                echo "  - Naming rules: lowercase, dashes (e.g. \`kobol-logo.png\`, not \`Kobol_logo.png\`)"
                echo ""
              } >> "$comment_file"
              missing_any=1
            fi

            # Optional assets. They improve the board page, but a board ships
            # without them. Never set missing_any here.
            for spec in "${PINOUTS_DIR}|png|pinout" \
                        "${SCHEMATICS_DIR}|pdf|schematic" \
                        "${INSTRUCTIONS_DIR}|md|instructions"; do
              IFS='|' read -r dir ext label <<< "${spec}"
              if ! find "website/${dir}" -maxdepth 1 -type f -iname "${board}.${ext}" 2>/dev/null | grep -q .; then
                echo "- \`${board}\`: no ${label} (\`${dir}/${board}.${ext}\`)" >> "$optional_file"
                optional_missing=1
              fi
            done
          done < added-files.txt

          if [[ "${optional_missing}" -ne 0 ]]; then
            {
              echo "### Optional items"
              echo ""
              echo "These are not required and do not block this PR. They add a pinout"
              echo "drawing, a schematic and board notes to the download page."
              echo ""
              cat "$optional_file"
              echo ""
            } >> "$comment_file"
          fi

          if [[ "${missing_any}" -ne 0 ]]; then
            echo "missing=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${optional_missing}" -ne 0 ]]; then
            echo "optional=true" >> "$GITHUB_OUTPUT"
          else
            echo "optional=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "${missing_any}" -ne 0 || "${optional_missing}" -ne 0 ]]; then
            echo 'comment<<EOF' >> "$GITHUB_OUTPUT"
            cat "$comment_file" >> "$GITHUB_OUTPUT"
            echo 'EOF' >> "$GITHUB_OUTPUT"
          fi

          # Only the required assets fail the check.
          if [[ "${missing_any}" -ne 0 ]]; then
            echo "::error::Missing required board assets (see PR comment)."
            exit 1
          fi

      - name: "Comment on PR with missing asset instructions"
        if: always() && github.event_name == 'pull_request_target' && steps.added.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_BODY: ${{ steps.validate.outputs.comment }}
          MISSING_REQUIRED: ${{ steps.validate.outputs.missing }}
          OPTIONAL_MISSING: ${{ steps.validate.outputs.optional }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          NO_NEW_BOARDS: ${{ steps.added.outputs.none }}
          WEBSITE_REPO: ${{ env.WEBSITE_REPO }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const missingRequired = process.env.MISSING_REQUIRED === 'true';
            const optionalMissing = process.env.OPTIONAL_MISSING === 'true';
            const hasFindings = missingRequired || optionalMissing;

            // The PR dropped its last new board config: the validation step is
            // skipped, so there is nothing to report, but a stale comment may
            // still be on the PR.
            const noNewBoards = process.env.NO_NEW_BOARDS === 'true';
            const validated = process.env.VALIDATION_OUTCOME === 'success';

            // A missing optional asset must not look like a failure.
            const header = missingRequired
              ? '### 🚫 Missing required board assets'
              : '### 💡 Optional board assets';

            const footer = missingRequired
              ? `Once the missing files are added (or a PR is opened in **${process.env.WEBSITE_REPO}**), re-run this check.`
              : `This check passed. The items above are optional and do not block this PR.`;

            // Hidden marker: identifies our own comment without matching the
            // headings, which other bots quote when they review this workflow.
            const MARKER = '<!-- armbian-board-assets-check -->';

            const body =
            `${MARKER}
            ${header}

            ${process.env.COMMENT_BODY}

            ${footer}
            `;

            // A later push can change the result. Keep one comment per PR and
            // make it match the current state.
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const botComment = comments.find(comment =>
                comment.user.login === 'github-actions[bot]' &&
                (comment.body.includes(MARKER) ||
                 // Comments written before the marker existed.
                 comment.body.trimStart().startsWith('### 🚫 Missing required board assets'))
              );

              if (hasFindings) {
                if (botComment) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: botComment.id,
                    body
                  });
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    body
                  });
                }
              } else if (botComment && (noNewBoards || validated)) {
                // Nothing is missing any more. Drop the comment when the
                // validation really ran, or when the PR no longer adds a board.
                // A crashed validation writes no outputs and must not look like
                // an all-clear.
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                });
              }
            } catch (error) {
              // Never fail this step. A missing required asset already failed
              // the validation step, and an optional one must not fail at all.
              core.warning(`Failed to update PR comment: ${error.message}`);
            }
