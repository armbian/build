name: "Maintenance: Auto-label PR"

# Sets labels automatically based on:
# - PR size from the changed lines (job: label-size)
# - File categories using .github/labeler config (job: label-category)
# - PR creation date for quarterly tracking (job: label-by-date)
# - Syncs "Ready to merge" with the approvals of the new head (job: label-remove)

run-name: 'Set labels - PR #${{ github.event.pull_request.number }} ("${{ github.event.pull_request.title }}")'

on: pull_request_target

# One run per PR at a time: a newer pending run replaces an older one.
concurrency:
  group: auto-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Grant required permissions globally
permissions:
  contents: read          # Required for checking changed files
  pull-requests: write    # Required for labeling PRs
  issues: write           # Required for adding/removing labels

jobs:
  label-remove:
    name: "Sync Ready to merge"
    # actions/labeler writes the whole label set from an earlier read.
    # Run after it, so it cannot restore a label that this job changes.
    needs: label-category
    if: ${{ !cancelled() && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize') }}
    # Same group as the approval job in maintenance-label-on-approval.yml:
    # one "Ready to merge" sync per PR at a time.
    concurrency:
      group: ready-label-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      # Base branch (pull_request_target): the shared label logic is trusted code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A push makes earlier approvals stale. Reconcile with the current head
      # instead of removing the label: this run can wait in the queue while a
      # committer approves the new head.
      - name: Sync "Ready to merge"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { syncOne } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/ready-label.js`);
            await syncOne({ github, core, owner: context.repo.owner, repo: context.repo.repo,
              number: context.payload.pull_request.number });

  label-category:
    name: "Category Labels"
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize' }}

    steps:
      # Checks out the repository to read files for matching with labeler config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Applies labels based on the .github/labeler.yml config
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"

  label-size:
    name: "Size Label"
    runs-on: ubuntu-latest
    # actions/labeler writes the whole label set from an earlier read.
    # Run after it, so it cannot restore a label that this job changes.
    needs: label-category
    if: ${{ !cancelled() && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize') }}

    steps:
      # Size from the PR totals: the files API returns only 30 files per page.
      - name: Label by size
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            // Current totals: runs of one PR can start out of push order.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: context.payload.pull_request.number });
            const lines = pr.additions + pr.deletions;
            const label = lines >= 250 ? "size/large" : lines >= 50 ? "size/medium" : "size/small";
            core.info(`PR #${pr.number}: ${lines} changed lines -> ${label}`);
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({ owner, repo, issue_number: pr.number, per_page: 100 });
            for (const l of labels) {
              if (l.name.startsWith("size/") && l.name !== label) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: l.name });
              }
            }
            if (!labels.some(l => l.name === label)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [label] });
            }

  label-by-date:
    name: "Date label (Quarters)"
    runs-on: ubuntu-latest
    # actions/labeler writes the whole label set from an earlier read.
    # Run after it, so it cannot restore a label that this job changes.
    needs: label-category
    if: ${{ !cancelled() && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize') }}

    steps:
      # Determines the label (02, 05, 08, 11) based on PR creation month
      - name: Determine quarter label
        env:
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
        run: |
          echo "PR created at: $PR_CREATED_AT"

          # Extract the numeric month (e.g., 04 for April)
          MONTH=$(date -d "$PR_CREATED_AT" +%m | sed 's/^0*//')
          echo "Month extracted: $MONTH"

          # Determine quarter-end label based on month
          if [ "$MONTH" -le 2 ] || [ "$MONTH" -eq 12 ]; then
            LABEL="02"
          elif [ "$MONTH" -le 5 ]; then
            LABEL="05"
          elif [ "$MONTH" -le 8 ]; then
            LABEL="08"
          else
            LABEL="11"
          fi

          # Set as environment variable for next step
          echo "LABEL=${LABEL}" >> $GITHUB_ENV

      # Adds the quarter label to the PR
      - name: Add quarter label
        uses: PauMAVA/add-remove-label-action@d1dae9b1a6c5b44b7740a3e7f64723fe7c9619d3 # v1.0.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          add: "${{ env.LABEL }}"
