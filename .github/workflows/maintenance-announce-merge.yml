name: "Maintenance: Announce merge"

on:
  pull_request_target:
    types: [ closed ]
    branches: [ main ]

permissions:
  contents: read

jobs:
  announcepush:
    # Do not run this workflow in forks. Announce merged PRs only.
    if: ${{ github.repository == 'armbian/build' && github.event.pull_request.merged }}
    runs-on: ubuntu-latest
    steps:
      - name: Send merge to Discord
        env:
          WEBHOOKURL: ${{ secrets.WEBHOOKURL }}
          AVATARURL: ${{ secrets.AVATARURL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          content=":white_check_mark: **Merged** into [$GITHUB_REPOSITORY](<$GITHUB_SERVER_URL/$GITHUB_REPOSITORY>) by [$MERGED_BY](<$GITHUB_SERVER_URL/$MERGED_BY>) - [Link](<$PR_URL>): *$PR_TITLE*"
          jq -n --arg avatar "$AVATARURL" --arg content "$content" \
            '{username: "Github", avatar_url: $avatar, content: $content, allowed_mentions: {parse: []}}' |
            curl -fsS -H "Content-Type: application/json" -X POST --data @- "$WEBHOOKURL"
