name: "Maintenance: Label merge conflicts"

# Keeps "Needs rebase" on open PRs that conflict with their base branch.
# A push to main can break PRs nobody touched, so every run rescans the open PRs.

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

concurrency:
  group: label-conflicts
  cancel-in-progress: true

jobs:
  label-conflicts:
    name: "Needs rebase"
    if: ${{ github.repository == 'armbian/build' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        with:
          dirtyLabel: "Needs rebase"
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
