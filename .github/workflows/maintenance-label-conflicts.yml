name: "Maintenance: Label merge conflicts"

# Keeps "Needs rebase" on open PRs that conflict with their base branch.
# A push to main can break PRs nobody touched, so every run rescans the open PRs.

on:
  push:
    branches:
      - main
  pull_request_target:
    # edited: a new base branch can add or clear a conflict.
    types: [opened, reopened, synchronize, edited]

permissions: {}

# One group per pull request (push: per branch). A new event cancels only the
# older run of the same pull request: runs of other pull requests stay, so
# they do not show as cancelled. Parallel scans only set the same labels.
concurrency:
  group: label-conflicts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  label-conflicts:
    name: "Needs rebase"
    if: ${{ github.repository == 'armbian/build' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        with:
          dirtyLabel: "Needs rebase"
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
